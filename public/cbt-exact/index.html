<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>컴활 1급 CBT</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#dce2ea;--blue:#1683ff;--blue2:#eaf4ff;--ok:#159447;--bad:#e5484d;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand{font-size:28px;font-weight:950;letter-spacing:-.04em}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:15px;min-height:48px;padding:0 16px;font-size:16px;font-weight:850;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blue2);border-color:transparent;color:#0a6edb}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,32,55,.025)}.hero h1{font-size:28px;margin:0 0 7px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;text-align:left;font-size:18px;font-weight:900;min-height:108px}.menu small{display:block;color:var(--muted);font-size:13px;font-weight:650;margin-top:7px;line-height:1.4}.exam{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.tag{padding:6px 10px;border-radius:999px;background:var(--blue2);color:#0a6edb;font-size:12px;font-weight:850}.qcard{padding:18px}.qhead{display:flex;align-items:center;gap:8px;margin-bottom:13px}.qnum{font-size:23px;font-weight:950}.subject{font-size:14px;color:var(--muted)}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:16px}.progress>div{height:100%;background:#2f6fed}.source-note{font-size:12px;color:var(--muted);margin-bottom:10px}.canvasWrap{background:#fff;border-radius:14px;overflow:hidden;min-height:120px;display:grid;place-items:center}.canvasWrap canvas{display:block;width:100%;height:auto}.loading{padding:40px 10px;color:var(--muted);font-weight:750}.answerTitle{font-size:13px;color:var(--muted);font-weight:800;margin:14px 0 8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:1px solid var(--line);background:#fff;border-radius:18px;min-height:58px;font-size:24px;font-weight:900;color:#1283ff}.answer.sel{background:#eaf4ff;border-color:#1683ff}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.answered{margin-top:12px;font-size:14px;color:var(--muted)}.score{font-size:52px;font-weight:950;letter-spacing:-.05em}.pass{color:var(--ok)}.fail{color:var(--bad)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.scorecard{background:#f7f9fc;border-radius:16px;padding:13px}.scorecard span{font-size:12px;color:var(--muted)}.scorecard b{display:block;font-size:22px;margin-top:4px}.scorecard small{font-size:11px}.chart{height:210px;display:flex;gap:9px;align-items:flex-end;overflow-x:auto;padding:14px 4px 28px;border-bottom:1px solid var(--line)}.barwrap{height:100%;min-width:42px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.bar{background:#2f6fed;border-radius:8px 8px 3px 3px;min-height:3px}.barlabel{font-size:10px;color:var(--muted);margin-top:5px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}.stat b{display:block;font-size:26px;margin-top:4px}.reviewLine{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{padding:8px 11px;border-radius:12px;font-size:14px;font-weight:850}.badge.mine{background:#fff0f1;color:#c9363d}.badge.correct{background:#edf9f1;color:#12803c}.reviewActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.yearbar{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.pill{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800}.pill.on{background:#111827;color:white;border-color:#111827}.hidden{display:none!important}.warn{background:#fff9e8;border:1px solid #f5d980;border-radius:18px;padding:14px;font-size:13px;line-height:1.5;color:#665018}
@media(max-width:520px){.wrap{padding-left:14px;padding-right:14px}.brand{font-size:24px}.grid{grid-template-columns:1fr 1fr}.card{border-radius:22px}.scores{grid-template-columns:1fr}.qcard{padding:16px}.canvasWrap{margin:0 -2px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="brand">컴활 1급 CBT</div><div class="spacer"></div><button id="homeBtn" class="btn soft hidden">홈</button></div><main id="app"></main></div>
<script src="media/manifest.js"></script>
<script>
const app=document.getElementById('app'),homeBtn=document.getElementById('homeBtn');
const SUBJECTS=['컴퓨터 일반','스프레드시트 일반','데이터베이스 일반'];
const MARK=['','①','②','③','④'];
const loaded=new Map(); window.CBT_MEDIA=window.CBT_MEDIA||{};
let exam=null,questions=[],answers=[],idx=0,examTitle='',mode='home';
const HKEY='cbt-exact-history-v1',WKEY='cbt-exact-wrong-v1';
function history(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return[]}}
function wrongs(){try{return JSON.parse(localStorage.getItem(WKEY)||'[]')}catch{return[]}}
function saveWrongs(v){localStorage.setItem(WKEY,JSON.stringify(v.slice(-600)))}
function sortManifest(){return [...CBT_MANIFEST].sort((a,b)=>b.id.localeCompare(a.id))}
function home(){mode='home';homeBtn.classList.add('hidden');app.innerHTML=`<section class="card hero"><h1>컴퓨터활용능력 1급 필기</h1><div class="muted">2020~2026 · 기출 29회 · 원본 PDF 그대로</div></section><section class="grid"><button class="menu" onclick="showExams()">기출 회차<small>원본 문제 60문제씩</small></button><button class="menu" onclick="randomTest()">랜덤 60문제<small>전체 회차에서 무작위</small></button><button class="menu" onclick="wrongNote()">오답노트<small>틀린 문제 원문 다시보기</small></button><button class="menu" onclick="stats()">내 성적<small>과목별 점수·누적 그래프</small></button></section><section class="card" style="margin-top:14px"><b>합격 기준</b><div class="muted" style="margin-top:6px">각 과목 40점 이상 + 전 과목 평균 60점 이상</div></section><div class="warn">문제는 텍스트 변환본이 아니라 업로드한 기출 PDF의 인쇄면을 그대로 보여줘. 표·수식·그림·보기 순서가 원본과 동일해.</div>`}
homeBtn.onclick=home;
function showExams(year='all'){homeBtn.classList.remove('hidden');const list=sortManifest();const years=['all',...new Set(list.map(x=>x.id.slice(0,4)))];const filtered=year==='all'?list:list.filter(x=>x.id.startsWith(year));app.innerHTML=`<div class="yearbar">${years.map(y=>`<button class="pill ${y===year?'on':''}" onclick="showExams('${y}')">${y==='all'?'전체':y}</button>`).join('')}</div><section class="card"><b>기출 회차 선택</b><div class="muted" style="margin-top:4px">회차를 누르면 원본 문제로 시작해.</div></section>`+filtered.map(e=>`<button class="card exam" onclick="startExam('${e.id}')"><div><b>${e.title}</b><div class="muted">60문제 · 3과목</div></div><span class="tag">시작</span></button>`).join('')}
function loadExam(id){if(window.CBT_MEDIA[id])return Promise.resolve(window.CBT_MEDIA[id]);if(loaded.has(id))return loaded.get(id);const p=new Promise((res,rej)=>{const s=document.createElement('script');s.src=`media/${id}.js?v=exact1`;s.onload=()=>window.CBT_MEDIA[id]?res(window.CBT_MEDIA[id]):rej(new Error('데이터 로드 실패'));s.onerror=()=>rej(new Error('문제 원본을 불러오지 못했어'));document.head.appendChild(s)});loaded.set(id,p);return p}
async function startExam(id){const meta=CBT_MANIFEST.find(x=>x.id===id);examTitle=meta.title;questions=Array.from({length:60},(_,i)=>({examId:id,n:i+1,s:i<20?1:i<40?2:3,a:meta.answers[i]}));answers=Array(60).fill(0);idx=0;mode='exam';homeBtn.classList.remove('hidden');await renderQ()}
function randomTest(){const pool=CBT_MANIFEST.flatMap(e=>e.answers.map((a,i)=>({examId:e.id,title:e.title,n:i+1,s:i<20?1:i<40?2:3,a})));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}questions=pool.slice(0,60);answers=Array(60).fill(0);idx=0;examTitle='랜덤 모의고사';mode='exam';homeBtn.classList.remove('hidden');renderQ()}
async function drawCurrent(){const q=questions[idx],box=document.getElementById('canvasBox');if(!box)return;box.innerHTML='<div class="loading">원본 문제 불러오는 중…</div>';try{const ex=await loadExam(q.examId);const qm=ex.q[q.n-1],src=ex.pages[String(qm.page)],im=new Image();im.onload=()=>{if(!document.getElementById('canvasBox'))return;const [x0,y0,x1,y1]=qm.r,sc=ex.scale;const sx=x0*sc,sy=y0*sc,sw=(x1-x0)*sc,sh=(y1-y0)*sc;const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);box.innerHTML='';box.appendChild(c)};im.onerror=()=>box.innerHTML='<div class="loading">원본 이미지 로드 실패</div>';im.src=src}catch(e){box.innerHTML='<div class="loading">'+e.message+'</div>'}}
async function renderQ(){const q=questions[idx],meta=CBT_MANIFEST.find(x=>x.id===q.examId);app.innerHTML=`<section class="card qcard"><div class="qhead"><span class="qnum">${idx+1}/${questions.length}</span><span class="subject">${SUBJECTS[q.s-1]} · ${meta?.title||q.title||''}</span></div><div class="progress"><div style="width:${(idx+1)/questions.length*100}%"></div></div><div class="source-note">원본 PDF 문제</div><div id="canvasBox" class="canvasWrap"></div><div class="answerTitle">정답 선택</div><div class="answers">${[1,2,3,4].map(n=>`<button class="answer ${answers[idx]===n?'sel':''}" onclick="pick(${n})">${MARK[n]}</button>`).join('')}</div><div class="nav"><button class="btn" onclick="go(-1)" ${idx===0?'disabled':''}>이전</button><button class="btn primary" onclick="go(1)">${idx===questions.length-1?'채점하기':'다음'}</button></div><div class="answered">답한 문제 ${answers.filter(Boolean).length}/${questions.length}</div></section>`;drawCurrent()}
function pick(n){answers[idx]=n;renderQ()}
function go(d){if(d===1&&idx===questions.length-1)return grade();idx=Math.max(0,Math.min(questions.length-1,idx+d));renderQ();window.scrollTo({top:0,behavior:'instant'})}
function grade(){let sub=[0,0,0],tot=[0,0,0];const rows=questions.map((q,i)=>({q,my:answers[i],ok:answers[i]===q.a}));rows.forEach(r=>{tot[r.q.s-1]++;if(r.ok)sub[r.q.s-1]++});const pct=sub.map((v,i)=>Math.round(v/(tot[i]||1)*100));const avg=Math.round(pct.reduce((a,b)=>a+b,0)/3),pass=pct.every(v=>v>=40)&&avg>=60,correct=rows.filter(r=>r.ok).length;let h=history();h.push({date:new Date().toISOString(),title:examTitle,score:avg,pct,correct,total:questions.length,pass});localStorage.setItem(HKEY,JSON.stringify(h.slice(-80)));let w=wrongs();rows.filter(r=>!r.ok).forEach(r=>{const key=`${r.q.examId}-${r.q.n}`;w=w.filter(x=>x.key!==key);w.push({key,q:r.q,my:r.my})});saveWrongs(w);mode='result';app.innerHTML=`<section class="card"><div class="muted">${examTitle}</div><div class="${pass?'pass':'fail'}" style="font-size:23px;font-weight:950;margin-top:5px">${pass?'합격':'불합격'}</div><div class="score">${avg}점</div><div class="muted">${correct}/${questions.length} 정답</div><div class="scores">${SUBJECTS.map((s,i)=>`<div class="scorecard"><span>${s}</span><b>${pct[i]}점</b><small>${pct[i]>=40?'과락 통과':'과락'}</small></div>`).join('')}</div></section><section class="card"><b>과목별 점수</b><div class="chart">${pct.map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v}%"></div><div class="barlabel">${i+1}과목<br>${v}</div></div>`).join('')}</div></section><section class="card"><div class="reviewActions"><button class="btn primary" onclick="reviewCurrent()">오답 보기</button><button class="btn" onclick="stats()">성적 통계</button></div></section>`}
function reviewCurrent(){const list=questions.map((q,i)=>({q,my:answers[i]})).filter(x=>x.my!==x.q.a);showReview(list,0)}
async function showReview(list,k){if(!list.length){app.innerHTML='<section class="card"><b>오답 없음 🎉</b></section>';return}const x=list[k],q=x.q,meta=CBT_MANIFEST.find(e=>e.id===q.examId);window._review=list;app.innerHTML=`<section class="card qcard"><div class="qhead"><span class="qnum">오답 ${k+1}/${list.length}</span><span class="subject">${meta?.title||''} · ${q.n}번</span></div><div id="canvasBox" class="canvasWrap"></div><div class="reviewLine"><span class="badge mine">내 답 ${x.my?MARK[x.my]:'미선택'}</span><span class="badge correct">정답 ${MARK[q.a]}</span></div><div class="muted" style="margin-top:10px">문제·보기는 원본 PDF 그대로 표시돼.</div><div class="reviewActions"><button class="btn" onclick="showReview(window._review,${Math.max(0,k-1)})">이전</button><button class="btn primary" onclick="showReview(window._review,${Math.min(list.length-1,k+1)})">다음</button></div></section>`;const oldQ=questions,oldIdx=idx;questions=[q];idx=0;await drawCurrent();questions=oldQ;idx=oldIdx}
function wrongNote(){homeBtn.classList.remove('hidden');const w=wrongs();if(!w.length){app.innerHTML='<section class="card"><b>아직 저장된 오답이 없어.</b></section>';return}showReview(w.map(x=>({q:x.q,my:x.my})),0)}
function stats(){homeBtn.classList.remove('hidden');const h=history();if(!h.length){app.innerHTML='<section class="card"><b>아직 시험 기록이 없어.</b><div class="muted" style="margin-top:6px">한 회차를 풀면 그래프가 생겨.</div></section>';return}const avg=Math.round(h.reduce((s,x)=>s+x.score,0)/h.length),best=Math.max(...h.map(x=>x.score)),passes=h.filter(x=>x.pass).length,sa=[0,1,2].map(i=>Math.round(h.reduce((s,x)=>s+(x.pct?.[i]||0),0)/h.length));app.innerHTML=`<section class="statgrid"><div class="stat"><span class="muted">응시</span><b>${h.length}회</b></div><div class="stat"><span class="muted">평균</span><b>${avg}점</b></div><div class="stat"><span class="muted">최고</span><b>${best}점</b></div><div class="stat"><span class="muted">합격</span><b>${passes}회</b></div></section><section class="card" style="margin-top:14px"><b>최근 점수 추이</b><div class="chart">${h.slice(-12).map((x,i)=>`<div class="barwrap"><div class="bar" style="height:${x.score}%"></div><div class="barlabel">${i+1}<br>${x.score}</div></div>`).join('')}</div></section><section class="card"><b>과목별 평균</b><div class="scores">${SUBJECTS.map((s,i)=>`<div class="scorecard"><span>${s}</span><b>${sa[i]}점</b></div>`).join('')}</div></section>`}
home();
</script>
</body></html>
