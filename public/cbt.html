확인할 수 있다 RAM .","설치된 시스템 종류를 비트나 비트 운영체제로 변경할 32 64","수 있다. 컴퓨터의 이름을 확인하거나 변경할 수 있다.",""]},{"n":7,"s":1,"a":3,"p":"7. 다음 중 컴퓨터에서 사용하는 장치에 대한 설명으로 옳은 USB 것은? 는 플러그 앤 플레이 기능을 지원하는 범용 USB (Plug & Play)","c":["병렬 인터페이스이다. 장치를 연결하거나 연결을 끊을 때는 재부팅해야 한다 USB .","포트가 파랑색인 경우 규격이지만 하위 버전도 USB USB 3.0","지원한다. 는 주변장치를 최대 개까지 연결할 수 있고많은 장 USB 127 ,","치를 연결해도 전송 속도는 동일하다."]},{"n":8,"s":1,"a":2,"p":"8. 다음 중 인터넷에서 사용하는 에 대한 설명으로 옳지 않은 TCP/IP 것은? 응용 계층전송 계층인터넷 계층링크 계층으로 이루어져 , , ,","c":["있다. 전송 계층은 응용 프로그램 간의 데이터 송수신을 제공하며 · ,","등의 프로토콜을 포함한다 TELNET, FTP, SMTP . 일부 망에 장애가 있어도 다른 망으로 통신이 가능한 신뢰성을","제공한다. 계층에서 는 전송 계층 는 네트워크 계층에 해당 OSI 7 TCP , IP","한다."]},{"n":9,"s":1,"a":4,"p":"9. 다음 중 전자우편 에 대한 설명으로 옳지 않은 것은 (E-mail) ? 한 사람이 동시에 여러 사람에게 전자우편을 보낼 수 있다.","c":["전체 회신은 받은 메일에 대한 답장을 발송자는 물론 참조인들","에게도 전송하는 기능이다. 는 로컬 서버에서 프로그램을 이용하여 전자우편을 액 IMAP","세스하기 위한 표준 프로토콜이다. 는 메일 서버에 도착한 이메일을 사용자 컴퓨터로 가져 SMTP","올 수 있도록 메일 서버에서 제공하는 프로토콜이다."]},{"n":10,"s":1,"a":3,"p":"- 10. 다음 중 에 대한 설명으 RAID(Redundant Array Of Inexpensive Disk) 로 옳지 않은 것은? 여러 개의 하드디스크를 하나의 저장장치처럼 관리하는 기술","c":["이다.","","",""]},{"n":11,"s":1,"a":1,"p":"11. 다음 중 캐시 메모리 에 관한 설명으로 옳은 것은 (Cache Memory) ? 중앙처리장치와 주기억장치 사이에 위치하여 컴퓨터의 처리","c":["속도를 향상시킨다. 캐시 메모리는 주로 을 사용한다 DRAM .","보조기억장치의 일부를 주기억장치처럼 사용한다.","주기억장치보다 큰 프로그램을 불러와 실행해야 할 때 유용하","다."]},{"n":12,"s":1,"a":2,"p":"12. 다음 중 개인용 컴퓨터의 바이오스 에 관한 설명으로 옳지 (BIOS) 않은 것은? 컴퓨터의 기본 입출력장치나 메모리 등 하드웨어 작동에 필요","c":["한 명령들을 모아 놓은 프로그램이다. 바이오스는 하드디스크에 저장되어 있는 운영체제의 일부이","다. 바이오스는 부팅할 때 를 통해 컴퓨터를 점검한 후에 POST","사용 가능한 장치를 초기화한다. 하드디스크 타입이나 부팅 순서와 같이 바이오스에서 사용하","는 일부 정보는 에서 설정이 가능하다 CMOS ."]},{"n":13,"s":1,"a":3,"p":"13. 다음 중 공공기관 등에서 터치 패널을 이용하여 운영되는 무인 종합 정보 단말기는? 주문형 비디오(VOD)","c":["화상회의 시스템(VCS)","키오스크(Kiosk)","CAI(Computer Assisted Instruction)",""]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 보안과 관련된 용어에 대한 설명으로 옳은 것은? 은 웹 보안 프로토콜 SET(Secure Electronic Transaction)","c":["로전자서명암호화 통신 등을 통해 보안을 구현한다 , , . 는 사가 개발한 프로토콜로 PGP(Pretty Good Privacy) EIT ,","기존의 에 보안 요소를 추가함으로써 취약점을 보완한 HTTP 것이다. 은 인터넷 상거래 시 필요한 개인 SSL(Secure Socket Layer)","정보를 보호하기 위한 개인 정보 유지 프로토콜이다. 은 신용카드를 사용하여 안전 PEM(Privacy Enhanced Mail)","하게 상거래를 할 수 있도록 보장해 주는 지불프로토콜이다."]},{"n":15,"s":1,"a":1,"p":"15. 다음 중 바이러스에 대한 설명으로 옳지 않은 것은? 컴퓨터 하드웨어와 무관하게 소프트웨어에만 영향을 미친다.","c":["감염 부위에 따라 부트 바이러스와 파일 바이러스로 구분한다.","사용자 몰래 스스로 복제하여 다른 프로그램을 감염시키고,","정상적인 프로그램이나 다른 데이터 파일 등을 파괴한다. 주로 복제품을 사용하거나 통신 매체를 통하여 다운받은 프로","그램에 의해 감염된다."]},{"n":16,"s":1,"a":3,"p":"- 16. 다음 중 컴퓨터에서 문자를 표현하는 코드 체계에 대한 설명으로 옳은 것은? 개의 비트와 개의 비트로 구성되며 Unicode : 2 Zone 4 Digit ,","c":["개의 문자를 표현할 수 있다 64 . 코드 비트를 사용하여 문자를 표현하며대형 컴퓨터 BCD : 8 ,","에서 사용한다.","",""]},{"n":17,"s":1,"a":3,"p":"17. 다음 중 프로그램을 직접 감염시키지 않고 디렉터리 영역에 저장된 프로그램의 시작 위치를 바이러스의 시작 위치로 변경하는 파일 바이러스 유형은? 기생형 바이러스","c":["산란형 바이러스","연결형 바이러스","겹쳐쓰기형 바이러스",""]},{"n":18,"s":1,"a":1,"p":"18. 다음 중 시스템 소프트웨어에 대한 설명으로 옳지 않은 것은? 사용자가 컴퓨터를 이용하여 특정 업무를 처리할 수 있게 개발","c":["된 프로그램이다. 시스템 소프트웨어는 제어 프로그램과 처리 프로그램으로 구","분된다. 컴퓨터 시스템을 효율적으로 운영해 주는 소프트웨어이다.","대표적인 시스템 소프트웨어로는 운영체제가 있다.",""]},{"n":19,"s":1,"a":4,"p":"19. 다음 중 채널 에 대한 설명으로 옳은 것은 (Channel) ? 저속의 출력장치를 고속의 중앙처리장치 와 병행 처리 (CPU)","c":["할 때 컴퓨터 전체의 처리 효율을 높이기 위해 사용하는 기능 이다. 프로그램을 실행하는 도중에 예기치 않은 상황이 발생할 경우","현재 실행중인 작업을 일시 중단하고발생된 상황을 우선 처 , 리한 후 실행중이던 작업으로 복귀하여 계속 처리하는 것이 다. 둘 이상의 프로세스들이 자원을 점유한 상태에서 서로 다른","프로세스가 점유하고 있는 자원을 요구하며 무한정 기다리는 현상이다. 고속의 데이터 전송을 위하여 입출력만을 목적으로 만든 처리","기로 라고도 불린다 , IOP(Input Output Processor) ."]},{"n":20,"s":1,"a":4,"p":"20. 다음 중 의 설정 네트워크 및 인터넷에 대한 설명으 Windows [ ] [ ] → 로 옳지 않은 것은? 현재 네트워크 상태를 확인할 수 있다.","c":["앱별 데이터 사용량을 확인할 수 있다.","사용 가능한 네트워크를 표시할 수 있다.","자동 업데이트 사용을 설정할 수 있다 Windows .","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":4,"p":"21. 다음 중 엑셀의 틀 고정에 대한 기능 설명으로 옳지 않은 것은? 틀 고정 방법으로 첫 행 고정을 실행하면 선택된 셀의 위치와","c":["상관없이 첫 행이 고정된다. 틀 고정은 특정 행 또는 열을 고정할 때 사용하는 기능으로,","주로 표의 제목 행 또는 제목 열을 고정한 후 작업할 때 유용하 다. 선택된 셀의 왼쪽 열과 바로 위의 행이 고정된다.","틀 고정 구분선을 마우스로 잡아끌어 틀 고정 구분선을 이동시","킬 수 있다."]},{"n":22,"s":2,"a":3,"p":"- 아래 시트와 같이 고급 필터를 실행 했을 경우 추출되지 않는 22. 이름은?","c":["","","",""]},{"n":23,"s":2,"a":3,"p":"23. 다음과 같은 이벤트를 실행시켰을 때 나타나는 결과로 옳은 것은? Private Sub 영역을 셀의 왼쪽에 복사한다 [B2:C3] .","c":["영역을 삭제한 후 왼쪽에 있는 셀을 오른쪽으로 이동 [B2:C3]","한다. 영역을 삭제한 후 오른쪽에 있는 셀을 왼쪽으로 이동 [B2:C3]","한다. 영역을 셀의 오른쪽에 복사한다 [B2:C3] .",""]},{"n":24,"s":2,"a":2,"p":"24. 다음 중 엑셀의 정렬 기능에 대한 설명으로 옳지 않은 것은? 영숫자 텍스트는 왼쪽에서 오른쪽 방향으로 문자 단위로 정렬","c":["된다. 사용자가 정렬 옵션대화상자에서 대소문자를 구분하도록 [ ] /","변경하여오름차순으로 정렬하면 대문자가 소문자보다 우선 , 순위를 갖는다. 공백으로 시작하는 문자열은 오름차순 정렬일 때 숫자 바로","다음에 정렬되고내림차순 정렬일 때는 숫자 바로 앞에 정렬 , 된다. 오름차순 정렬과 내림차순 정렬 모두 빈 셀은 항상 마지막으로","정렬된다."]},{"n":25,"s":2,"a":1,"p":"- 아래 워크시트에서 자격증 응시자에 대한 과목별 점수의 합계를 25. 배열 수식으로 구하였다다음 중 셀에 입력된 배열 수식으로 . [C10] 옳은 것은? {=SUM(IF($B$2:$B$7=B10,$C$2:$C$7))}","c":["{=SUM(IF(MOD(ROW($C$2:$C$7),2)=1,$C$2:$C$7))}","{=SUM(IF(C2:C7, B2:B7=B10))}","{=SUM(IF(MOD(ROWS(C2:C7),2)=0,C2:C7))}",""]},{"n":26,"s":2,"a":2,"p":"26. 다음 중 워크시트에 데이터를 입력하는 방법에 대한 설명으로 옳지 않은 것은? 날짜 데이터를 입력하면 기본적으로 셀의 오른쪽에 정렬된다.","c":["과 같이 입력하면 기본적으로 셀의 오른쪽에 정렬된다 ‘3 .","수식 또는 함수 식을 입력할 때는 기호를 붙여 입력한다 = .","여러 개의 셀에 동일한 데이터를 한번에 입력할 때 범위는","연속적으로 지정하지 않아도 된다."]},{"n":27,"s":2,"a":4,"p":"27. 다음 중 아래 차트에 대한 설명으로 옳지 않은 것은? 판매 현황이라는 차트 제목이 표시되어 있다 ‘ ’ .","c":["수량계열을 보조 축으로 지정하였다 ‘ ’ .","데이터 테이블에 범례 표지가 표시되어 있다.","수량계열에 데이터 레이블이 가운데로 표시되어 있다 ‘ ’ ‘ ’ .",""]},{"n":28,"s":2,"a":4,"p":"숫자 을 입력한 후 아래의 표시 형식을 적용했을 때 표시되는 28. -24600 결과로 옳은 것은? 천원 천원 님 #0.0,“ ”;(#0.0,“ ”);0.0;@“ ” 천원 24.6","c":["24,600","천원 (-24.6 )","천원 (24.6 )",""]},{"n":29,"s":2,"a":2,"p":"29. 다음 중 워크시트 이름으로 적절하지 않은 것은? 매출실적 _","c":["매출실적?","매출실적 #","매출실적&",""]},{"n":30,"s":2,"a":1,"p":"30. 다음 중 원을 년간 연 의 이자율로 대출할 때 10,000,000 2 5.5% , 매월 말 상환해야 할 불입액을 구하기 위한 수식으로 옳은 것은? =PMT(5.5%/12, 12*2, -10000000)","c":["=PMT(5.5%, 12*2, -10000000)","=PMT(5.5%, 12*2, -10000000,0,1)","=PMT(5.5%/12, 12*2, -10000000,0,1)",""]},{"n":31,"s":2,"a":1,"p":"31. 다음 중 부분합에 대한 설명 중 옳지 않은 것은? 그룹화할 항목으로 선택된 필드는 자동으로 오름차순 정렬하","c":["여 부분합이 계산된다. 부분합에서는 합계평균개수 등의 함수 이외에도 다양한 , ,","함수를 선택할 수 있다. 부분합에서 데이터 아래에 요약을 표시할 수 있다.","부분합에서 그룹 사이에 페이지를 나눌 수 있다.",""]},{"n":32,"s":2,"a":1,"p":"- 32. 다음 중 시나리오에 대한 설명으로 옳지 않은 것은? 시나리오 요약 보고서를 만들 때에는 결과 셀을 반드시 지정해","c":["야 하지만시나리오 피벗 테이블 보고서를 만들 때에는 결과 , 셀을 지정하지 않아도 된다. 여러 시나리오를 비교하여 하나의 테이블로 요약하는 보고서","를 만들 수 있다. 시나리오 요약 보고서를 생성하기 전에 변경 셀과 결과 셀에","이름을 정의하면 셀 참조 주소 대신 정의된 이름이 보고서에",""]},{"n":33,"s":2,"a":2,"p":"33. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는 데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단계에 포함되지 않는다. 개인용 매크로 통합 문서에 저장한 매크로는 엑셀을 시작할","때마다 자동으로 로드되므로 다른 통합 문서에서도 실행할 수 있다."]},{"n":34,"s":2,"a":3,"p":"다음 중 아래 시트에서 각 수식을 실행했을 때의 결과 값으로 34. 옳은 것은? =SUM(COUNTA(B2:D4), MAXA(B2:D4)) 102","c":["→ =AVERAGE(SMALL(C2:C4, 2), LARGE(C2:C4, 2)) 75","→ =SUM(LARGE(B3:D3, 2), SMALL(B3:D3, 2)) 174","→ =SUM(COUNTA(B2, D4), MINA(B2, D4)) 109","→"]},{"n":35,"s":2,"a":1,"p":"35. 다음 중 엑셀의 오차 막대에 대한 설명으로 옳지 않은 것은? 세로 막대형 차트꺾은선형 차트분산형 차트거품형 차트 , , , ,","c":["차원 세로 막대형 차트 차원 꺾은선형 차트에 오차 막대를 3 , 3 표시할 수 있다. 차트에 고정값백분율표준 편차표준 오차사용자 지정 , , , ,","중 하나를 선택하여 오차량을 표시할 수 있다. 데이터 계열의 각 데이터 표식에 대한 오류 가능성이나 불확실","성의 정도를 표시한다. 분산형과 거품형 차트에는 세로 오차 막대가로 오차 막대를 ,","적용할 수 있다."]},{"n":36,"s":2,"a":2,"p":"- 36. 영역에 대해 조건부 서식의 수식 규칙을 다음과 같이 [A1:C3] 설정할 경우 결과 화면으로 옳은 것은? =MOD(ROW($A1),2)=MOD(COLUMN(A$1),2)","c":["","","",""]},{"n":37,"s":2,"a":3,"p":"37. 다음 중 통합에 관한 설명으로 옳지 않은 것은? 여러 시트에 있는 데이터나 다른 통합 문서에 입력되어 있는","c":["데이터를 통합할 수 있다. 데이터 통합은 위치를 기준으로 통합할 수도 있고영역의 ,","이름을 정의하여 통합할 수도 있다. 통합 영역의 데이터 변경 시 원본 영역의 데이터도 자동으로","변경되도록 하려면 원본 데이터에 연결을 선택한다 ‘ ’ . 통합할 데이터를 변경하려면 모든 참조 영역에 지정된 참조 ‘ ’","영역을 삭제한 후 새로 지정한다."]},{"n":38,"s":2,"a":3,"p":"38. 다음 중 보기탭의 페이지 나누기 미리 보기에 대한 설명으로 [ ] [ ] 옳지 않은 것은? 페이지 나누기는 구분선을 이용하여 인쇄를 위한 페이지 나누","c":["기를 빠르게 조정하는 기능이다. 행 높이와 열 너비를 변경하면 자동 페이지 나누기의 위치도","변경된다. 페이지 나누기 미리 보기에서 수동으로 삽입된 페이지 나누 [ ]","기는 파선으로 표시되고 자동으로 추가된 페이지 나누기는 실선으로 표시된다. 용지 크기여백 설정배율 옵션 등에 따라 자동 페이지 나누기 , ,","가 삽입된다."]},{"n":39,"s":2,"a":1,"p":"39. 다음 중 인쇄 미리 보기 및 인쇄화면에서 페이지 설정을 클릭하여 ‘ ’ ‘ ’ 설정할 수 있는 내용으로 틀린 것은? 인쇄 영역을 설정하여 인쇄할 수 있다.","c":["워크시트의 행 머리글과 열 머리글을 포함하여 인쇄할 수 있","다. 워크시트에 삽입되어 있는 차트도형그림 등의 모든 그래픽 , ,","요소를 제외하고 텍스트만 빠르게 인쇄할 수 있다. 셀에 표시된 오류가 인쇄되지 않도록 설정할 수 있다.",""]},{"n":40,"s":2,"a":1,"p":"- 40. 다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은? 원본 데이터가 변경되면 피벗 테이블의 데이터도 자동으로","c":["변경된다. 외부 데이터를 대상으로 피벗 테이블을 작성할 수 있다.","피벗 테이블을 작성한 후에 사용자가 새로운 수식을 추가하여","표시할 수 있다. 많의 양의 자료를 분석하여 다양한 형태로 요약하여 보여주는","기능이다."]},{"n":41,"s":3,"a":2,"p":"다음 중 데이터베이스의 특징으로 옳지 않은 것은 41. ? 다수의 이용자들이 서로 상이한 목적으로 동일 데이터를 공유","c":["데이터의 검색이나 갱신이 효율적으로 이루어질 수 있도록","데이터의 중복을 최대화 특정 조직에서 필요한 정보를 얻기 위하여 필요한 데이터를","저장 효과적인 데이터 처리를 위한 구조화",""]},{"n":42,"s":3,"a":1,"p":"다음 중 보고서를 만드는 방법으로 제공되는 마법사 유형이 아닌 42. 것은? 하위 보고서 마법사","c":["업무 문서 양식 마법사","우편 엽서 마법사","보고서 마법사",""]},{"n":43,"s":3,"a":3,"p":"다음 중 테이블쿼리 등의 개체나 필드 이름을 지정하는 방법에 43. , 대한 설명으로 옳지 않은 것은? 공백을 이름의 첫 문자로 사용할 수 없다.","c":["과 같은 특수문자는 사용할 수 없다 ., !, ‘, [, ] .","테이블 이름과 필드 이름은 중복될 수 없다.","이름은 최대 자까지 입력할 수 있다 64 .",""]},{"n":44,"s":3,"a":1,"p":"다음의 입력 데이터에 대한 입력 마스크 적용 결과가 옳지 않은 44. 것은? 입력 데이터 : greeNgr388m3","c":["입력 마스크 : >L????L?000L0 화면 표시 : GREENgr388m3 입력 데이터 : MARIA","입력 마스크 : >L<???? 화면 표시 : Maria 입력 데이터 : ABCD","입력 마스크 : !CCC-CCCC 화면 표시 : -ABCD 입력 데이터 : 1419422187","입력 마스크 : (000)000-0000 화면 표시 : (141)942-2187"]},{"n":45,"s":3,"a":3,"p":"다음 중 나이를 저장하기에 알맞은 데이터 형식과 크기로 올바른 45. 것은? 데이터 형식 짧은 텍스트 크기 : : 2","c":["데이터 형식 짧은 텍스트 크기 : : 100","데이터 형식 숫자 크기 바이트 : :","데이터 형식 숫자 크기 정수 : : (Long)",""]},{"n":46,"s":3,"a":4,"p":"- 다음 중 폼에 대한 설명으로 옳지 않은 것은 46. ? 폼 내에서 단추를 눌렀을 때 매크로와 모듈이 특정 기능을","c":["수행하도록 할 수 있다. 일 대 다 관계에 있는 테이블이나 쿼리는 폼 안에 하위 폼을","작성할 수 있다. 폼과 컨트롤의 속성은 디자인 보기형식에서 속성 시트를 [ ] [ ]","이용하여 설정한다. 폼은 레코드 원본에 연결된 대상이 테이블인지 쿼리인지에","따라 바운드 폼과 언바운드 폼으로 구분된다."]},{"n":47,"s":3,"a":2,"p":"다음 중 학생테이블에서 점수가 이상인 학생들의 인원수를 47. [ ] ‘ ’ 60 구하는 식으로 옳은 것은 단 학번필드는 학생테이블의 ? ( , ‘ ’ [ ] 기본 키이다.) 학생 학번 점수 =DCount(“ ”, “ ”, “ >= 60”)","c":["학생 점수 =DCount(“*”, “ ”, “ >= 60”)","학생학번점수 =DCount( , , >= 60)","학번학생점수 =DCount( , , >= 60 보고서 마법사로 보고서를 만드는 과정에 대한 설명으로 56. [ ] 틀린 것은? 보고서 마법사는 정해진 절차에 따라 설정 사항을 지정하면","c":["보고서를 자동으로 만들어 준다. 그룹을 설정한 경우 보고서 모양을 단계블록외곽선 중에서 , ,","선택할 수 있다. 요약 옵션에서 모든 필드에 대해 합계평균개수 등의 함수 [ ] , ,","를 사용하여 값을 표시할 수 있다. 레코드 원본필드레이아웃서식 등을 직접 선택하여 보고서 , , ,","를 작성할 수 있다."]},{"n":57,"s":3,"a":1,"p":"다음 중 액세스에서 보고서를 출력미리보기인쇄하기 위한 57. ( / ) VBA 개체와 메서드로 옳은 것은? Docmd.OpenReport","c":["Report","Docmd.ReportPrint","Report.Open",""]},{"n":58,"s":3,"a":3,"p":"다음 중 액세스의 보고서에 대한 설명으로 옳은 것은 58. ? 보고서의 레코드 원본으로 테이블쿼리엑셀과 같은 외부 , ,","c":["데이터매크로 등을 지정할 수 있다 , . 보고서 머리글과 보고서 바닥글의 내용은 모든 페이지에 출력","된다. 보고서에서도 폼에서와 같이 이벤트 프로시저를 작성할 수","있다. 컨트롤을 이용하지 않고도 보고서에 테이블의 데이터를 표시","할 수 있다."]},{"n":59,"s":3,"a":1,"p":"- 다음 중 매크로 함수에 대한 설명으로 옳지 않은 것은 59. ? 조건에 맞는 모든 레코드를 검색한다 FindRecord : .","c":["테이블이나 쿼리로부터 레코드를 필터링한다 ApplyFilter : .","작성된 보고서를 호출하여 실행한다 OpenReport : .","메시지 상자를 통해 경고나 알림 등의 정보를 MessageBox :","표시한다."]},{"n":60,"s":3,"a":2,"p":"- 개체 속성 중 현재 레코드 위치가 개체의 60. RecordSet RecordSet 첫 번째 레코드 앞에 온다는 것을 나타내는 값을 반환하는 속성은 무엇인가? EOF","c":["BOF","RecordCount","Filter",""]}]}];
const $=s=>document.querySelector(s),app=$('#app'),homeBtn=$('#homeBtn');let mode='home',exam=null,qs=[],idx=0,ans=[],graded=false,filterWrong=false;const S=['컴퓨터 일반','스프레드시트 일반','데이터베이스 일반'];const C=['①','②','③','④'];
function store(){localStorage.setItem('com1-history',JSON.stringify(history()))}function history(){try{return JSON.parse(localStorage.getItem('com1-history')||'[]')}catch{return[]}}function saveWrong(list){localStorage.setItem('com1-wrong',JSON.stringify(list))}function wrongs(){try{return JSON.parse(localStorage.getItem('com1-wrong')||'[]')}catch{return[]}}
function home(){mode='home';homeBtn.classList.add('hidden');app.innerHTML=`<section class="card hero"><h1>컴퓨터활용능력 1급 필기</h1><div class="muted">2020~2026 기출 29회 · 모바일 CBT</div></section><section class="grid"><button class="menu" onclick="showExams()">기출 회차<span><small>회차별 60문제</small></span></button><button class="menu" onclick="randomTest()">랜덤 모의고사<span><small>전 회차에서 60문제</small></span></button><button class="menu" onclick="wrongNote()">오답노트<span><small>틀린 문제 다시보기</small></span></button><button class="menu" onclick="stats()">내 성적<span><small>점수 통계·그래프</small></span></button></section><section class="card" style="margin-top:12px"><b>합격 기준</b><div class="muted" style="margin-top:6px">각 과목 40점 이상 + 전 과목 평균 60점 이상</div></section>`}homeBtn.onclick=home;
function showExams(){homeBtn.classList.remove('hidden');app.innerHTML='<div class="card"><b>기출 회차 선택</b><div class="muted" style="margin-top:4px">원하는 회차를 눌러 시작하세요.</div></div>'+DATA.slice().reverse().map((e,i)=>`<button class="card exam" style="width:100%;text-align:left" onclick="startExam('${e.id}')"><div><b>${e.t}</b><div class="muted">60문제 · 3과목</div></div><span class="tag">시작</span></button>`).join('')}
function startExam(id){exam=DATA.find(e=>e.id===id);qs=exam.q.map(q=>({...q,e:exam.t,id:exam.id}));idx=0;ans=Array(qs.length).fill(0);graded=false;filterWrong=false;homeBtn.classList.remove('hidden');renderQ()}
function randomTest(){let all=DATA.flatMap(e=>e.q.map(q=>({...q,e:e.t,id:e.id})));for(let i=all.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}exam={id:'random',t:'랜덤 모의고사'};qs=all.slice(0,60);idx=0;ans=Array(60).fill(0);graded=false;homeBtn.classList.remove('hidden');renderQ()}
function renderQ(){let q=qs[idx],a=ans[idx];app.innerHTML=`<div class="card"><div class="qhead"><span class="qnum">${idx+1}/${qs.length}</span><span class="subject">${S[q.s-1]} · ${q.e||''}</span></div><div class="progress"><div style="width:${(idx+1)/qs.length*100}%"></div></div><div class="prompt">${esc(q.p||'문제 텍스트를 불러오지 못했습니다.')}</div><div class="choices">${q.c.map((c,i)=>`<button class="choice ${a===i+1?'sel':''}" onclick="pick(${i+1})">${C[i]} ${esc(c||'')}</button>`).join('')}</div><div class="nav"><button class="btn" onclick="go(-1)" ${idx===0?'disabled':''}>이전</button><button class="btn" onclick="go(1)">${idx===qs.length-1?'채점하기':'다음'}</button></div><div class="muted" style="margin-top:10px">답한 문제 ${ans.filter(Boolean).length}/${qs.length}</div></div>`}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function pick(n){ans[idx]=n;renderQ()}function go(d){if(d===1&&idx===qs.length-1)return grade();idx=Math.max(0,Math.min(qs.length-1,idx+d));renderQ()}
function grade(){let rows=qs.map((q,i)=>({q,a:ans[i],ok:ans[i]===q.a}));let sub=[0,0,0],tot=[0,0,0];rows.forEach(r=>{tot[r.q.s-1]++;if(r.ok)sub[r.q.s-1]++});let pct=sub.map((x,i)=>Math.round(x/(tot[i]||1)*100));let avg=Math.round(pct.reduce((a,b)=>a+b,0)/3);let pass=pct.every(x=>x>=40)&&avg>=60;let correct=rows.filter(r=>r.ok).length;let h=history();h.push({date:new Date().toISOString(),title:exam.t,score:avg,pct,correct,total:qs.length,pass});localStorage.setItem('com1-history',JSON.stringify(h.slice(-50)));let w=wrongs();rows.filter(r=>!r.ok).forEach(r=>{let key=r.q.id+'-'+r.q.n;w=w.filter(x=>x.key!==key);w.push({key,q:r.q,my:r.a})});saveWrong(w.slice(-500));graded=true;app.innerHTML=`<section class="card"><div class="muted">${exam.t}</div><div class="${pass?'pass':'fail'}" style="font-size:22px;font-weight:900;margin-top:4px">${pass?'합격':'불합격'}</div><div class="score">${avg}점</div><div class="muted">${correct}/${qs.length} 정답</div><div class="scores">${S.map((s,i)=>`<div class="scorecard"><span class="muted">${s}</span><b>${pct[i]}점</b><small>${pct[i]>=40?'과락 통과':'과락'}</small></div>`).join('')}</div></section><section class="card"><b>과목별 점수</b><div class="chart">${pct.map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v}%"></div><div class="barlabel">${i+1}과목<br>${v}</div></div>`).join('')}</div></section><section class="card"><button class="btn blue" onclick="reviewWrongNow()">오답 해설 보기</button> <button class="btn" onclick="stats()">성적 통계</button></section>`}
function reviewWrongNow(){let list=qs.map((q,i)=>({q,my:ans[i]})).filter(x=>x.my!==x.q.a);showReview(list,0)}function showReview(list,k){if(!list.length){app.innerHTML='<div class="card">오답이 없습니다 🎉</div>';return}let x=list[k],q=x.q;app.innerHTML=`<section class="card"><div class="qhead"><b>오답 ${k+1}/${list.length}</b><span class="subject">${q.e} · ${q.n}번</span></div><div class="prompt">${esc(q.p)}</div><div class="wrongbox"><div><b>내 답:</b> ${x.my?C[x.my-1]:'미선택'}</div><div><b>정답:</b> ${C[q.a-1]}</div><div class="explain"><b>정답 핵심</b><br>${C[q.a-1]} ${esc(q.c[q.a-1]||'')}<div style="margin-top:8px">문제에서 요구한 조건에 가장 정확히 맞는 선택지입니다.</div>${q.c.map((c,i)=>`<div class="optline"><b>${C[i]} ${i+1===q.a?'정답':'오답'}</b> — ${esc(c||'')} ${i+1===q.a?'':'(문제의 조건과 일치하지 않는 선택지)'}</div>`).join('')}</div></div><div class="nav"><button class="btn" onclick="showReview(window._rv,${Math.max(0,k-1)})">이전</button><button class="btn" onclick="showReview(window._rv,${Math.min(list.length-1,k+1)})">다음</button></div></section>`;window._rv=list}
function wrongNote(){let w=wrongs();homeBtn.classList.remove('hidden');if(!w.length){app.innerHTML='<div class="card">아직 저장된 오답이 없어.</div>';return}let list=w.map(x=>({q:x.q,my:x.my}));showReview(list,0)}
function stats(){homeBtn.classList.remove('hidden');let h=history();if(!h.length){app.innerHTML='<div class="card">아직 시험 기록이 없어. 한 회차 풀면 그래프가 생겨.</div>';return}let avg=Math.round(h.reduce((s,x)=>s+x.score,0)/h.length),best=Math.max(...h.map(x=>x.score)),pass=h.filter(x=>x.pass).length;let sa=[0,1,2].map(i=>Math.round(h.reduce((s,x)=>s+(x.pct?.[i]||0),0)/h.length));app.innerHTML=`<section class="statgrid"><div class="stat"><span class="muted">응시</span><b>${h.length}회</b></div><div class="stat"><span class="muted">평균</span><b>${avg}점</b></div><div class="stat"><span class="muted">최고</span><b>${best}점</b></div><div class="stat"><span class="muted">합격</span><b>${pass}회</b></div></section><section class="card" style="margin-top:12px"><b>최근 점수 추이</b><div class="chart">${h.slice(-12).map((x,i)=>`<div class="barwrap"><div class="bar" style="height:${x.score}%"></div><div class="barlabel">${i+1}<br>${x.score}</div></div>`).join('')}</div></section><section class="card"><b>과목별 평균</b><div class="scores">${S.map((s,i)=>`<div class="scorecard"><span class="muted">${s}</span><b>${sa[i]}점</b></div>`).join('')}</div></section>`}
home();</script><script src="cbt-extra.js"></script><script src="cbt-2020.js"></script></body></html>
