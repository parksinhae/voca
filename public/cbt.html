,{"n":57,"s":3,"a":3,"p":"다음 중 매크로 함수에 대한 설명으로 옳지 않은 것은 57. ? 조건에 맞는 첫 번째 레코드를 검색한다 FindRecord : .","c":["매크로를 실행한다 RunMacro : .","매개 변수 쿼리를 실행한다 Messagebox : .","쿼리를 실행한다 OpenQuery : .",""]},{"n":58,"s":3,"a":3,"p":"다음 중 아래와 같은 결과를 표시하는 문은 58. SQL ? 저자 출간연도 SELECT * FROM book ORDER BY [ ], [ ];","c":["출간연도 출 SELECT * FROM book ORDER BY [ ] DESC, [","판사] DESC; 출간연도 저자 SELECT * FROM book ORDER BY [ ] ASC, [ ]","ASC; 저자 출간연 SELECT * FROM book ORDER BY [ ] DESC, [","도] ASC;"]},{"n":59,"s":3,"a":2,"p":"- 테이블 디자인의 조회 표시에서 콤보 상자나 목록 상자를 선택하면 59. 여러 가지 속성이 표시된다속성에 대한 설명 중 옳지 않은 것은 . ? 행 원본 목록으로 제공할 데이터를 지정한다 : .","c":["바운드 열 표시되는 열의 개수를 지정한다 : .","컨트롤 표시 콤보 상자나 목록 상자를 선택한다 : .","목록 값만 허용 예로 설정하면 목록에 제공된 데이터 이외 : ‘ ’","의 값을 추가할 수 없다."]},{"n":60,"s":3,"a":2,"p":"- 다음은 폼 디자인 보기에서의 작업에 대한 설명이다각 번호에 60. ‘ ’ . 대한 마우스 작업 설명 중 옳지 않은 것은? 을 오른쪽 버튼으로 클릭하여 레이아웃 보기로 보기 형식 ‘ ’","c":["❶ 을 변경할 수 있다. 를 더블클릭하면 탭 순서대화상자가 표시된다 ‘ ’ .","❷ 을 클릭하면 본문의 모든 컨트롤이 선택된다.","❸ 를 더블클릭하면 폼 속성 시트창이 표시된다 ‘ ’ .","❹"]}]},{"id":"2025-상시-02","t":"2025 상시 02","q":[{"n":1,"s":1,"a":1,"p":"1. 다음 중 컴퓨터에서 사용하는 압축 프로그램에 관한 설명으로 옳지 않은 것은? 압축한 파일을 모아 재압축을 반복하면 파일 크기를 계속 줄일","c":["수 있다. 여러 개의 파일을 압축하면 하나의 파일로 생성되어 파일 관리","를 용이하게 할 수 있다. 대부분의 압축 프로그램에는 분할 압축이나 암호 설정 기능이","있다. 파일의 전송시간과 비용을 절약하고디스크 공간을 효율적으 ,","로 사용할 수 있다."]},{"n":2,"s":1,"a":3,"p":"2. 다음 중 사운드 카드 관련 용어에 대한 설명으로 옳지 않은 것은? 샘플링 은 아날로그 신호를 디지털 신호로 변환하 (Sampling)","c":["는 과정 중 한 단계이다. 샘플링률 이 높으면 높을수록 원음에 보다 가 (Sampling Rate)","깝다. 샘","플링 주파수 는 낮으면 낮을 수록 좋다 (Sampling Frequency) . 샘플링 비트 수는 음질에 영향을 미친다 (Sampling Bit) .",""]},{"n":3,"s":1,"a":1,"p":"3. 다음 중 컴퓨터 메인보드의 버스 에 관한 설명으로 옳지 않은 (Bus) 것은? 내부 버스는 와 주변장치 간의 데이터 전송에 사용되는 CPU","c":["통로이다. 컴퓨터에서 데이터를 주고받는 통로로 사용 용도에 따라 내부","버스외부 버스확장 버스로 구분된다 , , . 외부 버스는 전달하는 신호의 형태에 따라 데이터 버스주소 ,","버스제어 버스로 구분된다 , . 확장 버스는 메인보드에서 지원하는 기능 외에 다른 기능을","지원하는 장치를 연결하는 부분으로 끼울 수 있는 형태이기에 확장 슬롯이라고도 한다."]},{"n":4,"s":1,"a":1,"p":"- 4. 다음 중 아날로그 컴퓨터와 비교하여 디지털 컴퓨터의 특징으로 옳지 않은 것은? 온도전압진동 등과 같이 연속적으로 변하는 데이터를 효율 , ,","c":["적으로 처리할 수 있다. 산술 및 논리 연산을 처리하는 회로에 기반을 둔 범용 컴퓨터","로 사용된다. 데이터의 각 자리마다 혹은 의 비트로 표현한 이산적인 0 1","데이터를 처리한다. 데이터 처리를 위한 명령어들로 구성된 프로그램에 의해 동작",""]},{"n":5,"s":1,"a":2,"p":"5. 다음 중 휴대폰을 모뎀처럼 활용하는 방법으로컴퓨터나 노트북 , 등의 기기를 휴대폰에 연결하여 무선 인터넷을 사용할 수 있게 IT 하는 기능은? 와이파이","c":["테더링","블루투스","와이브로",""]},{"n":6,"s":1,"a":1,"p":"6. 다음 중 자료 구성 단위에 대한 설명으로 옳지 않은 것은? 워드 는 문자를 표현하는 최소 단위이다 (Word) .","c":["니","블 은 개의 비트 가 모여 개의 니블을 구성한다 (Nibble) 4 (Bit) 1 . 레코드 는 하나 이상의 관련된 필드가 모여서 구성되 (Record)","는 자료 처리 단위이다. 필드 는 파일 구성의 최소 단위이며여러 개의 필드가 (Field) ,","모여 레코드 가 된다 (Record) ."]},{"n":7,"s":1,"a":2,"p":"7. 다음 중 인터넷 통신 장비인 라우터 에 대한 설명으로 (Router) 옳은 것은? 두 개의 근거리 통신망을 상호 접속할 수 있도록 하는 통신망","c":["연결 장치이다. 서로 다른 네트워크 간에 자료가 전송될 최적의 경로를 찾아","준다. 장거리 전송을 위하여 전송 신호를 재생시키거나 출력 전압을","높여 준다. 주로 에서 다른 네트워크에 데이터를 보내거나 다른 네트 LAN","워크로부터 데이터를 받아들이는데 사용된다."]},{"n":8,"s":1,"a":4,"p":"8. 다음 중 한글 에서 빠른 지원에 관한 설명으로 옳지 Windows 10 [ ] 않은 것은? 다른 위치에 있는 상대방이 와 같이 호환되는 운영체 Windows","c":["제가 실행되는 컴퓨터에서 사용자 컴퓨터를 편리하게 연결하 여 문제를 해결할 수 있다. 원격 접속을 지원할 사용자가 빠른 지원대화상자에서 다른 ‘ ’ <","사람 지원을 클릭하면 보안 코드 숫자 자리가 화면에 표시 > 6 된다. 공유 옵션에는 모든 권한 가지기와 화면 보기가 있다 ‘ ’ ‘ ’ ‘ ’ .","원격 접속을 지원할 사용자는 마이크로소프트 계정으로 로그","인 하지 않아도 되지만 지원 받는 사용자는 마이크로소프트 계정으로 로그인해야 한다."]},{"n":9,"s":1,"a":3,"p":"- 9. 다음 중 외부로부터의 데이터 침입행위에 관한 유형의 위조 에 대한 설명으로 옳은 것은 (Fabrication) ? 자료가 수신측으로 전달되는 것을 방해하는 행위","c":["전송한 자료가 수신지로 가는 도중에 몰래 보거나 도청하는","행위 자료가 다른 송신자로부터 전송된 것처럼 꾸미는 행위","원래의 자료를 다른 내용으로 바꾸는 행위",""]},{"n":10,"s":1,"a":3,"p":"10. 다음 중 한글 의 파일 탐색기에서 검색 상자를 사용하여 Windows 10 파일이나 폴더를 찾는 방법으로 옳지 않은 것은? 파일 종류를 기준으로 검색할 수 있다.","c":["검색 상자에서 찾으려는 파일이나 폴더명을 입력하면 자동으","로 필터링되어 결과가 표시된다. 검색 내용에 를 붙이면 해당 내용이 포함되지 않은 파일이 ‘$’","나 폴더를 검색한다. 특정 파일 그룹을 정기적으로 검색하는 경우 검색 저장 기능을","이용하면 다음에 사용할 때 원래 검색과 일치하는 최신 파일을 표시해 준다."]},{"n":11,"s":1,"a":3,"p":"11. 다음 중 한글 의 폴더 옵션창에서 설정할 수 있는 Windows 10 [ ] 작업으로 옳지 않은 것은? 숨김 파일이나 폴더의 표시 여부를 지정할 수 있다.","c":["알려진 파일 형식의 파일 확장명을 숨기도록 설정할 수 있다.","탐색 창미리 보기 창세부 정보 창의 표시 여부를 선택할 , ,","수 있다. 폴더에서 시스템 파일을 검색할 때 색인의 사용 여부를 선택할","수 있다."]},{"n":12,"s":1,"a":4,"p":"12. 다음 중 컴퓨터의 소프트웨어 관련 용어에 대한 설명으로 옳지 않은 것은? 베타버전 은 정식 프로그램을 발표하기 전에 (Beta Version)","c":["프로그램의 문제 발견이나 기능 향상을 위해 무료로 배포하는 프로그램이다. 셰어웨어 는 일정기간 무료 사용 후 원하면 정식 (Shareware)","프로그램을 구입할 수 있는 형태의 프로그램이다. 프리웨어 는 누구나 자유롭게 사용할 수 있는 프로 (Freeware)","그램으로 기간 및 기능에 제한이 없다. 패치 프로그램 은 기능을 알리기 위해 기간이 (Patch Program)","나 기능에 제한을 두어 무료 배포하는 프로그램이다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 레지스터에 대한 설명으로 옳지 않은 것은? 명령 레지스터는 현재 실행중인 명령의 내용을 기억하는 레지","c":["스터이다. 프로그램 계수기는 다음 순서에 실행할 명령의 내용을 기억하","는 레지스터이다. 데이터 레지스터는 연산에 사용될 데이터를 기억하는 레지스","터이다. 누산기는 연산된 결과를 일시적으로 저장하는 레지스터이다.",""]},{"n":14,"s":1,"a":4,"p":"14. 다음 중 전자우편 에 대한 설명으로 옳지 않은 것은 (E-mail) ? 한 사람이 동시에 여러 사람에게 전자우편을 보낼 수 있다.","c":["전체 회신은 받은 메일에 대한 답장을 발송자는 물론 참조인들","에게도 전송하는 기능이다. 는 로컬 서버에서 프로그램을 이용하여 전자우편을 액 IMAP","세스하기 위한 표준 프로토콜이다. 는 메일 서버에 도착한 이메일을 사용자 컴퓨터로 가져 SMTP","올 수 있도록 메일 서버에서 제공하는 프로토콜이다."]},{"n":15,"s":1,"a":1,"p":"- 15. 다음 중 멀티미디어의 특징에 관한 설명으로 옳지 않은 것은? 용이성 각각의 분리된 매체오디오 등보다 콘텐 (Easiness) : ( )","c":["츠 제작이 용이하다. 비선형성 데이터가 일정한 방향으로 순차적으 (Non-Linear) :","로 처리되는 것이 아니라 사용자의 선택에 따라 다양한 방향 으로 처리된다. 디지털화 여러 종류의 정보를 컴퓨터로 처리하 (Digitization) :","기 위해서 디지털 방식으로 변환하여 처리한다. 상호 작용성 정보 제공자의 선택에 의해 일방적 (Interaction) :","으로 데이터가 전달되는 것이 아니라 정보 제공자와 사용자"]},{"n":16,"s":1,"a":2,"p":"16. 다음 중 이미지 데이터의 표현 방식에서 벡터 방식에 관한 (Vector) 설명으로 옳은 것은? 픽","c":["셀로 이미지를 표현하며래스터 이미지라고도 한다 , (Raster) . 이미지를 확대해도 테두리가 거칠어지지 않고 매끄럽게 표현","된다. 다양한 색상을 이용하기 때문에 사실적 표현이 용이하다.","저장 시 많은 용량을 차지한다.",""]},{"n":17,"s":1,"a":4,"p":"17. 다음 중 한글 에서 주기억장치의 메모리 용량 부족에 Windows 10 관한 문제 해결 방법으로 옳지 않은 것은? 불필요한 프로그램을 종료한다.","c":["작업량에 비해 메모리가 적을 경우 을 추가한다 DRAM .","시스템 속성대화상자에 있는 고급탭에서 가상 메모리 [ ] [ ]","크기를 조절한다. 휴지통이나 하드디스크의 임시 기억 장소에 저장된 불필요 [ ]","한 파일을 삭제한다."]},{"n":18,"s":1,"a":1,"p":"18. 다음 중 마이크로프로세서 에 관한 설명으로 옳지 (Microprocessor) 않은 것은? 제어장치연산장치주기억장치가 하나의 반도체 칩에 내장된 , ,","c":["장치이다. 클럭 주파수와 내부 버스의 폭 으로 성능을 평가 (Bandwidth)","한다. 개인용 컴퓨터의 중앙처리장치로 사용된다.","작은 규모의 임베디드 시스템이나 휴대용 기기에도 사용된다.",""]},{"n":19,"s":1,"a":1,"p":"19. 웹 기반 애플리케이션을 활용하여 인터넷 개인 서버에서 대용량 데이터베이스를 연산처리하고 저장한 데이터를 나 스마트폰 ( ) PC , 등 다양한 단말기에서 불러오거나 가공할 수 있도록 하는 Pad 환경을 의미하는 것은? 클라우드 컴퓨팅(Cloud Computing)","c":["그리드 컴퓨팅(Grid Computing)","사물 인터넷(Internet of Things)","빅 데이터(Big Data)",""]},{"n":20,"s":1,"a":2,"p":"20. 다음 중 인터넷 서비스와 관련하여 서비스에 관한 설명으로 FTP 옳지 않은 것은? 서버에 파일을 전송 또는 수신삭제이름 바꾸기 등의 FTP , ,","c":["작업을 할 수 있다. 서버에 있는 프로그램은 접속 후에 서버에서 바로 실행시 FTP","킬 수 있다. 익명 사용자는 계정이 없는 사용자로 서비 (Anonymous) FTP","스를 이용할 수 있다. 기본적으로 그림 파일은 모드로 텍스트 파일은 Binary ASCII","모드로 전송한다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"- 21. 다음 중 셀에 입력된 데이터에 사용자 지정 표시 형식을 설정한 후의 표시 결과로 옳은 것은? 0.25 0#.#% 0.25%","c":["→ → 0.57 #.# 0.6","→ → 90.86 #,##0.0 90.9","→ → 점 점 100 #,###;@“ ” 100","→ →"]},{"n":22,"s":2,"a":3,"p":"22. 다음 중 아래 시나리오 관리자대화상자의 각 버튼에 대한 설명으 [ ] 로 옳지 않은 것은? 표시 선택한 시나리오에 대해 결과를 표시한다 : .","c":["편집 선택한 시나리오를 변경한다 : .","병합 시나리오 관리자에 표시된 시나리오를 병합한다 : ‘ ’ .","요약 시나리오에 대한 요약 보고서나 피벗 테이블을 작성한 :","다."]},{"n":23,"s":2,"a":2,"p":"23. 다음 중 시트 보호 시 이 워크시트의 모든 사용자에게 다음 사항을 ‘ 허용으로 저정할 수 있는 내용이 아닌 것은 ’ ? 개체 편집","c":["시트 이름 바꾸기","자동 필터 사용","시나리오 편집",""]},{"n":24,"s":2,"a":3,"p":"- 아래는 워크시트 셀에서 매크로 기록을 클릭하고 작업을 24. [A1] [ ] 수행한 과정을 의 코드 창에서 확인한 결과이다 Visual Basic Editor . 다음 중 이에 대한 설명으로 옳지 않은 것은? 매크로 Sub 2( ) 매크로 매크로 ' 2 ' ActiveCell.Offset(0, 1).Range(“A1”).Select 성적현황 ActiveCell.FormulaR1C1 = “ ” ActiveCell.Offset(1, -1).Range(“A1”).Select 학번 ActiveCell.FormulaR1C1 = “ ” ActiveCell.Offset(0, 1).Range(“A1”).Select 학과 ActiveCell.FormulaR1C1 = “ ” Range(\"C2\").Select 이름 ActiveCell.FormulaR1C1 = “ ” Range(“A3”).Select End Sub 매크로의 이름은 매크로이다 ‘ 2’ .","c":["성적현황 학번 학과는 상대 참조로 기록되었다 ‘ ’, ‘ ’, ‘ ’ .","셀을 클릭하고 매크로를 실행한 후의 셀 포인터 위치는 [A3]","셀이다 [A5] . 셀을 클릭하고 매크로를 실행한 후의 셀의 값은 [B3] [C3]","성적현황이다 ‘ ’ ."]},{"n":25,"s":2,"a":2,"p":"25. 다음 중 고급 필터의 조건 범위를 영역으로 지정한 후 [E1:F3] 고급 필터를 실행했을 때 결과로 옳은 것은? 코너가 잡화이거나코너가 식료품이거나 판매금액이 판 “ ” , “ ”","c":["매금액의 평균 이상인 데이터 코너가 잡화이거나코너가 식료품이고 판매금액이 판매 “ ” , “ ”","금액의 평균 이상인 데이터 코너가 잡화이고코너가 식료품이거나 판매금액이 판매 “ ” , “ ”","금액의 평균 이상인 데이터 코너가 잡화이고코너가 식료품이고 판매금액이 판매금 “ ” , “ ”","액의 평균 이상인 데이터"]},{"n":26,"s":2,"a":2,"p":"다음과 같은 시트에서 셀에 아래의 수식을 입력했을 때 26. [A8] 계산 결과로 올바른 것은? =COUNT(OFFSET(D6, -5, -3, 2, 2)) 4","c":["1","120","74",""]},{"n":27,"s":2,"a":1,"p":"27. 다음 중에서 주식형 차트에 대한 설명으로 옳지 않은 것은 [ ] ? 주식 분석을 위해 피벗 차트 보고서에서 주로 사용한다.","c":["주","식의 거래량과 같은 주가의 흐름을 파악하고자 할 때 사용한다. 주식형 차트에 추세선을 표시할 수 있다.","고가저가종가 등의 주식 거래 가격을 바탕으로 차트를 작성 , ,","한다."]},{"n":28,"s":2,"a":3,"p":"- 28. 다음 중 찾기 및 바꾸기대화상자에 대한 설명으로 옳지 않은 [ ] 것은? 문서에서 찾을 내용에 입력한 내용과 일치하는 이전 항목을 ‘ ’","c":["찾으려면 를 누른 상태에서 다음 찾기단추를 클릭한다 [Shift] [ ] . 찾을 내용에 입력한 문자만 있는 셀을 검색하려면 전체 셀 ‘ ’ ‘","내용 일치를 선택한다 ’ . 별표 물음표 및 물결표 등의 문자가 포함된 내용을 (*), (?) (~)","찾으려면 찾을 내용에 작은따옴표 뒤에 해당 문자를 붙여 ‘ ’ (’)",""]},{"n":29,"s":2,"a":2,"p":"다음 중 괄호 안에 해당하는 바로 가기 키로 옳은 것은 29. ( ) ? 통합 문서 내에서 키는 다음 워크시트로 이동 ( ) , ㉠ 키는 이전 워크시트로 이동할 때 사용한다 ( ) . ㉡ [Shift]+[PgDn], [Shift]+[PgUp]","c":["㉠ ㉡ [Ctrl]+[PgDn], [Ctrl]+[PgUp]","㉠ ㉡ [Ctrl]+[ ], [Ctrl]+[ ]","㉠ ← ㉡ → [Shift]+[ ], [Shift]+[ ]","㉠ ↑ ㉡ ↓"]},{"n":30,"s":2,"a":1,"p":"30. 다음 중 엑셀의 오차 막대에 대한 설명으로 옳지 않은 것은? 세로 막대형 차트꺾은선형 차트분산형 차트거품형 차트 , , , ,","c":["차원 세로 막대형 차트 차원 꺾은선형 차트에 오차 막대를 3 , 3 표시할 수 있다. 차트에 고정값백분율표준 편차표준 오차사용자 지정 , , , ,","중 하나를 선택하여 오차량을 표시할 수 있다. 데이터 계열의 각 데이터 표식에 대한 오류 가능성이나 불확실","성의 정도를 표시한다. 분산형과 거품형 차트에는 세로 오차 막대가로 오차 막대를 ,","적용할 수 있다."]},{"n":31,"s":2,"a":3,"p":"31. 다음 중 통합 문서에 대한 설명으로 옳지 않은 것은? 시트 보호는 통합 문서 전체가 아닌 특정 시트만을 보호한다.","c":["공유된 통합 문서는 여러 사용자가 동시에 변경 및 병합할","수 있다. 통합 문서 보호 설정 시 암호를 지정하면 워크시트에 입력된","내용을 수정할 수 없다. 사용자가 워크시트를 추가삭제하거나 숨겨진 워크시트를 표 ,","시하지 못하도록 통합 문서의 구조를 잠글 수 있다."]},{"n":32,"s":2,"a":4,"p":"32. 다음 중 화면 제어에 관한 설명으로 옳은 것은? 창 나누기는 실행 취소명령으로 나누기를 해제할 수 있다 [ ] .","c":["창 나누기는 항상 개로 분할되며 분할된 창의 크기는 마우스 4","를 드래그하여 변경 가능하다. 틀 고정 기준은 마우스로 위치를 조정할 수 있다.","틀 고정은 행 또는 열열과 행으로 모두 고정이 가능하다 , .",""]},{"n":33,"s":2,"a":1,"p":"33. 다음 중 인쇄 미리 보기 및 인쇄화면에서 페이지 설정을 클릭하여 ‘ ’ ‘ ’ 설정할 수 있는 내용으로 틀린 것은? 인쇄 영역을 설정하여 인쇄할 수 있다.","c":["워","크시트의 행 머리글과 열 머리글을 포함하여 인쇄할 수 있다. 워크시트에 삽입되어 있는 차트도형그림 등의 모든 그래픽 , ,","요소를 제외하고 텍스트만 빠르게 인쇄할 수 있다. 셀에 표시된 오류가 인쇄되지 않도록 설정할 수 있다.",""]},{"n":34,"s":2,"a":3,"p":"- 34. 다음 중 피벗 테이블 보고서와 피벗 차트 보고서에 대한 설명으로 옳지 않은 것은? 피벗 테이블 보고서에서는 값 영역에 표시된 데이터 일부를","c":["삭제하거나 추가할 수 없다. 피벗 차트 보고서를 만들 때마다 동일한 데이터로 관련된 피벗","테이블 보고서가 자동으로 생성된다. 피벗 차트 보고서는 분산형주식형거품형 등 다양한 차트 , ,","종류로 변경할 수 있다. 행 또는 열 레이블에서의 데이터 정렬은 수동항목을 끌어 (","다시 정렬 오름차순내림차순 중 선택할 수 있다 ), , ."]},{"n":35,"s":2,"a":2,"p":"35. 다음 중 정렬에 대한 설명으로 옳지 않은 것은? 표 스타일이 적용된 데이터 영역을 왼쪽에서 오른쪽 방향으로","c":["정렬하려면 정렬하기 전에 범위로 변환을 실행해야 한다 ‘ ’ . 숨겨진 행이나 열도 정렬에 포함되어 정렬된다.","숫자날짜 등과 같이 셀에 입력된 값으로 정렬할 때는 정렬 ,","기준을 셀 값으로 지정하고셀에 지정된 서식으로 정렬하려 ‘ ’ , 면 정렬 기준을 셀 색이나 글꼴 색으로 지정해야 한다 ‘ ’ ‘ ’ . 사용자 지정 목록을 사용하여 사용자가 정의한 순서대로 정렬","할 수 있다."]},{"n":36,"s":2,"a":2,"p":"36. 다음 중 부분합에 대한 설명으로 옳지 않은 것은? 부분합을 작성하려면 첫 행에는 열 이름표가 있어야 하며그 ,","c":["룹화할 항목을 기준으로 반드시 정렬해야 제대로 된 결과를 얻을 수 있다. 그룹화를 위한 데이터의 정렬을 오름차순으로 할 때와 내림차","순으로 할 때의 그룹별 부분합의 결과는 서로 다르다. 부분합을 제거하면 부분합과 함께 표에 삽입된 개요 및 페이지","나누기도 모두 제거된다. 부분합 대화상자에서 새로운 값으로 대치를 해제하지 않고 ‘ ’","부분합을 실행하면 이전에 작성한 부분합은 삭제되고 새롭게 작성한 부분합만 표시된다."]},{"n":37,"s":2,"a":3,"p":"37. 아래의 워크시트에서 영역이 블록으로 지정된 상태에서 [A1:C1] 채우기 핸들을 끌었을 때 셀에 입력되는 값으로 올바른 것은 [F1] ? 1","c":["-3","-7","0",""]},{"n":38,"s":2,"a":3,"p":"다음 중 아래 시트에서 각 수식을 실행했을 때의 결과 값으로 38. 옳은 것은? =SUM(COUNTA(B2:D4), MAXA(B2:D4)) 102","c":["→ =AVERAGE(SMALL(C2:C4, 2), LARGE(C2:C4, 2)) 75","→ =SUM(LARGE(B3:D3, 2), SMALL(B3:D3, 2)) 174","→ =SUM(COUNTA(B2, D4), MINA(B2, D4)) 109","→"]},{"n":39,"s":2,"a":3,"p":"- 39. 다음 중 페이지 나누기 미리 보기에 대한 설명으로 옳지 않은 [ ] 것은? 페이지 나누기는 구분선을 이용하여 인쇄를 위한 페이지 나누","c":["기를 빠르게 조정하는 기능이다. 행 높이와 열 너비를 변경하면 자동 페이지 나누기의 위치도","변경된다. 페이지 나누기 미리 보기에서 수동으로 삽입된 페이지 나누 [ ]","기는 파선으로 표시되고 자동으로 추가된 페이지 나누기는 실선으로 표시된다. 용지 크기여백 설정배율 옵션 등에 따라 자동 페이지 나누기 , ,","가 삽입된다."]},{"n":40,"s":2,"a":3,"p":"다음 중 부터 까지의 합을 구하는 모듈로 옳지 않은 것은 40. 1 10 VBA ?","c":["no = 0 sum = 0 Do While no <= 10 sum = sum + no no = no + 1 Loop MsgBox sum","no = 0 sum = 0 Do sum = sum + no no = no + 1 Loop While no<= 10 MsgBox sum","no = 0 sum = 0 Do While no < 10 sum = sum + no no = no + 1 Loop MsgBox sum","sum = 0 For no = 1 To 10 sum = sum 것은 SQL ? 문 SELECT","c":["절 GROUP BY","절 HAVING","절 ORDER BY",""]},{"n":50,"s":3,"a":4,"p":"- 다음 중 직원사원번호부서명이름나이근무년수급여테이블 50. ( , , , , , ) 에서 근무년수가 이상인 직원들을 나이가 많은 순서대로 조회하 ‘ ’ 3 되같은 나이일 경우 급여의 오름차순으로 모든 필드를 표시하는 , 문은 SQL ? 직원 근무년수 나이 select * from where >= 3 order by ,","c":["급여; 직원 나이급여 근무년수 select * from order by , where",">= 3; 직원 나이 급여 select * from order by desc, asc where","근무년수 >= 3; 직원 근무년수 나이 select * from where >= 3 order by","급여 desc, asc;"]},{"n":51,"s":3,"a":3,"p":"다음 중 아래 문에 대한 설명으로 옳은 것은 51. SQL ? 학생 주소서울 UPDATE SET =‘ ’ 학번 WHERE =100; 학생 테이블에 주소가 서울이고 학번이 인 레코드를 < > ‘ ’ 100","c":["추가한다. 학생 테이블에서 주소가 서울이고 학번이 인 레코드 < > ‘ ’ 100","를 검색한다. 학생 테이블에서 학번이 인 레코드의 주소를 서울로 < > 100 ‘ ’","갱신한다. 학생 테이블에서 주소가 서울인 레코드의 학번을 으 < > ‘ ’ 100","로 갱신한다."]},{"n":52,"s":3,"a":1,"p":"상품 폼에 있는 재고필드를 참조하고자 한다참조 형식이 52. < > ‘ ’ . 바르게 설정된 것은? 상품 재고 [Forms]![ ]![ ]","c":["상품 재고 [Forms]@[ ]@[ ]","상품 재고 [Forms]![ ]@[ ]","상품 재고 [Forms]@[ ]![ ]",""]},{"n":53,"s":3,"a":2,"p":"다음 중 아래의 설명에 해당하는 컨트롤로 옳은 것은 53. ? ㆍ폼이나 보고서의 원본으로 사용되는 데이터를 표시한 다. ㆍ계산 결과를 표시한다. 레이블","c":["텍스트 상자","콤보 상자","목록 상자",""]},{"n":54,"s":3,"a":3,"p":"다음 중 기본 보기 속성을 통해 설정하는 폼의 종류에 대한 설명으로 54. 가장 옳지 않은 것은? 단일 폼은 한번에 한 개의 레코드만을 표시한다.","c":["연속 폼은 현재 창을 채울 만큼 여러 개의 레코드를 표시한다.","연속 폼은 매 레코드마다 폼 머리글과 폼 바닥글이 표시된다.","데이터시트 형식은 스프레드시트처럼 행과 열로 정렬된 폼","필드를 표시한다."]},{"n":55,"s":3,"a":1,"p":"다음 중 보고서 그룹화에 대한 설명으로 옳지 않은 것은 55. ? 그룹으로 지정된 필드의 정렬 기준은 변경할 수 없으며기본 ,","c":["적으로 오름차순으로 정렬된다. 텍스트 형식은 전체값첫 문자처음 두 문자사용자 지정 , , ,","문자를 기준으로 그룹화할 수 있다. 그룹화 할 필드가 날짜 데이터이면 실제 값기본일주월분 ( )· · · ·","기연도를 기준으로 그룹화할 수 있다 · . 그룹을 만들려면 머리글 구역 표시나 바닥글 구역 표시 중","하나 이상을 설정해야 한다."]},{"n":56,"s":3,"a":1,"p":"- 다음 중 의 개체에 대한 설명으로 옳지 않은 것은 56. Access ? 매크로는 모듈에 비해 복잡한 작업을 처리하기 위해 프로그램","c":["을 직접 작성하는 것이다. 쿼리는 폼이나 보고서의 원본 데이터로 사용할 수 있다.","폼은 테이블이나 쿼리 데이터의 입출력 화면을 작성한다.","테이블은 데이터를 저장하는 데 사용하는 데이터베이스 개체","로레코드 및 필드로 구성된다 , ."]},{"n":57,"s":3,"a":4,"p":"다음 보고서에 대한 설명으로 옳지 않은 것은 57. ? 음영으로 표시된 거래처별보고서는 페이지 머리글에 작성 “ ”","c":["되었다. 거래처별로 그룹이 설정되었고 날짜를 기준으로 내림차순 정","렬이 설정되었다. 순번은 컨트롤 원본에 이 입력되고 누적 합계속성이 ‘ ’ “=1” ‘ ’","그룹으로 설정되었다 “ ” . 보고서 바닥글에 표시된 페이지 번호는 전체 페이지 번호와","현재 페이지 번호가 레이블을 이용하여 작성되었다."]},{"n":58,"s":3,"a":3,"p":"다음 화면에서 설정되어 있는 폼의 속성 값으로 옳지 않은 것은 58. ? 캡션 주문현황 :","c":["탐색 단추 예 :","보기 형식 단일 폼 :","레코드 선택기 예 :",""]},{"n":59,"s":3,"a":4,"p":"다음 중 매크로에 대한 설명으로 옳지 않은 것은 59. ? 매크로를 한 단계씩 이동하면서 매크로의 흐름과 각 동작에","c":["대한 정보를 확인할 수 있다. 의 매크로는 작업을 자동화하고 양식보고서 및 컨트 Access ,","롤에 기능을 추가할 수 있게 해주는 도구이다. 이미 매크로에 추가한 작업을 반복해야 하는 경우 매크로 동작","을 복사하여 붙여넣으면 된다. 각 매크로는 하위 매크로를 포함할 수 없다.",""]},{"n":60,"s":3,"a":1,"p":"- 다음 중 보고서의 시작 부분에 한 번만 표시되며 일반적으로 회사의 60. 로고나 제목 등을 표시하는 구역은? 보고서 머리글","c":["페이지 머리글","그룹 머리글","그룹 바닥글",""]}]},{"id":"2025-상시-03","t":"2025 상시 03","q":[{"n":1,"s":1,"a":1,"p":"1. 다음 중 한글 에서 파일의 검색 기능을 향상시키기 Windows 10 위한 기능은? 색인","c":["압축","복원","백업",""]},{"n":2,"s":1,"a":3,"p":"2. 다음 중 컴퓨터의 에서 설정할 수 있는 항목으로 옳지 않은 CMOS 것은? 하드디스크의 타입","c":["하드디스크나 등의 부팅 순서 USB","멀티부팅 시 사용하려는 의 종류 BIOS","시스템 암호 설정",""]},{"n":3,"s":1,"a":3,"p":"3. 다음 중 한글 의 인쇄 작업에 대한 설명으로 옳지 Windows 10 않은 것은? 여러 개의 출력 파일들의 출력대기 상태를 확인할 수 있다.","c":["여러 개의 출력 파일들이 출력대기 할 때 출력 순서를 임의로","조정할 수 있다. 일단 프린터에서 인쇄 작업에 들어간 것은 프린터 전원을 끄기","전에는 강제로 종료시킬 수 없다. 인쇄 중인 문서나 오류가 발생한 문서는 다른 프린터로 전송할","수 없다."]},{"n":4,"s":1,"a":2,"p":"4. 다음 중 바이러스 감염 증상에 대한 설명으로 옳지 않은 것은? 시스템 파일이 손상되어 부팅 이 정상적으로 수행되 (Booting)","c":["지 않는다. 파일의 크기가 작아지고프로그램의 실행 속도가 빨라진다 , .","특정 날짜가 되면 화면에 이상한 메시지가 표시된다.","디스크를 인식하지 못하거나디스크 볼륨명이 변경될 수도 ,","있다."]},{"n":5,"s":1,"a":4,"p":"- 5. 다음 중 그래픽 데이터 형식에 관한 설명으로 옳지 않은 것은? 사진과 같은 선명한 정지 영상 압축 기술에 대한 국제 JPEG :","c":["표준으로 주로 인터넷에서 그림 전송에 사용된다. 인터넷 표준 그래픽 형식으로 비트 컬러를 사용하여 GIF : 8","최대 색상까지만 표현할 수 있으며애니메이션 표현이 256 , 가능하다. 트루 컬러의 지원과 투명색 지정이 가능하다 PNG : .","운영체제의 표준 비트맵 파일 형식으로 압축 BMP : Windows","하여 저장하므로 파일의 크기가 작은 편이다."]},{"n":6,"s":1,"a":2,"p":"6. 다음 중 소프트웨어의 사용권에 따른 분류에 대한 설명으로 옳지 않은 것은? 번들 특정한 하드웨어나 소프트웨어를 구매하였을 때 포함하 :","c":["여 주는 소프트웨어이다. 셰어웨어 정식 버전이 출시되기 전에 프로그램에 대한 일반 :","인의 평가를 받기 위해 제작된 소프트웨어이다. 애드웨어 배너 광고를 보는 대가로 무료로 사용하는 소프트 :","웨어이다. 프리웨어 돈을 내지 않고도 사용가능하고 다른 사람에게 :","전달해 줄 수 있는 소프트웨어이다."]},{"n":7,"s":1,"a":4,"p":"7. 다음 중 컴퓨터 통신에서 사용하는 프로토콜 기능에 관한 설명으로 옳지 않은 것은? 통신망에 전송되는 패킷의 흐름을 제어해서 시스템 전체의","c":["안전성을 유지한다. 정보를 전송하기 위해 송수신기 사이에 같은 상태를 유지하도 ·","록 동기화 기능을 수행한다. 데이터 전송 도중에 발생하는 오류를 검출한다.","네트워크에 접속된 다양한 단말장치를 자동으로 인식하여 호","환성을 제공한다."]},{"n":8,"s":1,"a":4,"p":"8. 다음 중 한글 의 설정 장치에 표시되지 않는 Windows 10 [ ] [ ] → 것은? 포트에 연결하는 장치 USB","c":["컴퓨터에 연결된 호환 네트워크 장치","네트워크에 연결된 컴퓨터","하드디스크 드라이브와 사운드 카드",""]},{"n":9,"s":1,"a":2,"p":"9. 다음 중 인터넷 주소 체계에서 에 관한 설명으로 옳지 않은 IPv6 것은? 비트의 주소를 사용하여 의 주소 부족 문제를 해결하 128 IPv4","c":["였다. 보다 주소의 길이가 길어 자료 전송 속도가 늦다 IPv4 .","인증성기밀성데이터 무결성의 지원으로 보안 기능을 포함 , ,","한다. 와 호환성이 있으며실시간 흐름 제어가 가능하다 IPv4 , .",""]},{"n":10,"s":1,"a":3,"p":"- 10. 다음 중 멀티미디어의 특징으로 옳지 않은 것은? 디지털 데이터로 변환하여 통합 처리한다.","c":["정보 제공자와 사용자 간의 상호 작용에 의해 데이터가 전달된","다. 데이터가 사용자 선택에 따라 순차적으로 처리되는 선형성의","특징을 가진다. 문자그림사운드 등의 여러 미디어를 통합하여 처리한다 , , .",""]},{"n":11,"s":1,"a":2,"p":"11. 다음 중 정보 통신망의 구성 형태를 설명한 내용으로 옳지 않은 것은? 망형 은 네트워크 상의 모든 노드들이 서로 (Mesh Topology)","c":["연결되는 방식으로 특정 노드에 이상이 생겨도 전송이 가능하 다. 링형 은 모든 노드들을 하나의 원형으로 연결 (Ring Topology)","하는 구조로 통신 제어가 간단하고 신뢰성이 높아 특정 노드 의 이상도 쉽게 해결할 수 있다. 트리형 은 하나의 컴퓨터에 네트워크를 연결 (Tree Topology)","하여 확장하는 형태로 확장이 많을 경우 트래픽이 과중될 수 있다. 버스형 은 모든 노드들이 하나의 케이블에 연 (Bus Topology)","결되어 있으며케이블 종단에는 종단 장치가 있어야 한다 , ."]},{"n":12,"s":1,"a":1,"p":"12. 다음 중 인터넷 상의 보안을 위협하는 행위에 대한 설명으로 옳지 않은 것은? 크래킹 은 인터넷을 통한 서비스를 정상적으로 사 (Cracking)","c":["용하지 못하도록 하는 것으로시스템을 파괴하지는 않지만 , 사용자에게 불편함을 준다. 해킹 은 사용 권한이 없는 사람이 시스템에 침입하 (Hacking)","여 정보를 수정하거나 빼내는 행위이다. 피싱 은 거짓 메일을 발송하여 특정 금융기관 등의 (Phishing)","가짜 웹 사이트로 유인한 후 관련 금융 기관의 정보 등을 빼내 는 기법이다. 혹스 는 실제로는 악성코드로 행동하지 않으면서 겉으 (Hoax)","로는 악성코드인 것처럼 가장하여 행동하는 소프트웨어이다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 이미지와 그래픽에서 사용되는 비트맵 방식의 파일 형식에 관한 설명으로 옳지 않은 것은? 래스터 방식이라고도 하며 다양한 색상을 사용하므로 사실","c":["같은 이미지를 표현할 수 있다. 베지어스플라인 등의 곡선을 이용하여 이미지를 표현하므로 ,","확대축소 시 화질의 손상이 거의 없다 / . 이미지를 확대하면 테두리가 거칠게 표현된다.","비트맵 파일 형식으로는 등이 있다 BMP, GIF, JPEG .",""]},{"n":14,"s":1,"a":2,"p":"14. 다음 중 유비쿼터스 센서 네트워크 의 활용 분야에 속하는 (USN) 것은? 테더링","c":["텔레매틱스","블루투스","고퍼",""]},{"n":15,"s":1,"a":3,"p":"15. 다음 중 한글 에서 하드디스크의 여유 공간이 부족할 Windows 10 경우의 해결 방법으로 옳지 않은 것은? 휴지통에 있는 파일을 삭제한다.","c":["디스크 정리를 수행하여 불필요한 파일들을 삭제한다 [ ] .","기능 켜기끄기의 모든 확인란을 선택한다 Windows / .","불필요한 파일을 백업한 후 삭제한다.",""]},{"n":16,"s":1,"a":4,"p":"- 16. 다음 중 운영체제의 구성인 제어 프로그램에 대한 설명으로 옳지 않은 것은? 자원의 할당 및 시스템 전체의 작동 상태를 감시한다.","c":["작업이 정상적으로 처리될 수 있도록 작업의 순서와 방법을","관리한다. 작업에 사용되는 데이터와 파일의 표준적인 처리 및 전송을","관리한다. 사용자가 고급언어로 작성한 원시 프로그램을 기계어 형태의","목적 프로그램으로 변환시킨다."]},{"n":17,"s":1,"a":4,"p":"17. 다음 중 휴지통의 속성 대화상자에서 설정할 수 없는 것은? 각 드라이브마다 휴지통의 크기를 단위로 다르게 설정할 MB","c":["수 있다. 파일을 삭제할 때 휴지통을 거치지 않고 바로 삭제하도록 설정","할 수 있다. 파일을 삭제할 때마다 확인 대화상자가 표시되도록 설정할","수 있다. 휴지통에 지정된 최대 크기를 초과하면 자동으로 휴지통 비우","기를 실행하도록 설정할 수 있다."]},{"n":18,"s":1,"a":3,"p":"18. 다음 중 한글 의 작업 보기와 가상 데스크톱에 대한 Windows 10 설명으로 옳지 않은 것은? 작업 보기 화면 상단에 표시된 가상 데스크톱에 마우스를 가져","c":["가면 해당 대스크톱에서 작업중인 앱이 표시된다.","을 누르거나 작업 표시줄의 작업 보기 아이콘 +[Tab] ( ) 을 클릭하여 작업 보기 화면을 표시할 수 있다. 가상 데스크톱을 제거한 경우 제거된 가상 데스크톱에서 작업","중인 앱은 자동으로 삭제된다. 작업 보기 화면에서 현재 작업 중인 앱을 마우스로 드래그하여","다른 가상 데스크톱으로 이동할 수 있다."]},{"n":19,"s":1,"a":2,"p":"19. 다음 중 한글 의 작업 표시줄에 대한 설명으로 옳지 Windows 10 않은 것은? 작","c":["업 표시줄을 자동으로 숨길 것인지의 여부를 선택할 수 있다. 바탕 화면 아이콘을 표시할 수 있다.","화면에서 작업 표시줄의 위치를 설정할 수 있다.","알림 영역에 표시할 아이콘을 설정할 수 있다.",""]},{"n":20,"s":1,"a":3,"p":"20. 다음 중 저작권법에 대한 설명으로 가장 적절하지 않은 것은? 저작권법은 저작자의 권리를 보호함을 목적으로 한다.","c":["원저작물을 번역편곡변형 등의 방법으로 작성한 차적 저 , , 2","작물도 독자적인 저작물로서 보호된다. 프로그램을 작성하기 위하여 사용하고 있는 프로그램 언어와","해법에도 적용된다. 저작 재산권이 있는 소프트웨어를 복사하여 판매한 경우 저작","권법에 저촉된다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"- 아래 시트와 같이 고급 필터를 실행 했을 경우 추출되지 않는 21. 이름은? 김소리","c":["이향진","김민정","이인호",""]},{"n":22,"s":2,"a":2,"p":"22. 다음 중 워크시트 이름으로 적절하지 않은 것은? 매출실적 _","c":["매출실적?","매출실적 #","매출실적&",""]},{"n":23,"s":2,"a":3,"p":"아래의 워크시트에서 영역이 블록으로 지정된 상태에서 23. [A1:C1] 채우기 핸들을 끌었을 때 셀에 입력되는 값으로 올바른 것은 [F1] ? 1","c":["-3","-7","0",""]},{"n":24,"s":2,"a":3,"p":"24. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로 기록 도중에 선택한 셀은 절대 참조로 기록할 수도","c":["있고 상대 참조로 기록할 수도 있다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 매크로 실행의 바로 가기 키가 우선한다. 컨트롤의 명령 단추를 추가하면 매크로 지정대화 ActiveX ‘ ’ [ ]","상자가 자동으로 표시되어 실행할 매크로를 바로 지정할 수 있다. 에서 코드 편집을 통해 매크로의 이름이나 내용을 바꿀 VBA","수 있다."]},{"n":25,"s":2,"a":1,"p":"25. 다음 중 각 차트 종류에 대한 설명으로 적절하지 않은 것은? 거품형 데이터 값이 두 개인 경우에만 사용할 수 있으며 :","c":["첫번째 값이 축두 번째 값이 데이터 표식의 크기로 사용된다 X , . 표면형 차트 두 개의 데이터 집합에서 최적의 조합을 찾을 :","때 사용된다. 분산형 차트 여러 데이터 계열에 있는 숫자 값 사이의 관계를 :","보여 주거나 두 개의 숫자 그룹을 좌표로 이루어진 하나의 xy 계열로 표시할 때 사용된다. 주식형 고가저가종가 등의 주식 거래 가격을 바탕으로 : , ,","차트를 작성한다."]},{"n":26,"s":2,"a":4,"p":"26. 숫자 을 입력한 후 아래의 표시 형식을 적용했을 때 표시되는 -24600 결과로 옳은 것은? 천원 천원 님 #0.0,“ ”;(#0.0,“ ”);0.0;@“ ” 천원 24.6","c":["24,600","천원 (-24.6 )","천원 (24.6 )",""]},{"n":27,"s":2,"a":1,"p":"27. 다음 중 원을 년간 연 의 이자율로 대출할 때 10,000,000 2 5.5% , 매월 말 상환해야 할 불입액을 구하기 위한 수식으로 옳은 것은? =PMT(5.5%/12, 12*2, -10000000)","c":["=PMT(5.5%, 12*2, -10000000)","=PMT(5.5%, 12*2, -10000000,0,1)","=PMT(5.5%/12, 12*2, -10000000,0,1)",""]},{"n":28,"s":2,"a":3,"p":"- 다음 중 아래 워크시트의 셀에서 을 입력한 후 을 28. [A1] 10.1 [Ctrl] 누르고 자동 채우기 핸들을 아래로 드래그한 경우 셀에 입력되 [A4] 는 값은?","c":["","","",""]},{"n":29,"s":2,"a":2,"p":"29. 다음 중 공유 통합 문서에 대한 설명으로 옳지 않은 것은? 여","c":["러 사용자가 동시에 동일한 셀을 변경하려면 충돌이 발생한다. 통합 문서를 공유한 후 하이퍼링크시나리오매크로 등의 , ,","기능은 변경할 수 없지만 조건부 서식차트그림 등의 기능은 , , 변경할 수 있다. 공유 통합 문서를 네트워크 위치에 복사해도 다른 통합 문서나","문서의 연결은 그대로 유지된다. 공유 통합 문서를 열면 창의 제목 표시줄의 엑셀 파일명 옆에","공유됨이라는 글자가 표시된다 ‘ ’ ."]},{"n":30,"s":2,"a":2,"p":"30. 다음 중 부분합에 대한 설명으로 옳지 않은 것은? 부분합을 작성하려면 첫 행에는 열 이름표가 있어야 하며그 ,","c":["룹화할 항목을 기준으로 반드시 정렬해야 제대로 된 결과를 얻을 수 있다. 그룹화를 위한 데이터의 정렬을 오름차순으로 할 때와 내림차","순으로 할 때의 그룹별 부분합의 결과는 서로 다르다. 부분합을 제거하면 부분합과 함께 표에 삽입된 개요 및 페이지","나누기도 모두 제거된다. 부분합 대화상자에서 새로운 값으로 대치를 해제하지 않고 ‘ ’","부분합을 실행하면 이전에 작성한 부분합은 삭제되고 새롭게 작성한 부분합만 표시된다."]},{"n":31,"s":2,"a":1,"p":"31. 다음 중 시나리오에 대한 설명으로 옳지 않은 것은? 시나리오 관리자에서 시나리오를 삭제하면 시나리오 요약 보","c":["고서의 해당 시나리오도 자동으로 삭제된다. 특정 셀의 변경에 따라 연결된 결과 셀의 값이 자동으로 변경","되어 결과값을 예측할 수 있다. 여러 시나리오를 비교하기 위해 시나리오를 피벗 테이블로","요약할 수 있다. 변경 셀과 결과 셀에 이름을 지정한 후 시나리오 요약 보고서","를 작성하면 결과에 셀 주소 대신 지정한 이름이 표시된다."]},{"n":32,"s":2,"a":1,"p":"32. 다음 중 머리글바닥글기능에 대한 설명으로 옳지 않은 것은 [ / ] ? 보기탭 통합 문서 보기그룹의 페이지 나누기 미리 보기 [ ] [ ] ‘ ’","c":["를 클릭하면 머리글 및 바닥글을 쉽게 삽입할 수 있다. 머리글이나 바닥글의 텍스트에 앰퍼샌드 문자 한 개를 포 (&)","함시키려면 앰퍼샌드 문자를 두 번 입력한다 (&) . 여러 워크시트에 동일한 머리글바닥글을 한 번에 추가하려 [ / ]","면 여러 워크시트를 선택하여 그룹화 한 후 설정한다. 차트 시트인 경우 페이지 설정대화상자의 머리글바닥글 [ ] [ / ]","탭에서 머리글바닥글을 추가할 수 있다 / ."]},{"n":33,"s":2,"a":3,"p":"- 33. 아래의 워크시트에서 경비지출 내역중 개의 값이 각각 변할 ‘ ’ 3 경우 총경비가 어떻게 변하는지를 알아보기 위한 기능으로 적합한 것은? 목표값 찾기","c":["데이터 표","시나리오","피벗 테이블",""]},{"n":34,"s":2,"a":3,"p":"34. 다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은? 조건부 서식의 조건은 결과가 또는 가 TRUE(1) FALSE(0)","c":["나오도록 작성한다. 같은 통합 문서의 특정 셀을 이용하여 조건을 지정할 수 있다.","새로운 규칙을 수식으로 작성할 경우워크시트의 특정 셀을 ,","클릭하면 상대 참조로 작성된다. 이동 옵션을 이용하여 조건부 서식이 지정된 셀을 찾을 수","있다."]},{"n":35,"s":2,"a":2,"p":"35. 다음 의 배열에 대한 설명으로 옳지 않은 것은 VBA ? 차원 배열은 행 차원 배열은 행과 열로 차원 배열은 면 1 , 2 , 3 ,","c":["행열로 이루어진 배열이다 , . 배열의 위치는 부터 시작한다 1 .","배열은 모든 데이터를 하나의 변수 이름으로 정의해 사용하는","것이다. 배열은 선언할 때 변수 이름 다음에 괄호를 만들어 배열의","크기를 지정한다."]},{"n":36,"s":2,"a":3,"p":"36. 다음 중 엑셀의 틀 고정에 대한 기능 설명으로 옳지 않은 것은? 틀 고정은 특정 행 또는 열을 고정할 때 사용하는 기능으로,","c":["주로 표의 제목 행 또는 제목 열을 고정한 후 작업할 때 유용하다. 선택된 셀의 왼쪽 열과 바로 위의 행이 고정된다.","틀 고정 구분선을 마우스로 잡아끌어 틀 고정 구분선을 이동시","킬 수 있다. 틀 고정 방법으로 첫 행 고정을 실행하면 선택된 셀의 위치와","상관없이 첫 행이 고정된다."]},{"n":37,"s":2,"a":4,"p":"37. 다음 중 아래의 워크시트를 이용한 수식에 대해서 그 결과가 옳지 않은 것은? 수식 결과 영어 =HLOOKUP(“ ”, A1:D7, 2)","c":["97 =OFFSET(B2, 3, 2)","88 =INDEX(A1:D7, 3, 2)","74 =AREAS(A1:D7)","28"]},{"n":38,"s":2,"a":2,"p":"38. 다음 중 데이터 입력에 대한 설명으로 옳지 않은 것은? 고정 소수점이 포함된 숫자를 입력하려면 옵션의 고 [Excel ] [","c":["급편집 옵션에서 소수점 자동 삽입확인란을 선택하고 소 ] ‘ ’ 수점 위치를 설정한다. 셀에 입력하는 글자 중 처음 몇 자가 해당 열의 기존 내용과","일치하면 나머지 글자가 자동으로 입력되며텍스트나 텍스트 , 숫자 조합날짜가 입력되는 경우에만 자동으로 입력된다 / , . 두 개 이상의 셀을 선택하고 채우기 핸들을 끌 때 을 [Ctrl]","누르고 있으면 자동 채우기 기능을 해제할 수 있다. 시간을 시간제로 입력하려면 과 같이 시간 뒤에 12 ‘9:00 pm’","공백을 입력하고 또는 을 입력한다 am pm ."]},{"n":39,"s":2,"a":1,"p":"- 39. 다음 중 엑셀의 오차 막대에 대한 설명으로 옳지 않은 것은? 세로 막대형 차트꺾은선형 차트분산형 차트거품형 차트 , , , ," ase Management","System) 데이터 조작어(DML, Data Manipulation Language)",""]},{"n":54,"s":3,"a":3,"p":"다음 중 서류봉투에 초대장을 넣어 발송하려는 경우 우편물에 54. 사용할 수신자의 주소를 프린트하기에 가장 적합한 보고서는? 업무 문서 양식 보고서","c":["우편 엽서 보고서","레이블 보고서","크로스탭 보고서",""]},{"n":55,"s":3,"a":2,"p":"- 다음 중 아래의 급여 테이블에 대한 명령과 실행 결과로 55. < > SQL 옳지 않은 것은 단빈 칸은 임 ? ( , Null ) 사원번호 성명 가족수 1 가 2 2 나 4 3 다","c":["","","",""]},{"n":56,"s":3,"a":4,"p":"다음 중 데이터 모델의 구성 요소가 아닌 것은 56. ? 논리적으로 표현된 데이터 구조","c":["실제 데이터의 논리적인 제약 조건","실제 데이터를 처리하는 연산","실제 데이터의 물리적인 저장 구조",""]},{"n":57,"s":3,"a":2,"p":"다음과 같이 제품테이블의 레코드는 모두 표시되고구매테이블 57. ‘ ’ , ‘ ’ 에서는 제품번호필드가 일치하는 레코드만 표시하는 조인 형식은 ‘ ’ 무엇인가? 내부 조인(Inner Join)","c":["왼쪽 외부 조인(Left Join)","오른쪽 외부 조인(Right Join)","카테션 곱(Cartesian Projuct Join)",""]},{"n":58,"s":3,"a":2,"p":"보고서는 데이터를 사용자가 원하는 형태로 출력해 주는 역할을 58. 수행한다다음 중 보고서에서 이용할 수 있는 레코드 원본으로 . 가장 적절하지 않은 것은? 외부의 엑셀 파일에 대한 연결 테이블","c":["액세스의 수식 작성 규칙에 맞게 식 작성기로 작성한 수식 [ ]","여러 테이블이나 쿼리를 이용하여 원하는 데이터를 조회하게","해주는 문 SQL 테이블의 내용중에서 원하는 형태의 데이터만을 조회하도록","작성해서 저장해 놓은 쿼리"]},{"n":59,"s":3,"a":1,"p":"다음 중 하위 쿼리 의 설명으로 옳지 않은 것은 59. (Sub Query) ? 하위 폼이나 하위 보고서는 반드시 하위 쿼리를 사용해야 한","c":["다. 주 쿼리에서 조건부를 사용하여 하위 쿼리의 일부 레코드에 IN","동일한 값이 있는 레코드만 검색할 수 있다. 문의 필드 목록이나 또는 절에서 SELECT WHERE HAVING","식 대신에 하위 쿼리를 사용할 수 있다. 주 쿼리에서 조건부를 사용하여 하위 쿼리에서 검색된 ALL","모든 레코드와 비교를 만족시키는 레코드만 검색할 수 있다."]},{"n":60,"s":3,"a":4,"p":"- 폼의 각 컨트롤에 포커스가 위치할 때 입력 모드를 한글로 지정하 60. ‘ ’ 고자 한다다음 중 이를 위해 설정해야 할 컨트롤 속성은 . ? 엔터키 기능(Enter Key Behavior)","c":["상태 표시줄 텍스트(Status Bar Text)","탭 인덱스(Tab Index)","입력 시스템 모드(IME Mode)",""]}]},{"id":"2025-상시-04","t":"2025 상시 04","q":[{"n":1,"s":1,"a":3,"p":"1. 다음 중 한글 의 레지스트리에 관한 설명으로 옳지 Windows 10 않은 것은? 의 자체 구성 정보를 저장하는 데이터베이스이다 Windows .","c":["에 탑재된 레지스트리 편집기는 이다 Windows ‘regedit.exe’ .","레지스트리 정보는 의 부팅 시에만 참조된다 Windows .","레지스트리에는 각 사용자의 프로필과 시스템 하드웨어설치 ,","된 프로그램 및 속성 설정에 대한 정보가 들어 있다."]},{"n":2,"s":1,"a":1,"p":"2. 다음 중 컴퓨터에서 사용하는 자료의 표현에 관한 설명으로 옳지 않은 것은? 실수형 데이터는 정해진 크기에 부호 와 가수부 로 (1bit) (7bit)","c":["구분하여 표현한다. 진 정수 데이터는 실수 데이터 보다 표현할 수 있는 범위가 2","작으며 연산 속도는 빠르다. 숫자 데이터 표현 중 진 연산을 위하여 팩 과 언팩 10 “ (Pack)","표현 방식이 사용된다 (Unpack)” . 컴퓨터에서 뺄셈을 수행하기 위해서는 보수와 덧셈 연산을","이용한다."]},{"n":3,"s":1,"a":3,"p":"3. 다음 중 한글 의 시스템 정보에 관한 설명으로 Windows 10 [ ] [ ] → 옳지 않은 것은? 설치된 의 크기를 확인할 수 있다 RAM .","c":["의 설치 날짜를 확인할 수 있다 Windows .","설치된 운영체제를 비트에서 비트로 변경할 수 있다 32 64 .","컴퓨터의 이름을 확인하거나 변경할 수 있다.",""]},{"n":4,"s":1,"a":2,"p":"4. 다음 중 에 대한 설명으로 옳은 것은 DoS(Denial of Service) ? 네트워크 주변을 지나다니는 패킷을 엿보면서 계정과 패스워","c":["드를 알아내는 행위이다. 대량의 데이터를 한 곳의 서버에 집중적으로 전송함으로써,","서버의 정상적인 기능을 방해하는 것이다. 정상적인 기능을 하는 프로그램으로 가장하여 프로그램 내에","숨어 있다가 해당 프로그램이 동작할 때 활성화되어 부작용을 일으키는 것이다. 서비스 기술자나 유지보수 프로그래머들의 액세스 편의를 위","해 만든 보안이 제거된 비밀통로이다."]},{"n":5,"s":1,"a":3,"p":"- 5. 다음 중 파일의 크기를 결정하는 요소에 해당하지 않는 것은 mp3 ? 재생 방식(Mono, Stereo)","c":["샘플 크기(Bit)","프레임 너비(Pixel)","",""]},{"n":6,"s":1,"a":3,"p":"6. 다음 중 사운드 카드 관련 용어에 대한 설명으로 옳지 않은 것은? 샘플링 은 아날로그 신호를 디지털 신호로 변환하 (Sampling)","c":["는 과정 중 한 단계이다. 샘플링률 이 높으면 높을수록 원음에 보다 가 (Sampling Rate)","깝다. 샘플링 주파수 는 낮으면 낮을 수록 좋 (Sampling Frequency)","다. 샘플링 비트 수는 음질에 영향을 미친다 (Sampling Bit) .",""]},{"n":7,"s":1,"a":1,"p":"7. 다음 중 컴퓨터 운영체제의 운영방식에 대한 설명으로 옳지 않은 것은? 다중 처리 한 개의 로 여러 개의 (Multi-Processing) : CPU","c":["프로그램을 동시에 처리하는 방식이다. 실시간 처리 처리할 데이터가 입력 (Real Time Processing) :","될 때 마다 즉시 처리하는 방식으로각종 예약 시스템이나 , 은행 업무 등에서 사용한다. 일괄 처리 컴퓨터에 입력하는 데이터를 (Batch Processing) :","일정량 또는 일정시간 동안 모았다가 한꺼번에 처리하는 방식 이다. 시분할 시스템 한 대의 시스템을 (Time Sharing System) :","여러 사용자가 동시에 사용하는 방식으로처리 시간을 짧은 , 시간 단위로 나누어 각 사용자에게 순차적으로 할당하여 실행 한다."]},{"n":8,"s":1,"a":2,"p":"8. 다음 중 프린터에서 출력할 파일의 해상도를 조절하거나 스캐너를 이용해 스캔한 파일의 해상도를 조절하기 위해 쓰는 단위는? PPM(Paper Per Minute)","c":["DPI(Dots Per Inch)","CPS(Character Per Second)","BPS(Bits Per Second)",""]},{"n":9,"s":1,"a":1,"p":"9. 다음 중 컴퓨터 보안 기법의 하나인 방화벽에 관한 설명으로 옳지 않은 것은? 전자 메일 바이러스나 온라인 피싱 등을 방지할 수 있다.","c":["해킹 등에 의한 외부로의 정보 유출을 막기 위해 사용하는","보안 기법이다. 외부 침입자의 역추적 기능이 있다.","내부의 불법 해킹은 막지 못한다.",""]},{"n":10,"s":1,"a":4,"p":"- 10. 다음 중 컴퓨터에서 사용하는 기억장치에 관한 설명으로 옳지 않은 것은? 플래시 메모리는 비휘발성 기억장치로 주로 디지털 (Flash)","c":["카메라나 개인용 정보 단말기 드라이브 등 휴대형 MP3, , USB 기기에서 대용량 정보를 저장하는 용도로 사용된다. 하드디스크 인터페이스 방식은 방식 등이 EIDE, SATA, SCSI","있다.","",""]},{"n":11,"s":1,"a":4,"p":"11. 다음 중 컴퓨터의 연산장치에 있는 레지스터에 관한 설명으로 옳지 않은 것은? 진수 덧셈을 수행하는 가산기 가 있다 2 (Adder) .","c":["뺄셈을 수행하기 위해 입력된 값을 보수로 변환하는 보수기","가 있다 (Complementor) . 연산 결과를 일시적으로 저장하는 누산기 가 있 (Accumulator)","다. 연산에 사용될 데이터를 기억하는 상태 레지스터(Status","가 있다 Register) ."]},{"n":12,"s":1,"a":2,"p":"12. 다음 중 저작재산권의 제한사항으로 옳지 않은 것은? 시사 보도에 이용할 경우","c":["영리를 목적으로 하는 공연방송인 경우 ·","보도비평교육연구 등에 공표된 저작물을 인용할 경우 · · ·","재판 절차 등에 복제할 경우",""]},{"n":13,"s":1,"a":4,"p":"13. 다음 중 인터넷 통신 장비인 게이트웨이 의 기본적인 (Gateway) 역할에 관한 설명으로 옳은 것은? 네트워크 계층의 연동장치로 경로 설정에 사용된다.","c":["문자로 된 도메인 이름을 숫자로 이루어진 실제 주소로 IP","변환하는데 사용된다. 인","터넷 신호를 증폭하며 먼 거리로 정보를 전달할 때 사용된다. 현","재 위치한 네트워크에서 다른 네트워크로 연결할 때 사용된다."]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 에 관한 설명으로 옳지 BIOS(Basic Input Output System) 않은 것은? 컴퓨터의 기본 입출력장치나 메모리 등 하드웨어 작동에 필요","c":["한 명령들을 모아 놓은 프로그램이다. 컴퓨터의 전원을 켜면 자동으로 가장 먼저 기동되며기본 입 ,","출력장치나 메모리 등 하드웨어의 이상 유무를 검사한다. 최근에는 보조기억장치인 에 저장되므로 칩을 교환하지 SSD","않고도 바이오스를 업그레이드 할 수 있다. 셋업 프로그램을 이용하여 시스템의 날짜와 시간부팅 CMOS ,","순서 등 일부 정보를 설정할 수 있다 BIOS ."]},{"n":15,"s":1,"a":2,"p":"15. 다음 중 한글 의 관리 도구에 대한 설명으로 Winodws 10 [Windows ] 옳은 것은? 시스템 정보는 컴퓨터에 설치된 모든 하드웨어와 소프트웨 [ ]","c":["어의 실행 정보를 한군데 모아 관리한다. 디스크 정리는 디스크의 필요 없는 파일을 삭제하여 여유 [ ]","공간을 확보하는 기능으로 필요 없는 프로그램의 제거도 가능 하다. 레지스트리 편집기에서는 하드웨어 리소스구성 요소설치 [ ] , ,","된 소프트웨어 환경 등의 정보를 확인한다. [","컴퓨터 관리는 하드디스크에 논리적 혹은 물리적으로 손상이 ] 있는지 검사하고복구 가능한 에러가 있으면 이를 복구한다 , ."]},{"n":16,"s":1,"a":1,"p":"- 16. 다음 중 계층 모델에서 등의 프로토콜을 OSI 7 Telnet, FTP, E-mail 포함하는 계층으로 옳은 것은? 응용 계층 (Application)","c":["트랜스포트 계층 (Transport)","물리 계층 (Physical)","데이터 링크 계층 (Data Link)",""]},{"n":17,"s":1,"a":4,"p":"17. 다음 중 컴퓨터의 장치를 교체할 때 고려해야 할 사항으로 옳지 않은 것은? 하드디스크의 용량 은 클수록 좋다 (Gb) .","c":["모니터가 지원하는 해상도 는 클수록 좋다 (dpi) .","코어의 수는 많을수록 좋다 CPU .","의 데이터 접근 속도 는 클수록 좋다 DRAM (ns) .",""]},{"n":18,"s":1,"a":1,"p":"18. 다음 중 파일이나 폴더를 복사하는 방법으로 옳지 않은 것은? 같은 드라이브에서 다른 위치로 파일이나 폴더를 복사하려면","c":["를 누른 채 파일이나 폴더를 다른 드라이브로 끌어다 [Shift] 놓는다. 파일이나 폴더를 선택하고 를 누른 후 복사할 위치 [Ctrl]+[C]","에서 를 누른다 [Ctrl]+[V] . 다른 드라이브로 파일이나 폴더를 복사하려면 아무것도 누르","지 않은 상태에서 파일이나 폴더를 끌어다 놓는다. 파일이나 폴더를 선택하고 바로 가기 메뉴에서 복사를 선택 [ ]","한 후 복사할 위치에서 바로 가기 메뉴의 붙여넣기를 선택 [ ] 한다."]},{"n":19,"s":1,"a":1,"p":"19. 다음 중 한글 의 글꼴에 관한 설명으로 옳지 않은 Windows 10 [ ] 것은? 글꼴 파일은 또는 의 확장자를 가지고 있다 .rtf .inf .","c":["글꼴이 설치되어 있는 폴더의 위치는 C:\\Windows\\Fonts","이다. 텍스트 조정을 사용하면 가독성을 향상시켜 준다 ClearType .","글꼴에는 기울임꼴굵게굵게 기울임꼴과 같은 글꼴 스타일 , ,","이 있다."]},{"n":20,"s":1,"a":1,"p":"20. 다음 중 시스템 소프트웨어에 대한 설명으로 옳지 않은 것은? 사용자가 컴퓨터를 이용하여 특정 업무를 처리할 수 있게 개발","c":["된 프로그램이다. 시스템 소프트웨어는 제어 프로그램과 처리 프로그램으로 구","분된다. 컴퓨터 시스템을 효율적으로 운영해 주는 소프트웨어이다.","대표적인 시스템 소프트웨어로는 운영체제가 있다.","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"21. 다음 워크시트에서 파일 옵션을 선택하여 옵션 [ ] [ ] ‘Excel ’ → 대화상자에서 소수점 위치를 로 지정한 후 셀에 을 입력할 ‘ ’ ‘-2’ 1 경우 화면에 표시되는 값은? 0.01","c":["1","100","10000",""]},{"n":22,"s":2,"a":4,"p":"- 22. 다음 중 수식의 결과가 옳지 않은 것은? =FIXED(3456.789, 1, FALSE) 3,456.8","c":["→ =EOMONTH(DATE(2015, 2, 25), 1) 2015-03-31","→ 동 서 남 남 =CHOOSE(ROW(A3:A6), “ ”, “ ”, “ ”, 2015)","→",""]},{"n":23,"s":2,"a":4,"p":"23. 아래와 같이 통합 문서 보호를 설정했을 경우에 대한 설명으로 옳지 않은 것은? 워크시트를 이동하거나 삭제할 수 없다.","c":["새 워크시트 또는 차트 시트를 삽입할 수 없다.","시나리오 요약 보고서를 만들 수 없다.","워크시트에 작성된 차트를 다른 시트로 이동할 수 없다.",""]},{"n":24,"s":2,"a":3,"p":"24. 아래 워크시트에서 영역에는 직책별 부서별 목표액의 [B13:D14] 합계를 함수를 이용하여 계산하였다함수가 아닌 분석 도구를 . 이용하여 계산할 경우 가장 알맞은 도구는? 목표값 찾기","c":["통합","피벗 테이블","시나리오",""]},{"n":25,"s":2,"a":4,"p":"- 25. 다음은 셀부터 셀의 평균을 셀에최대값을 [C3] [F3] [G3] , [H3] 셀에 계산한 후 영역을 블록으로 지정하고 채우기 핸들을 [G3:H3] 영역까지 드래그하여 계산하는 매크로이다다음 중 [G10:H10] . 괄호 안에 해당하는 값으로 틀린 것은 ( ) ? 매크로 Sub 1( ) Range(\"G3\").Select Selection.FormulaR1C1 = \"( )\" ⓐ Range(\"H3\").Select Selection.FormulaR1C1 = \"( )\" ⓑ Range(\"G3:H3\").Select Selection.( ) :( ), Type:=xlFillDefault ⓒ ⓓ Range(\"G3:H10\").Select End Sub =MAX(RC[-5]:RC[-2])","c":["ⓑ =AVERAGE(RC[-4]:RC[-1])","ⓐ =Range(“G3:H10”)","ⓓ Auto Destination","ⓒ"]},{"n":26,"s":2,"a":3,"p":"26. 다음 중 이름 상자에 대한 설명으로 옳지 않은 것은? 을 누르고 여러 개의 셀을 선택한 경우 마지막 선택한 [Ctrl]","c":["셀 주소가 표시된다. 셀이나 셀 범위에 이름을 정의해 놓은 경우 이름이 표시된다.","차트가 선택되어 있는 경우 차트의 종류가 표시된다.","수식을 작성 중인 경우 최근 사용한 함수 목록이 표시된다.",""]},{"n":27,"s":2,"a":3,"p":"27. 다음 중 엑셀의 인쇄 기능에 대한 설명으로 옳지 않은 것은? 차트만 제외하고 인쇄하기 위해서는 차트 영역 서식창에서 [ ]","c":["개체 인쇄의 체크를 해제한다 ‘ ’ . 시","트에 표시된 오류 값을 제외하고 인쇄하기 위해서는 페이지 [ 설정대화상자에서 셀 오류 표시를 공백으로 선택한다 ] ‘ ’ ‘< >’ . 인쇄 내용을 페이지의 가운데에 맞춰 인쇄하려면 페이지 설 [","정 대화상자에서 문서에 맞게 배율 조정을 체크한다 ] ‘ ’ . 인쇄되는 모든 페이지에 특정 행을 반복하려면 페이지 설정 [ ]","대화상자에서 인쇄 제목의 반복할 행에 열 레이블이 포함된 ‘ ’ ‘ ’ 행의 참조를 입력한다."]},{"n":28,"s":2,"a":1,"p":"28. 다음 중 시나리오에 대한 설명으로 옳지 않은 것은? 시나리오 요약 보고서를 만들 때에는 결과 셀을 반드시 지정해","c":["야 하지만시나리오 피벗 테이블 보고서를 만들 때에는 결과 , 셀을 지정하지 않아도 된다. 여러 시나리오를 비교하여 하나의 테이블로 요약하는 보고서","를 만들 수 있다. 시나리오 요약 보고서를 생성하기 전에 변경 셀과 결과 셀에","이름을 정의하면 셀 참조 주소 대신 정의된 이름이 보고서에 표시된다. 시나리오 요약 보고서는 자동으로 다시 갱신되지 않으므로","변경된 값을 요약 보고서에 표시하려면 새 요약 보고서를 만 들어야 한다."]},{"n":29,"s":2,"a":2,"p":"- 아래의 워크시트에서 성명이 두 글자이고 실적이 전체 실적의 29. ‘ ’ 평균보다 큰 데이터를 필터링하고자 한다다음 중 고급 필터 . 실행을 위한 조건의 입력 값으로 옳은 것은?","c":["성명 실적 =“=??” =B2>AVERAGE($B$2:$B$10)","성명 실적평균 =“=??” =B2>AVERAGE($B$2:$B$10)","성명 실적 =“=??” =B2>AVERAGE($B$2:$B$10)","성명 실적평균 =“=??” =B2>AVERAGE($B$2:$B$10)"]},{"n":30,"s":2,"a":1,"p":"30. 다음 중 아래의 워크시트에서 수식의 결과로 부사장을 출력하지 ‘ ’ 않는 것은? =CHOOSE(CELL(“row”, B3), C2, C3, C4, C5, C6)","c":["=CHOOSE(TYPE(B4), C2, C3, C4, C5, C6)","=OFFSET(A1:A6, 2, 2, 1, 1)","=INDEX(A2:D6, MATCH(A3, A2:A6, 0), 3)",""]},{"n":31,"s":2,"a":1,"p":"31. 다음 중 오류값 가 발생하는 원인으로 올바른 것은 ‘#VALUE!’ ? 잘못된 인수나 피연산자를 사용했을 경우","c":["수식에서 값을 으로 나누려고 할 경우 0","함수나 수식에 사용할 수 없는 값을 지정했을 경우","셀 참조가 유효하지 않을 때",""]},{"n":32,"s":2,"a":2,"p":"32. 다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 용지 방향용지 크기인쇄 품질을 설정할 수 있다 , , .","c":["머리글바닥글탭의 머리글영역에서 행열 머리글의 인쇄 ‘ / ’ ‘ ’ /","여부를 설정한다. 여백은 사용자가 직접 값을 입력할 수 있다.","워크시트에서 차트를 마우스로 선택한 후 페이지 설정메뉴 [ ]","를 선택하면 시트탭이 차트탭으로 바뀐다 , ‘ ’ ‘ ’ ."]},{"n":33,"s":2,"a":1,"p":"33. 다음 중 윗주에 대한 설명으로 옳지 않은 것은? 데이터를 삭제해도 윗주는 그대로 표시되어 있다.","c":["윗주의 서식을 변경할 수 있다.","문자열 데이터가 입력되어 있는 셀에만 윗주를 표시할","수 있다. 윗주는 셀에 대한 주석을 설정하는 것이다.",""]},{"n":34,"s":2,"a":4,"p":"34. 다음 중 외부 데이터의 쿼리 및 연결설정 기능에 대한 설명으로 [ ] 옳지 않은 것은? 연결 속성대화상자에서 시트이름위치셀범위개체에 [ ] , , ( , ,","c":["대한 참조 값수식 등 통합 문서에서 사용되는 연결 위치 ), , 정보가 제공된다. 연결 속성대화상자에서 일정한 시간 간격으로 외부 데이터 [ ]","를 자동으로 새로 고치도록 설정할 수 있다. 연결 속성대화상자에서 통합 문서를 열 때 외부 데이터를 [ ]","자동으로 새로 고치거나 외부 데이터를 새로 고치지 않고 즉시 통합 문서를 열도록 설정할 수 있다. 연결을 제거하면 현재 통합 문서에 외부에서 연결하여 가져","온 데이터도 함께 제거된다."]},{"n":35,"s":2,"a":1,"p":"- 35. 다음 중 차트에 관한 설명으로 옳지 않은 것은? 거품형 차트에서 데이터 레이블로 거품 크기를 지정하면 첫 ‘ ’","c":["번째 값이 거품 크기로 표시된다. 차트를 작성하려면 반드시 원본 데이터가 있어야 하며작성된 ,","차트는 원본 데이터가 변경되면 차트의 내용이 함께 변경된다. 기본 차트는 을 누르면 별도의 차트 시트에 삽입되고 [F11] ,","[ 을 누르면 데이터가 있는 현재 워크시트에 삽입된다 Alt]+[F1] . 자주 사용하는 형태의 차트를 차트 서식 파일 폴더에 서식","파일 로 저장하여 이용하면 편리하다 (crtx) ."]},{"n":36,"s":2,"a":4,"p":"36. 셀의 값이 이상이면 이하면 그 외는 값이 100 “ ”, -100 “ ”, ▲ ▼ 그대로 표시되는 사용자 지정 표시 형식으로 옳은 것은? 표시 예 [ ] 150 : ▲ 0 : 0 -50 : -50 -122 : ▼ [>=100]“ ”;#;[<=-100]“ ”","c":["▲ ▼ [>=100]“ ”;0;[<=-100]“ ”","▲ ▼ [>=100]“ ”;[<=-100]“ ”;#","▲ ▼ [>=100]“ ”;[<=-100]“ ”;0","▲ ▼"]},{"n":37,"s":2,"a":3,"p":"37. 다음 중 데이터가 입력된 셀에서 채우기 핸들을 드래그하여 데이터 를 채우는 경우에 대한 설명으로 옳지 않은 것은? 문자 데이터가 입력된 셀을 선택하고 채우기 핸들을 드래그하","c":["면 그대로 복사되어 채워진다. 숫자 데이터가 입력된 셀을 선택하고 을 누른 채 채우기 [Ctrl]","핸들을 드래그하면 씩 증가하면서 채워진다 1 . 개의 숫자와 문자가 조합된 데이터가 입력된 셀을 선택하고 1","을 누른 채 채우기 핸들을 드래그 하면 숫자만 씩 증가 [Ctrl] 1 하면서 채워진다. 숫자가 입력된 두 개의 셀을 선택하고 채우기 핸들을 드래그하","면 두 값의 차이만큼 증가감소하며 채워진다 / ."]},{"n":38,"s":2,"a":3,"p":"38. 다음 중 에서 프로시저 에 대한 설명으로 옳지 VBA (Procedure) 않은 것은? 특정한 기능을 수행할 수 있는 명령문들의 집합이다.","c":["사용자가 직접 기록한 매크로도 프로시저로 기록된다.","프로시저는 명령문들의 실행 결과를 반환한 Sub End Sub","∼ 다. 하나 이상의 프로시저들을 이용하여 모듈을 구성할 수 있다.",""]},{"n":39,"s":2,"a":3,"p":"39. 다음 중 엑셀의 정렬 기능에 대한 설명으로 옳지 않은 것은? 오름차순 정렬과 내림차순 정렬 모두 빈 셀은 항상 마지막으로","c":["정렬된다. 영숫자 텍스트는 왼쪽에서 오른쪽 방향으로 문자 단위로 정렬","된다. 사용자가 정렬 옵션대화상자에서 대소문자를 구분하도록 [ ] /","변경하여오름차순으로 정렬하면 대문자가 소문자보다 우선 , 순위를 갖는다. 공백으로 시작하는 문자열은 오름차순 정렬일 때 숫자 바로","다음에 정렬되고내림차순 정렬일 때는 숫자 바로 앞에 정렬 , 된다."]},{"n":40,"s":2,"a":2,"p":"40. 다음 중 시트 보호 시 이 워크시트의 모든 사용자에게 방법으로 옳은 것은? 텍스트 상자의 컨트롤 원본을 로 지정하고누적 합계 속성 ‘=1’ ,","c":["을 그룹으로 지정한다 ‘ ’ . 텍스트 상자의 컨트롤 원본을 로 지정하고누적 합계 ‘+1’ ,","속성을 그룹으로 지정한다 ‘ ’ . 텍스트 상자의 컨트롤 원본을 로 지정하고누적 합계 ‘+1’ ,","속성을 모두로 지정한다 ‘ ’ . 텍스트 상자의 컨트롤 원본을 로 지정하고누적 합계 속성 ‘=1’ ,","을 모두로 지정한다 ‘ ’ ."]},{"n":56,"s":3,"a":1,"p":"다음 중 폼 영역에 대한 설명으로 틀린 것은 56. ? 연속 폼으로 설정하면 폼의 모든 영역이 반복되어 표시된다.","c":["폼에는 기본적으로 세부 구역본문이 표시되며폼 머리글바 ( ) , /","닥글페이지 머리글바닥글 구역을 표시하거나 숨길 수 있다 , / . 페이지 머리글과 바닥글은 인쇄를 위해 사용된다.","","폼은 기본적으로 본문폼 머리글바닥글페이지 머리글바닥 , / , / 글 구역으로 구분된다."]},{"n":57,"s":3,"a":2,"p":"다음 중 보고서의 페이지 설정대화상자에 대한 설명으로 옳지 57. ‘ ’ 않은 것은? 열의 너비와 높이를 보고서 본문의 너비와 높이에 맞춰 인쇄할","c":["수 있다. 페이지 설정대화상자에 설정한 사항은 모든 보고서에 동일 ‘ ’","하게 적용된다. 여백용지 방향프린터 유형을 지정할 수 있다 , , .","인쇄 옵션탭의 데이터만 인쇄를 선택하여 체크 표시하면 [ ] ‘ ’","컨트롤의 테두리눈금선 및 선이나 상자 같은 그래픽을 표시 , 하지 않는다."]},{"n":58,"s":3,"a":2,"p":"다음 매출 테이블에 대한 함수 적용 결과로 틀린 것은 58. < > ? 매출 < > 순번 수량 금액 1 10 4000 2 20 5000 3 10 4500 4 Null 3500 5 10 4600 금액 =Count([ ]) 5","c":["→ 수량 =Avg([ ]) 10","→ 금액 =Max([ ]) 5000","→ 수량 =Sum([ ]) 50","→"]},{"n":59,"s":3,"a":3,"p":"다음 중 분할 표시 폼에 대한 설명으로 옳지 않은 것은 59. ? 분할 표시 폼은 만들기탭의 폼그룹에서 기타 폼 [ ] [ ] [ ]","c":["→ 폼 분할을 클릭하여 만들 수 있다 [ ] . 분할 표시 폼은 데이터시트 보기와 폼 보기를 동시에 표시하기","기능이며이 두 보기는 같은 데이터 원본에 연결되어 있어 , 항상 상호 동기화된다. 분할 표시 폼을 만든 후에는 컨트롤의 크기 조정은 할 수 없으","나새로운 필드의 추가는 가능하다 , . 폼 속성 창의 분할 표시 폼 방향항목을 이용하여 폼의 위쪽 ‘ ’ ,","아래쪽왼쪽오른쪽 등 데이터시트가 표시되는 위치를 설정 , , 할 수 있다."]},{"n":60,"s":3,"a":4,"p":"- 다음 중 액세스의 매크로에 대한 설명으로 옳지 않은 것은 60. ? 반복적으로 수행되는 작업을 자동화하여 간단히 처리할 수","c":["있도록 하는 기능이다. 매크로 함수 또는 매크로 함수 집합으로 구성되며각 매크로 ,","함수의 수행 방식을 제어하는 인수를 추가할 수 있다. 매크로를 이용하여 폼을 열고 닫거나 메시지 박스를 표시할","수도 있다. 매크로는 주로 컨트롤의 이벤트에 연결하여 사용하며폼 개체 ,","내에서만 사용할 수 있다."]}]},{"id":"2025-상시-05","t":"2025 상시 05","q":[{"n":1,"s":1,"a":3,"p":"1. 다음 중 컴퓨터 통신에서 사용하는 프록시 서버의 기능으로 (Proxy) 옳은 것은? 네트워크 병목현상 해결 기능","c":["프로토콜 연결 해제 기능 FTP","방화벽 기능과 캐시 기능","내부 불법 해킹 차단 기능",""]},{"n":2,"s":1,"a":4,"p":"2. 다음 중 시스템 복구를 해야 하는 시기로 가장 적절하지 않은 것은? 로","c":["그온 화면이 나타나지 않으며운영체제를 시작할 수 없을 , 때 새 장치를 설치한 후 시스템이 불안정 할 때","누락되거나 손상된 데이터 파일을 이전 버전으로 되돌리고자","할 때 파일의 단편화를 개선하여 디스크의 접근 속도를 향상시키고","자 할 때"]},{"n":3,"s":1,"a":1,"p":"3. 다음 중 컴퓨터 통신과 관련하여 방식에 관한 설명으로 옳은 P2P 것은? 인터넷에서 이루어지는 개인 대 개인의 파일 공유를 위한 기술","c":["이다. 인터넷을 통해 를 제공해 주는 기술 및 서비스이다 MP3 .","인터넷을 통해 동영상을 상영해 주는 기술 및 서비스이다.","여러 사용자가 동시에 온라인 게임을 할 수 있도록 제공해","주는 기술이다."]},{"n":4,"s":1,"a":4,"p":"4. 다음 중 컴퓨터 프로그래밍 언어인 언어에 대한 설명으로 JAVA 옳지 않은 것은? 네트워크 환경에서 분산 작업이 가능하다.","c":["멀티스레드 기능을 제공하므로 여러 작업을 동시에 처리할","수 있다. 운영체제에 관계없이 독립적으로 실행할 수 있는 프로그램을","작성할 수 있다. 수식처리를 비롯하여 기호 처리 분야에 사용되고 있으며 특히","인공 지능 분야에 널리 사용되고 있다."]},{"n":5,"s":1,"a":1,"p":"- 5. 다음 중 컴퓨터에서 사용하는 모니터에 관한 설명으로 옳지 않은 것은? 모니터 크기는 화면의 가로와 세로 길이를 더한 값을 로 Inch","c":["표시한다. 모니터 해상도는 픽셀 수에 따라 결정된다 (Pixel) .","재","생률 이 높을수록 모니터의 깜박임이 줄어든다 (Refresh Rate) .",""]},{"n":6,"s":1,"a":2,"p":"6. 다음 중 에 대한 설명으로 옳은 RAM(Random Access Memory) 것은? 주로 펌웨어 를 저장한다 (Firmware) .","c":["주기적으로 재충전 이 필요한 은 주기억장치 (Refresh) DRAM","로 사용된다. 컴퓨터의 기본적인 입출력 프로그램자가진단 프로그램 등이 ,","저장되어 있어 부팅 시 실행된다. 전원이 꺼져도 기억된 내용이 사라지지 않는 비휘발성 메모리","로 읽기만 가능하다."]},{"n":7,"s":1,"a":2,"p":"7. 다음 중 인터넷과 관련하여 스트리밍 기술에 관한 (Streaming) 설명으로 옳은 것은? 정지 화상의 프레임에서 중복되는 정보를 삭제하여 데이터를","c":["압축하는 기술이다. 네트워크를 통해 대용량의 멀티미디어 데이터 파일을 다운","받을 때 사용자가 전체 파일을 다운 받을 때까지 기다릴 필요 없이 전송되는 대로 재생시키는 기술이다. 하이퍼텍스트와 멀티미디어를 통합한 개념으로 문자뿐만 아","니라 그래픽사운드동영상 등의 정보를 연결해 놓은 미디어 , , 통합 기술이다. 카메라로 촬영한 아날로그 영상을 디지털 영상으로 변환캡처 ,","하여 편집저장 시키는 기술이다 , ."]},{"n":8,"s":1,"a":4,"p":"8. 정보시스템을 통하여 전자문서를 전송하기 위해서는 정보 보호를 위하여 보안 서비스가 필요하다다음 중 보안 서비스에 해당하지 . 않는 것은? 부인방지","c":["기밀성","무결성","확장성",""]},{"n":9,"s":1,"a":3,"p":"9. 다음 중 컴퓨터의 하드디스크와 관련하여 RAID(Redundant Array 기술에 관한 설명으로 옳지 않은 것은 of Inexpensive Disks) ? 미러링 방식은 데이터를 두 개의 디스크에 동일하 (Mirroring)","c":["게 기록하여 한쪽 디스크의 데이터 손상 시 다른 한쪽 디스크 를 이용하여 복구한다. 스트라이핑 방식은 데이터를 여러 개의 디스크에 (Striping)","나눠서 기록하는 방법으로 자료를 읽고 쓰는 시간을 단축할 수는 있다. 한 개의 하드디스크를 여러 개의 하드디스크처럼 나누어 관리","하는 기술이다. 를 이용하면 데이터의 안정성이 높아지며데이터 복구 RAID ,","가 용이하다."]},{"n":10,"s":1,"a":1,"p":"- 10. 다음 중 컴퓨터에서 사용하는 자료의 외부적 표현 방식에 관한 설명으로 옳은 것은? 는 데이터 통신용이나 개인용 컴퓨터에서 사용하며 ASCII ,","c":["","","",""]},{"n":11,"s":1,"a":4,"p":"11. 다음 중 인터넷 보안을 위한 해결책으로 사용되는 암호화 기법에 대한 설명으로 옳지 않은 것은? 비밀키 암호화 기법은 동일한 키로 데이터를 암호화하고 복호","c":["화한다. 비밀키 암호화 기법은 대칭키 암호화 기법 또는 단일키 암호화","기법이라고도 하며 대표적으로 , DES(Data Encryption 가 있다 Standard) . 공개키 암호화 기법은 비대칭 암호화 기법이라고도 하며대표 ,","적인 암호화 방식으로 가 있 RSA(Rivest, Shamir, Adleman) 다. 공개키 암호화 기법에서는 암호화할 때 사용하는 키는 비밀로","하고복호화 할 때 사용하는 키는 공개하는 방식을 사용한다 , ."]},{"n":12,"s":1,"a":3,"p":"12. 다음 중 의 바이오스 에 대한 설명으로 옳지 않은 것은 PC (BIOS) ? 바이오스는 컴퓨터의 입출력 장치나 메모리 등 하드웨어를","c":["관리하는 프로그램이다. 컴퓨터에 연결된 주변장치를 관리하는 인터럽트(Interrupt)","처리 부분이 있다. 바이오스는 하드디스크에 저장되어 있다.","의 전원을 올리면 먼저 바이오스 프로그램이 작동하여 시 PC","스템을 초기화시킨다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 전자우편에서 사용하는 프로토콜에 관한 설명으로 POP3 옳은 것은? 사용자가 작성한 이메일을 다른 사람의 계정으로 전송해 주는","c":["역할을 한다. 메일 서버의 이메일을 사용자의 컴퓨터로 가져올 수 있도록","메일 서버에서 제공하는 프로토콜이다. 멀티미디어 전자우편을 주고 받기 위한 인터넷 메일의 표준","프로토콜이다. 웹 브라우저에서 제공하지 않는 멀티미디어 파일을 확인하여","실행시켜주는 프로토콜이다."]},{"n":14,"s":1,"a":4,"p":"14. 다음 중 한글 의 백업과 복원에 관한 설명으로 옳지 Windows 10 않은 것은? 파일이 백업되는 주기를 지정할 수 있다.","c":["파일 히스토리를 이용하여 자동으로 파일이 백업되도록 설정","할 수 있다. 백업된 파일을 복원할 때 복원 위치를 설정할 수 있다.","백업에서 제외할 폴더를 지정할 수 없다.",""]},{"n":15,"s":1,"a":1,"p":"15. 핸드폰노트북과 같은 휴대기기를 서로 연결하여 정보를 교환할 , 수 있도록 하는 근거리 무선 통신 기술은? 블루투스","c":["와이파이","와이브로","테더링",""]},{"n":16,"s":1,"a":4,"p":"- 16. 다음 중 컴퓨터 운영체제 대한 설명으로 옳지 않은 것은 (OS) ? 컴퓨터 하드웨어와 응용 프로그램을 사용하고자 하는 사용자","c":["사이에 위치하여 인터페이스 역할을 해주는 소프트웨어이다. 운영체제는 컴퓨터가 동작하는 동안 주기억장치에 위치하며,","프로세스기억장치입출력장치파일 등의 자원을 관리한 , , · , 다.","",""]},{"n":17,"s":1,"a":1,"p":"17. 다음 중 인터넷 해킹과 관련하여 피싱 에 관한 설명으로 (Phishing) 옳은 것은? 거짓 메일을 보내서 가짜 금융 기관 등의 가짜 웹 사이트로","c":["유인하여 정보를 빼내는 행위이다. 정상적인 기능을 하는 프로그램으로 가장하여 프로그램 내에","숨어 있다가 해당 프로그램이 동작할 때 활성화되어 부작용을 일으킨다. 여러 대의 장비를 이용하여 특정 서버에 대량의 데이터를 집중","적으로 전송함으로써 서버의 정상적인 동작을 방해하는 행위 이다. 네트워크를 거쳐 전송되는 패킷 정보를 읽어 계정과 암호를","알아내는 행위이다."]},{"n":18,"s":1,"a":1,"p":"18. 다음 중 인터넷에서 사용하는 표준 주소 체계인 URL(Uniform 의 가지 구성 요소를 순서대로 옳게 나열한 Resource Locator) 4 것은? 프로토콜서버 주소포트 번호파일 경로 , , ,","c":["서버 주소프로토콜포트 번호파일 경로 , , ,","프로토콜서버 주소파일 경로포트 번호 , , ,","포트 번호프로토콜서버 주소파일 경로 , , ,",""]},{"n":19,"s":1,"a":1,"p":"19. 다음 중 인터넷 서버까지의 경로를 추적하는 명령어인 에 ‘Tracert’ 대한 설명으로 옳은 것은? 주소목적지까지 거치는 경로의 수각 구간 사이의 데이터 IP , ,","c":["왕복 속도를 확인할 수 있다. 원격 컴퓨터가 현재 네트워크에 연결되어 정상적으로 작동하","고 있는지 알아볼 수 있다. 컴퓨터와 컴퓨터 또는 컴퓨터와 인터넷 사이에서 파일을 주고","받을 수 있도록 하는 원격 파일 전송 프로토콜이다. 현재 자신의 컴퓨터에 연결된 다른 컴퓨터의 주소 및 포트 IP","정보를 볼 수 있다."]},{"n":20,"s":1,"a":3,"p":"20. 다음 중 인터넷에서 사용하는 에 관한 설명으로 옳지 않은 DNS 것은? 는 또는 DNS Domain Name Server Domain Name System","c":["의 약자로 쓰인다. 문자로 만들어진 도메인 이름을 숫자로 된 주소로 바꾸는 IP","시스템이다. 서버는 주소를 이용하여 패킷의 최단 전송 경로를 DNS IP","설정한다. 에서는 모든 호스트들을 각 도메인별로 계층화 시켜서 DNS","관리한다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":4,"p":"- 21. 다음 중 엑셀의 틀 고정에 대한 기능 설명으로 옳지 않은 것은? 틀 고정 방법으로 첫 행 고정을 실행하면 선택된 셀의 위치와","c":["상관없이 첫 행이 고정된다. 틀 고정은 특정 행 또는 열을 고정할 때 사용하는 기능으로,","주로 표의 제목 행 또는 제목 열을 고정한 후 작업할 때 유용하다. 선택된 셀의 왼쪽 열과 바로 위의 행이 고정된다.","틀 고정 구분선을 마우스로 잡아끌어 틀 고정 구분선을 이동시","킬 수 있다."]},{"n":22,"s":2,"a":2,"p":"22. 아래 워크시트와 같이 시상내역 표를 이용하여 시상내역 [A13:D16] 을 계산하였다다음 중 셀에 입력된 배열 수식으로 [D2:D10] . [D2] 옳은 것은? {=INDEX($B$15:$D$16, MATCH(B2, $A$15:$A$16, 0),","c":["MATCH(C2, $B$13:$D$13, -1))} {=INDEX($B$15:$D$16, MATCH(B2, $A$15:$A$16, 0),","MATCH(C2, $B$13:$D$13, 1))} {=INDEX($B$15:$D$16, MATCH(B2, $A$15:$A$16, 0),","MATCH(C2, $B$14:$D$14, -1))} {=INDEX($B$15:$D$16, MATCH(B2, $A$15:$A$16, 0),","MATCH(C2, $B$14:$D$14, 1))}"]},{"n":23,"s":2,"a":3,"p":"23. 다음과 같은 이벤트를 실행시켰을 때 나타나는 결과로 옳은 것은? Private Sub Range(“B2:C3”).Select Selection.Delete Shift:=xlToLeft End Sub 영역을 셀의 왼쪽에 복사한다 [B2:C3] .","c":["영역을 삭제한 후 왼쪽에 있는 셀을 오른쪽으로 이동 [B2:C3]","한다. 영역을 삭제한 후 오른쪽에 있는 셀을 왼쪽으로 이동 [B2:C3]","한다. 영역을 셀의 오른쪽에 복사한다 [B2:C3] .",""]},{"n":24,"s":2,"a":2,"p":"24. 다음 중 워크시트에 데이터를 입력하는 방법에 대한 설명으로 옳지 않은 것은? 날짜 데이터를 입력하면 기본적으로 셀의 오른쪽에 정렬된다.","c":["과 같이 입력하면 기본적으로 셀의 오른쪽에 정렬된다 ‘3 .","수식 또는 함수 식을 입력할 때는 기호를 붙여 입력한다 = .","여러 개의 셀에 동일한 데이터를 한번에 입력할 때 범위는","연속적으로 지정하지 않아도 된다."]},{"n":25,"s":2,"a":1,"p":"- 25. 다음 중 아래 설명에 해당하는 차트 종류는? ㆍ항목의 값을 점으로 표시하여 여러 데이터 값들의 관계 를 보여 주며 주로 과학 데이터의 차트 작성에 사용된다. ㆍ가로 축의 값이 일정한 간격이 아닌 경우나 데이터 요 소의 수가 많은 경우 사용된다. ㆍ기본적으로 개의 하위 차트 종류가 제공되며 차원 5 , 3 차트로 작성할 수 없다. 분산형 차트","c":["도넛형 차트","방사형 차트","혼합형 차트",""]},{"n":26,"s":2,"a":2,"p":"다음 그림과 같이 표기능을 사용하여 단가 26. “ ” ( 와 판매량 C7:E7) 에 따른 판매금액 을 (B8:B11) (C8:E11) 계산하려고 한다이때 실행 . 하여야 할 작업 내용에 대한 설명으로 옳지 않은 것은? ‘","c":["데이터 테이블대화상자가 표시되면 행 입력 셀은 ’ “ ” [B3] 셀과 열 입력 셀은 셀을 지정한 후 확인을 선택한다 , “ ” [B2] < > . 영역을 블록으로 설정한 후 데이터 예측 [C8:E11] [ ] [ ]","→ 가상 분석 데이터 표를 선택한다 [ ] [ ] . → → 수식이 입력되어야 하는 셀을 선택하고 수식 [B7] “=B2*B3”","을 입력한다. 자동으로 결과가 구해진 셀을 하나 선택해서 살펴보면","와 같은 배열 수식이 들어 있다 “{=TABLE(B3,B2)}” ."]},{"n":27,"s":2,"a":2,"p":"다음 중 아래 시트에서 고급 필터 기능을 이용하여 점수가 전체 27. 평균보다 크면서 성별이 남인 데이터를 추출하려고 할 때고급 “ ” , 필터의 조건식으로 옳은 것은?","c":["","","",""]},{"n":28,"s":2,"a":1,"p":"- 28. 다음 중 부분합에 대한 설명 중 옳지 않은 것은? 그룹화할 항목으로 선택된 필드는 자동으로 오름차순 정렬하","c":["여 부분합이 계산된다. 부분합에서는 합계평균개수 등의 함수 이외에도 다양한 , ,","함수를 선택할 수 있다. 부분합에서 데이터 아래에 요약을 표시할 수 있다.","부분합에서 그룹 사이에 페이지를 나눌 수 있다.",""]},{"n":29,"s":2,"a":3,"p":"다음 중 아래 시트에서 각 수식을 실행했을 때의 결과 값으로 29. 옳은 것은? =SUM(COUNTA(B2:D4), MAXA(B2:D4)) 102","c":["→ =AVERAGE(SMALL(C2:C4, 2), LARGE(C2:C4, 2)) 75","→ =SUM(LARGE(B3:D3, 2), SMALL(B3:D3, 2)) 174","→ =SUM(COUNTA(B2, D4), MINA(B2, D4)) 109","→"]},{"n":30,"s":2,"a":1,"p":"30. 다음 중 아래 조건을 처리하는 셀 서식의 사용자 지정 표시 형식으로 옳은 것은? 셀의 값이 이상이면 파랑 미만 이상이 1000 ‘ ’, 1000 500 면 빨강 미만이면 색을 지정하지 않고 각 조건에 ‘ ’, 500 , 대해 천단위 구분 기호 와 소수 이하 첫째 자리까지 표 (,) 시한다. 표시 예 [ : 1234.56 1,234.6, 432 432.0] → → 파랑 빨강 [ ][>=1000]#,##0.0;[ ][>=500]#,##0.0;#,##0.0","c":["파랑 빨강 [ ][>=1000]#,###.#;[ ][>=500]#,###.#;#,###.#","파랑 빨강 [>=1000]< >#,##0.0;[>=500]< >#,##0.0;#,##0.0","파랑 빨강 [>=1000]< >#,###.#;[>=500]< >#,###.#;#,###.#",""]},{"n":31,"s":2,"a":3,"p":"31. 다음 중 워크시트의 인쇄 영역 설정에 대한 설명으로 옳지 않은 것은? 인쇄 영역은 리본 메뉴의 페이지 레이아웃탭이나 페이지 [ ] [","c":["설정 대화상자의 시트 탭에서 설정할 수 있다 ] [ ] . 인쇄 영역을 설정했더라도 인쇄 시 활성 시트 전체가 인쇄되도","록 설정할 수 있다. 여러 시트에서 원하는 영역을 추가하여 인쇄 영역을 확대할","수 있다. 여러 영역이 인쇄 영역으로 설정된 경우 설정한 순서대로 각기","다른 페이지에 인쇄된다."]},{"n":32,"s":2,"a":2,"p":"32. 다음 중 시트 보호 기능에 대한 설명으로 옳지 않은 것은 [ ] ? 시트 보호 설정 시 암호를 설정할 수 있다.","c":["시트 보호를 실행하면 시트의 삽입삭제이동숨기기이름 , , , ,","바꾸기 등의 작업을 할 수 없다. 시트 보호 시 특정 셀의 내용만 수정 가능하도록 하려면 해당","셀의 셀 서식에서 잠금설정을 해제한다 [ ] ‘ ’ . 시트 보호를 설정하면 셀에 데이터를 입력하거나 수정하려고","했을 때 경고 메시지가 나타난다."]},{"n":33,"s":2,"a":4,"p":"33. 다음 중 차트에 대한 설명으로 옳은 것은? 워크시트에서 차트에 사용될 데이터를 범위로 지정한 후","c":["을 누르면 별도의 차트 시트에 기본 차트가 작성 [Ctrl]+[F1] 된다. 원형 차트에 축을 표시할 수 있다.","추세선은 기본적으로 선형추세선으로 표시되고사용자가 ‘ ’ ,","다른 추세선으로 변경할 수 없다. 트리맵히스토그램 차트는 차원 차트로 작성할 수 없다 , 3 .",""]},{"n":34,"s":2,"a":1,"p":"- 다음 중 시나리오에 대한 설명으로 옳지 않은 것은 34. ? 시나리오 관리자에서 시나리오를 삭제하면 시나리오 요약 보","c":["고서의 해당 시나리오도 자동으로 삭제된다. 특정 셀의 변경에 따라 연결된 결과 셀의 값이 자동으로 변경","되어 결과값을 예측할 수 있다.","",""]},{"n":35,"s":2,"a":4,"p":"35. 다음 중 매크로대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 편집단추를 클릭하면 선택한 매크로를 수정할 수 있도록 [ ]","c":["가 실행된다 VBA . 삭제 단추를 클릭하면 선택한 매크로를 삭제한다 [ ] .","한 단계씩 코드 실행단추를 클릭하면 선택한 매크로를 한 [ ]","줄씩 실행한다. 옵션단추를 클릭하면 선택한 매크로의 이름이나 바로 가기 [ ]","키설명 등을 설정하거나 변경할 수 있다 , ."]},{"n":36,"s":2,"a":2,"p":"36. 영역에 대해 조건부 서식의 수식 규칙을 다음과 같이 [A1:C3] 설정할 경우 결과 화면으로 옳은 것은? =MOD(ROW($A1), 2)=MOD(COLUMN(A$1), 2)","c":["","","",""]},{"n":37,"s":2,"a":3,"p":"37. 다음 중 이름 상자에 대한 설명으로 옳지 않은 것은? 을 누르고 여러 개의 셀을 선택한 경우 마지막 선택한 [Ctrl]","c":["셀 주소가 표시된다. 셀이나 셀 범위에 이름을 정의해 놓은 경우 이름이 표시된다.","차트가 선택되어 있는 경우 차트의 종류가 표시된다.","수식을 작성 중인 경우 최근 사용한 함수 목록이 표시된다.",""]},{"n":38,"s":2,"a":1,"p":"- 38. 다음 중 참조의 대상 범위로 사용하는 이름 정의 시 이름의 지정 방법에 대한 설명으로 옳지 않은 것은? 처럼 셀 주소와 같은 형태의 이름을 사용할 수 있다 ‘A1’ .","c":["","","",""]},{"n":39,"s":2,"a":2,"p":"39. 다음 중 워크시트 이름으로 적절하지 않은 것은? 매출실적 _","c":["매출실적?","매출실적 #","매출실적&",""]},{"n":40,"s":2,"a":3,"p":"40. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로 기록 도중에 선택한 셀은 절대 참조로 기록할 수도","c":["있고 상대 참조로 기록할 수도 있다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 매크로 실행의 바로 가기 키가 우선한다. 컨트롤의 명령 단추를 추가하면 매크로 지정대화 ActiveX ‘ ’ [ ]","상자가 자동으로 표시되어 실행할 매크로를 바로 지정할 수 있다. 에서 코드 편집을 통해 매크로의 이름이나 내용을 바꿀 VBA","수 있다. 제과목 3 데이터베이스일반"]},{"n":41,"s":3,"a":2,"p":"다음 중 테이블을 데이터시트 형태로 열었을 때 표시되는 테이블 41. [ 필드 탭에 대한 설명으로 가장 옳지 않은 것은 ] ? 이름 및 캡션 현재 커서가 있는 곳의 필드 이름을 변경할 :","c":["수 있다. 삭제 현재 커서  반복적으로 표시되는 영역은 어디 56. 인가? 본문 영역","c":["보고서 바닥글","보고서 머리글","페이지 바닥글",""]},{"n":57,"s":3,"a":1,"p":"다음 중 하나의 필드에 할당되는 크기바이트 수 기준가 가장 57. ( ) 작은 데이터 형식은? Yes/No","c":["날짜시간 /","통화","일련 번호",""]},{"n":58,"s":3,"a":2,"p":"다음 중 폼이나 보고서에서 조건에 맞는 특정 컨트롤에만 서식을 58. 적용하는 조건부 서식에 대한 설명으로 옳은 것은? 조건부 서식은 식이 아닌 필드 값으로만 설정이 가능 ⓐ 하다. 컨트롤 값이 변경되어 조건을 만족하지 않으면 적용 , ⓑ 된 서식이 해제된다. 조건은 개까지 지정할 수 있으며 조건별로 다른 50 , ⓒ 서식을 적용할 수 있다. 지정한 조건 중 개 이상이 참이면조건이 참인 서식 2 , ⓓ 이 모두 적용된다. ,","c":["ⓐⓑ ,","ⓑⓒ ,","ⓒⓓ ,","ⓐⓓ"]},{"n":59,"s":3,"a":4,"p":"다음 중 입력 마스크 설정에 사용하는 사용자 정의 입력 마스크 59. 기호에 대한 설명으로 옳은 것은? 소문자로 변환 9 :","c":["숫자나 공백을 입력받도록 설정 > :","영문 대문자로 변환하여 입력받도록 설정 < :","영문자와 한글만 입력받도록 설정 L :",""]},{"n":60,"s":3,"a":4,"p":"- 매크로 함수 중 함수로 변환할 수 있는 60. ExportWithFormatting 변환 형식에 속하지 않는 형식은 무엇인가? 형식 HTML","c":["형식 PDF","형식 TXT","형식 ASP",""]}]},{"id":"2025-상시-06","t":"2025 상시 06","q":[{"n":1,"s":1,"a":2,"p":"1. 다음 중 컴퓨터에서 사용하는 그래픽 파일의 형식에 관한 설명으로 옳지 않은 것은? 는 손실 압축 기법과 무손실 압축 기법을 사용하며사용 JPEG ,","c":["자가 임의로 압축률을 지정할 수 있다. 는 에서 기본적으로 지원하는 포맷으로 압축을 BMP Windows","사용하여 파일의 크기가 작다. 는 인터넷 표준 그래픽 형식으로무손실 압축 기법을 사용 GIF ,","하여 선명한 화질을 제공한다. 는 트루 컬러의 지원과 투명색 지정이 가능하다 PNG .",""]},{"n":2,"s":1,"a":1,"p":"2. 다음 중 네트워크의 구성 에서 망형 에 관한 설명 (Topology) (Mesh) 으로 옳지 않은 것은? 단말장치의 추가제거 및 기밀 보호가 어렵다 / .","c":["모든 지점의 컴퓨터와 단말장치를 서로 연결한 형태이다.","응답시간이 빠르고 노드의 연결성이 높다.","통","신 회선 장애 시 다른 경로를 통하여 데이터 전송이 가능하다."]},{"n":3,"s":1,"a":2,"p":"3. 다음 중 이미지와 그래픽에서 사용되는 비트맵 방식의 파일 형식에 관한 설명으로 옳지 않은 것은? 래스터 방식이라고도 하며 다양한 색상을 사용하므로 사실","c":["같은 이미지를 표현할 수 있다. 베지어스플라인 등의 곡선을 이용하여 이미지를 표현하므로 ,","확대축소 시 화질의 손상이 거의 없다 / . 이미지를 확대하면 테두리가 거칠게 표현된다.","비트맵 파일 형식으로는 등이 있다 BMP, GIF, JPEG .",""]},{"n":4,"s":1,"a":3,"p":"4. 다음 중 어떤 장치가 다른 장치의 일을 잠시 중단시키고 자신의 상태 변화를 알려주는 것을 뜻하는 용어로 옳은 것은? DMA","c":["채널","인터럽트","클라이언트서버 /",""]},{"n":5,"s":1,"a":2,"p":"- 5. 다음 중 의 메모장에 관한 설명으로 옳지 않은 것은 Windows 10 [ ] ? 텍스트 파일이나 웹 페이지를 편집하는 간단한 도구로 사용할","c":["수 있다. 이동명령으로 원하는 줄 번호를 입력하여 문서의 특정 줄로 [ ]","이동할 수 있으며자동 줄 바꿈이 설정된 경우에도 이동 명령 , 을 사용할 수 있다. 특정 문자나 단어를 찾아서 바꾸거나창 크기에 맞추어 텍스 ,","트 줄을 바꾸어 문서의 내용을 표시할 수 있다. 머리글과 바닥글을 설정하여 문서의 위쪽과 아래쪽 여백에","원하는 텍스트를 표시하여 인쇄할 수 있다."]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 한글 의 백업과 복원에 관한 설명으로 옳지 Windows 10 않은 것은? 파일이 백업되는 주기를 지정할 수 있다.","c":["파일 히스토리를 이용하여 자동으로 파일이 백업되도록 설정","할 수 있다. 백업된 파일을 복원할 때 복원 위치를 설정할 수 있다.","백업에서 제외할 폴더를 지정할 수 없다.",""]},{"n":7,"s":1,"a":3,"p":"7. 다음 중 한글 의 관리 도구에 대한 설명으로 Windows 10 Windows 옳지 않은 것은? 시스템 정보를 실행하면 하드웨어 리소스구성 요소설치 [ ] , ,","c":["된 소프트웨어 환경 등의 정보를 알 수 있다. 리소스 모니터는 네트워크디스크메모리 사용 현황 [ ] CPU, , ,","을 실시간으로 모니터링 할 수 있다. 드라이브에 대하여 드라이브 조각 모음 및 최적화를 DVD [ ]","수행하면 시스템의 성능을 향상시킬 수 있다. 디스크 정리를 사용하면 임시 파일이나 휴지통에 있는 파일 [ ]","등을 삭제하여 디스크의 공간을 확보할 수 있다."]},{"n":8,"s":1,"a":2,"p":"8. 다음 중 멀티미디어 그래픽과 관련하여 안티앨리어싱(Anti- 에 대한 설명으로 옳은 것은 Aliasing) ? 차원 그래픽에서 화면에 그린 물체의 모형에 명암과 색상을 3","c":["입혀 사실감을 더해주는 기술이다. 이미지의 가장자리가 톱니 모양으로 표현되는 계단 현상을","없애기 위하여 경계선을 부드럽게 해주는 필터링 기술이다. 선택된 두 개의 이미지에 대해 하나의 이미지가 다른 이미지로","자연스럽게 변화하도록 하는 특수 효과 기술이다. 작성된 그림을 필터 기능을 이용하여 여러 가지 형태의 새로운","이미지로 바꿔주는 기술이다."]},{"n":9,"s":1,"a":4,"p":"9. 다음 중 한글 에서 전자우편 사용에 관한 설명으 Windows (E-mail) 로 옳지 않은 것은? 전자우편 주소는 사용자 호스트 주소의 형식으로 이루 ‘ ID@ ’","c":["어진다. 전자우편에 사용하는 프로토콜은 등이 SMTP, POP3, MIME","있다. 전","자우편은 메일 서버에 사용자 계정이 있어야 사용할 수 있다. 전자우편은 기본적으로 진수 코드를 사용한다 16 EBCDIC .",""]},{"n":10,"s":1,"a":1,"p":"- 10. 다음 중 바탕 화면의 바로 가기 메뉴 개인 설정을 선택하여 [ ] 설정할 수 있는 작업에 대한 설명으로 옳지 않은 것은? 모니터의 해상도를 설정할 수 있다.","c":["화면 보호기를 설정할 수 있다.","바탕 화면의 배경색소리 등을 한 번에 변경할 수 있는 테마 , ,","를 선택할 수 있다. 바탕 화면의 배경 이미지를 변경할 수 있다.",""]},{"n":11,"s":1,"a":3,"p":"11. 다음 중 한글 의 휴지통에 관한 설명으로 옳지 않은 Windows 10 [ ] 것은? 휴지통의 파일이 실제 저장된 폴더 위치는 일반적으로","c":["이다 C:\\$Recycle.Bin . 휴지통 속성에서 파일이나 폴더가 삭제될 때마다 삭제 확인","대화상자가 표시되지 않도록 설정할 수 있다. 휴지통에 지정된 최대 크기를 초과하면 보관된 파일 중 가장","용량이 큰 파일부터 자동 삭제된다. 휴지통에 보관된 실행 파일은 복원은 가능하지만 휴지통에서","실행하거나 이름을 변경할 수는 없다."]},{"n":12,"s":1,"a":4,"p":"12. 다음 중 컴퓨터 통신에서 사용하는 프로토콜 기능에 관한 설명으로 옳지 않은 것은? 통신망에 전송되는 패킷의 흐름을 제어해서 시스템 전체의","c":["안전성을 유지한다. 정보를 전송하기 위해 송수신기 사이에 같은 상태를 유지하도 ·","록 동기화 기능을 수행한다. 데이터 전송 도중에 발생하는 오류를 검출한다.","네트워크에 접속된 다양한 단말장치를 자동으로 인식하여 호","환성을 제공한다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 의 설정 네트워크 및 인터넷에 대한 Windows 10 [ ] [ ] → 설명으로 옳지 않은 것은? 네트워크 문제를 진단하고 해결할 수 있다.","c":["컴퓨터 이름과 작업 그룹의 이름을 변경할 수 있다.","내 컴퓨터에서 사용 가능한 네트워크를 표시한다.","어댑터 옵션 변경을 통해 네트워크 어댑터의 연결 설정을 [ ]","변경할 수 있다."]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 바이러스 감염 증상에 대한 설명으로 옳지 않은 것은? 특정 날짜가 되면 화면에 이상한 메시지가 표시된다.","c":["디스크를 인식하지 못하거나디스크 볼륨명이 변경될 수도 ,","있다. 파일의 크기가 작아지고프로그램의 실행 속도가 빨라진다 , .","시스템 파일이 손상되어 부팅 이 정상적으로 수행되 (Booting)","지 않는다."]},{"n":15,"s":1,"a":3,"p":"15. 다음 중 컴퓨터의 연산장치에 있는 레지스터에 관한 설명으로 옳지 않은 것은? 누산기는 연산 결과를 일시적으로 저장한다.","c":["가산기는 진수 덧샘을 수행한다 2 .","보수기는 곱셈과 나눗셈을 위하여 데이터를 보수로 변환한다.","상태 레지스터는 연산중에 발생하는 여러 가지 상태값을 기억","한다."]},{"n":16,"s":1,"a":4,"p":"16. 다음 중 자기 디스크 관련 용어인 전송 시간 에 (Transmission Time) 대한 설명으로 옳은 것은? 읽","c":["기쓰기 헤드가 지정된 트랙에 도달하는 데 걸리는 시간이다 / . 읽기쓰기 헤드가 지정된 트랙을 찾은 후 원판이 회전하여 /","원하는 섹터의 읽기쓰기가 시작될 때까지의 시간이다 / . 데이터를 읽고 쓰는 데 걸리는 시간의 합이다.","읽은 데이터를 주기억장치로 보내는 데 걸리는 시간이다.",""]},{"n":17,"s":1,"a":3,"p":"- 17. 다음 중 와이파이 에 대한 설명으로 옳지 않은 것은 (Wi-Fi) ? 기술 규격의 브랜드명으로 의 IEEE 802.11 Wireless Fidelity","c":["약어이다. 무선 신호를 전달하는 를 중심으로 데이터 AP(Access Point)","를 주고 받는 인프라스트럭쳐 모드와 없 (Infrastructure) AP 이 데이터를 주고 받는 애드혹 모드가 있다 (Ad Hoc) . 유선 랜을 무선화한 것이기 때문에 사용 거리에 제한이 없고","",""]},{"n":18,"s":1,"a":1,"p":"18. 다음 중 인터넷 문서를 작성할 때 사용되는 언어 중에서 에 HTML 관한 설명으로 옳은 것은? 인터넷용 하이퍼텍스트 문서 제작에 사용된다.","c":["구조화된 문서를 제작하기 위한 언어로 태그의 사용자 정의가","가능하다. 서","버 측에서 동적으로 처리되는 페이지를 만들기 위한 언어이다. 웹 상에서 차원 가상공간을 표현하기 위한 언어이다 3 .",""]},{"n":19,"s":1,"a":1,"p":"19. 다음 중 사물 인터넷 에서 무선 광역 네트워크로 사용되며 (Iot) , 저전력저비용을 기반으로 소량의 데이터의 장거리 전송과 안정적 , 인 통신을 지원하는 것은? LWPA","c":["LTE","Wi-FI","USN",""]},{"n":20,"s":1,"a":1,"p":"20. 다음 중 캐시 메모리 에 관한 설명으로 옳은 것은 (Cache Memory) ? 중앙처리장치와 주기억장치 사이에 위치하여 컴퓨터의 처리","c":["속도를 향상시킨다. 캐시 메모리는 주로 을 사용한다 DRAM .","보조기억장치의 일부를 주기억장치처럼 사용한다.","주","기억장치보다 큰 프로그램을 불러와 실행해야 할 때 유용하다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"21. 다음 중 머리글바닥글기능에 대한 설명으로 옳지 않은 것은 [ / ] ? 머리글이나 바닥글의 텍스트에 앰퍼샌드 문자 한 개를 포 (&)","c":["함시키려면 앰퍼샌드 문자를 두 번 입력한다 (&) . 여러 워크시트에 동일한 머리글바닥글을 한 번에 추가하려 [ / ]","면 여러 워크시트를 선택하여 그룹화 한 후 설정한다. 페이지 나누기 미리 보기상태에서는 워크시트에 머리글과 [ ]","바닥글 영역이 함께 표시되어 간단히 머리글바닥글을 추가할 / 수 있다. 차트 시트인 경우 페이지 설정대화상자의 머리글바닥글 [ ] [ / ]","탭에서 머리글바닥글을 추가할 수 있다 / ."]},{"n":22,"s":2,"a":3,"p":"22. 다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은? 조건부 서식의 조건은 결과가 또는 가 TRUE(1) FALSE(0)","c":["나오도록 작성한다. 같은 통합 문서의 특정 셀을 이용하여 조건을 지정할 수 있다.","새로운 규칙을 수식으로 작성할 경우워크시트의 특정 셀을 ,","클릭하면 상대 참조로 작성된다. 이동 옵션을 이용하여 조건부 서식이 지정된 셀을 찾을 수","있다."]},{"n":23,"s":2,"a":2,"p":"- 23. 다음 중 엑셀의 정렬 기능에 대한 설명으로 옳지 않은 것은? 공백으로 시작하는 문자열은 오름차순 정렬일 때 숫자바로","c":["다음에 정렬되고내림차순 정렬일 때는 숫자 바로 앞에 정렬 , 된다. 사용자가 정렬 옵션대화상자에서 대소문자를 구분하도록 [ ] /","변경하여오름차순으로 정렬하면 대문자가 소문자보다 우선 , 순위를 갖는다. 오름차순 정렬과 내림차순 정렬 모두 빈 셀은 항상 마지막으로","정렬된다. 영숫자 텍스트는 왼쪽에서 오른쪽 방향으로 문자 단위로 정렬","된다."]},{"n":24,"s":2,"a":3,"p":"24. 다음 중 아래 워크시트의 셀에 보기의 사용자 지정 표시 [B2] < > 형식을 적용했을 때 표시되는 값은? 보기 < > [>=1000000]0.0,,“ ”;[>=1000]0.0,“ ”;0.0“ ” ㎘ ㎖ 354600","c":["㎖ 354","354.6","0.4","㎘"]},{"n":25,"s":2,"a":4,"p":"다음 그림과 같이 성과 이름을 합쳐서 성명으로 표시하고자 25. ‘ ’ ‘ ’ ‘ ’ 할 때 셀에 들어갈 알맞은 수식은 , [C2] ? =REPLACE(A2, B2)","c":["=TEXT(A2, B2)","=PROPER(A2, B2)","=CONCAT(A2, B2)",""]},{"n":26,"s":2,"a":4,"p":"다음 중 아래 워크시트에서 영역의 문자열을 셀에 26. [B1:B3] [B4] 목록으로 표시하여 입력하기 위한 키 조작으로 옳은 것은? [Tab]+[ ]","c":["↓ [Shift]+[ ]","↓ [Ctrl]+[ ]","↓ [Alt]+[ ]","↓"]},{"n":27,"s":2,"a":3,"p":"27. 통합 문서의 첫 번째 시트 뒤에 새로운 시트를 추가하는 프로시저를 작성하려고 한다다음 중 에 해당하는 인수로 옳은 것은 . ( ) ? Worksheets.Add ( ):=Sheets(1) Left","c":["Right","After","Before",""]},{"n":28,"s":2,"a":2,"p":"- 28. 다음 중 아래 워크시트에서 영역을 선택하여 작업한 [C2:C4] 결과가 다른 것은? 를 누른 경우 [Delete]","c":["를 누른 경우 [Backspace]","마우스 오른쪽 버튼의 바로 가기 메뉴에서 내용 지우기를 [ ]","선택한 경우 홈탭 편집그룹에서 지우기 내용 지우기를 선택한 [ ] [ ] [ ] [ ]","→ 경우"]},{"n":29,"s":2,"a":4,"p":"29. 다음 중 차원 참조에 대한 설명으로 옳지 않은 것은 3 ? 여러 워크시트에 있는 동일한 셀 데이터나 셀 범위 데이터에","c":["대한 참조를 뜻한다. 부터 까지의 셀을 모두 더하라는 식을 ‘Sheet2’ ‘Sheet4’ [A2]","와 같이 차원 참조로 표현할 수 ‘=SUM(Sheet2:Sheet4!A2)’ 3 있다. 등의 함수를 사용할 SUM, AVERAGE, COUNTA, STDEV","수 있다. 배열 수식에 차원 참조를 사용할 수 있다 3 .",""]},{"n":30,"s":2,"a":3,"p":"30. 텍스트 나누기를 할 때 사용하는 텍스트 마법사에서 각 필드의 ‘ ’ [ ] 너비열 구분선를 지정하는 단계에 대한 설명으로 옳지 않은 것은 ( ) ? 앞 단계에서 원본 데이터 형식을 구분 기호로 분리됨을 선택 ‘ ’","c":["한 경우 열 구분선을 지정할 수 없다. 구분선을 넣으려면 원하는 위치를 마우스로 클릭한다.","열 구분선을 옮기려면 구분선을 삭제한 후 다시 넣어야 한다.","구분선을 삭제하려면 구분선을 마우스로 두 번 클릭한다.",""]},{"n":31,"s":2,"a":4,"p":"31. 아래 워크시트에서 성취도 는 성취율 을 로 [C2:C6] [B2:B6] 10% 나눈 값만큼 표시한 것으로성취율이 를 초과하면 를 , 70% “ ” , ■ 그 외는 을 반복하여 표시하였다다음 중 이를 위한 수식으로 “ ” . □ 옳은 것은? =REPLACE(QUOTIENT(B2, 10%), IF(B2>70%,“ ”, “ ”","c":["■ □ )) =REPT(QUOTIENT(B2, 10%), IF(B2>70%, “ ”, “ ”))","■ □ =","REPLACE(IF(B2>70%, “ ”, “ ”), QUOTIENT(B2, 10%) ■ □ ) =REPT(IF(B2>70%, “ ”, “ ”), QUOTIENT(B2, 10%))","■ □"]},{"n":32,"s":2,"a":3,"p":"32. 다음 중 워크시트의 데이터 목록 개요 설정에 대한 설명으로 옳지 않은 것은? 그룹화하여 요약하려는 데이터 목록이 있는 경우 데이터에","c":["최대 개 수준의 개요를 설정할 수 있다 8 . 개요 기호가 표시되지 않는 경우 옵션에서 표시되도 [Excel ]","록 설정할 수 있다. 그룹별로 요약된 데이터에 설정된 개요를 제거하면 개요 기호","와 함께 요약 정보가 표시된 원본 데이터도 삭제된다. 부분합을 제거하면 부분합과 함께 목록에 삽입된 개요도 제거","된다."]},{"n":33,"s":2,"a":2,"p":"- 33. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단계에 포함되지 않는다. 개인용 매크로 통합 문서에 저장한 매크로는 엑셀을 시작할","때마다 자동으로 로드되므로 다른 통합 문서에서도 실행할 수 있다."]},{"n":34,"s":2,"a":3,"p":"다음 중 셀에 수식을 입력하는 방법에 대한 설명으로 옳지 않은 34. 것은?","c":["통합 문서의 여러 워크시트에 있는 동일한 셀 범위 데이터를 이용하려면 수식에서 차원 참조를 사용한다 3 .","계산할 셀 범위를 선택하여 수식을 입력한 후 [Ctrl]+ 를 누르면 선택한 영역에 수식을 한 번에 채울 수 있 [Enter] 다.","수식을 입력한 후 결과 값이 상수로 입력되게 하려면 수식을 입력한 후 바로 를 누른다 [Alt]+[F9] .","배열 상수에는 숫자나 텍스트 외에 등의 ‘TRUE’, ‘FALSE’ 논리값 또는 와 같은 오류 값도 포함될 수 있다 ‘#N/A’ ."]},{"n":35,"s":2,"a":3,"p":"35. 아래 워크시트에서 순위 는 총점을 기준으로 구하되 동점 [G2:G10] 자에 대해서는 국어를 기준으로 순위를 구하였다다음 중 . [G2] 셀에 입력된 수식으로 옳은 것은? {=RANK($F2, $F$2:$F$10)+RANK($B$2, $B$2:$B$10)}","c":["{=RANK($B$2, $B$2:$B$10)*RANK($F2, $F$2:$F$10)}","{=RANK($F2, $F$2:$F$10)+SUM(($F$2:$F$10=$F2)*","($B$2:$B$10>$B2))} {=SUM(($F$2:$F$10=$F2)*($B$2:$B$10>$B2))*RANK(","$F2, $F$2:$F$10)}"]},{"n":36,"s":2,"a":4,"p":"다음 중 아래의 워크시트에서 셀에 수식 을 36. [C1] ‘=A1+B1+C1’ 입력할 경우 발생하는 상황으로 옳은 것은? 셀에 오류 표시 [C1] ‘#REF!’","c":["셀에 오류 표시 [C1] ‘#NUM!’","데이터 유효성 오류 메시지 창 표시","순환 참조 경고 메시지 창 표시",""]},{"n":37,"s":2,"a":3,"p":"37. 다음 중 공유된 통합 문서에 대한 설명으로 옳지 않은 것은? 공유 통합 문서를 여러 사용자가 동시에 편집할 수 있도록","c":["설정할 수 있다. 공유된 통합 문서에서는 조건부 서식을 추가하거나 변경할","수 없다. 사용자별로 공유된 통합 문서를 열기 위한 암호를 다르게 설정","할 수 있다. 필요시 공유 통합 문서에서 특정 사용자의 연결을 끊을 수","있다."]},{"n":38,"s":2,"a":2,"p":"- 38. 다음 중 윗주에 대한 설명으로 옳지 않은 것은? 윗주는 셀에 대한 주석을 설정하는 것이다.","c":["데이터를 삭제해도 윗주는 그대로 표시되어 있다.","문자열 데이터가 입력되어 있는 셀에만 윗주를 표시할 수 있","다. 윗주의 서식을 변경할 수 있다.",""]},{"n":39,"s":2,"a":3,"p":"39. 다음 중 시트 보호에 대한 설명으로 옳지 않은 것은? 시트 보호 설정 시 암호를 설정할 수 있다.","c":["시트 보호는 통합 문서 전체가 아닌 특정 시트만을 보호한다.","시트 보호를 실행하면 시트의 삽입삭제이동숨기기이름 , , , ,","바꾸기 등의 작업을 할 수 없다. 시트 보호를 설정하면 셀에 데이터를 입력하거나 수정하려고","했을 때 경고 메시지가 나타난다."]},{"n":40,"s":2,"a":2,"p":"40. 다음 중 묶은 세로 막대형 차트에 대한 설명으로 옳은 것은? 축의 제목은 수정할 수 있지만 삭제할 수 없다.","c":["계열 겹치기는 계열 간의 간격을 지정한다.","차트의 원본 데이터의 셀 값이 빈셀이면 데이터 레이블로 기본","값인 이 표시된다 0 . 보조 축을 지정하면 차트의 왼쪽에 표시된다.","제과목 3 데이터베이스일반"]},{"n":41,"s":3,"a":3,"p":"릴레이션의 특성에 대한 설명으로 잘못된 것은 41. ? 한 릴레이션에 포함된 튜플들은 모두 상이하다.","c":["한 릴레이션에 포함된 튜플 사이에는 순서가 없다.","한 릴레이션을 구성하는 애트리뷰트 사이에는 일정한 순서가","있는데이 순서는 아주 중요하다 , . 모든 애트리뷰트 값은 원자값이다.",""]},{"n":42,"s":3,"a":1,"p":"다음 중 정규화 에 대한 설명으로 옳은 것은 42. (Normalization) ? 중복되는 값을 일정한 규칙에 의해 추출하여 보다 단순한 형","c":["태를 가지는 다수의 테이블로 데이터를 분리하는 작업을 정 규화라고 한다. 정규화는 데이터 공간의 낭비를 방지하기 위한 것으로정규 ,","화를 수행하면 불필요한 필드의 제거로 인해 데이터 공간의 낭비를 방지하여 검색 효율성을 높일 수 있다. 제 정규형이 지켜진 데이터베이스는 제 정규형과 제 정규 1 2 3","형도 만족하며대부분의 응용 프로그램에서 필요한 가장 높 , 은 수준으로 간주된다. 데이터 중복을 최소화하기 위해 데이터베이스의 물리적 설계","단계에서 수행한다."]},{"n":43,"s":3,"a":4,"p":"다음 중 필드의 각 데이터 형식에 대한 설명으로 옳지 않은 것은 43. ? 통화 형식은 소수점 이하 자리까지의 숫자를 저장할 수 있으 4","c":["며기본 필드 크기는 바이트이다 , 8 . 형식은 등과 같이 두 Yes/No Yes/No, True/False, On/Off","값 중 하나만 입력하는 경우에 사용하는 것으로 기본 필드 크기는 비트이다 1 . 일련 번호 형식은 새 레코드를 만들 때 부터 시작하는 정수가 1","자동 입력된다. 긴 텍스트 형식은 텍스트 및  보기속성에는 단일 폼연속 폼의 두 가지가 있다 ‘ ’ , .",""]},{"n":53,"s":3,"a":3,"p":"컨트롤의 종류 중 레이블에 대한 설명으로 옳은 것은 53. ? 테이블의 필드 값을 표시하거나 저장할 때 사용한다.","c":["여러 개의 값 중 하나를 선택할 수 있도록 지정하는 것에서","사용한다. 주로 폼이나 보고서의 제목과 같이 간단한 문자열을 나타낼","때 사용한다. 레코드를 찾거나 레코드 인쇄 등의 특정 기능을 연결하여 실","행할 때 사용한다."]},{"n":54,"s":3,"a":2,"p":"다음 중 폼에서의 컨트롤 작업에 대한 설명으로 가장 옳지 않은 54. 것은? 폼의 컨트롤을 특정 필드에 바운드시키려면 컨트롤 원본 속성","c":["을 이용한다. 목록 상자나 콤보 상자는 특정 필드에 바운드시킬 수 없다.","필드 목록창에서 특정 필드 이름을 끌어와 폼에 드롭시키면 ‘ ’","컨트롤을 생성하고 자동적으로 해당 필드에 바운드된다. 컨트롤에 표시된 값을 수정하면 바운드된 필드의 값도 변경된","다."]},{"n":55,"s":3,"a":3,"p":"다음은 폼에 요약 정보를 표시하는 방법을 나타낸 것이다잘못된 55. . 설명은? 리본 메뉴를 이용하여 날짜 및 시간페이지 번호를 표시할 ,","c":["수 있다. 함수를 컨트롤에 직접 입력하여 날짜를 표시할 수 있다.","함수나 식을 컨트롤에 직접 입력하거나 데이터속성에 입력 ‘ ’","하면 된다. 작성기를 사용하여 함수나 페이지 번호를 쉽게 지정할 수 있","다."]},{"n":56,"s":3,"a":3,"p":"다음 중 폼 보기 형식을 지정하는 기본 보기 속성에 대한 설명으로 56. 틀린 것은? 기본 보기 속성에는 단일 폼연속 폼데이터시트분할 표시 , , ,","c":["폼이 있다. 단일 폼은 레코드를 한 번에 하나만 표시한다.","연속 폼은 매 레코드마다 폼 머리글과 폼 바닥글이 표시된다.","데이터시트 형식은 스프레드시트처럼 행과 열로 정렬된 폼","필드를 표시한다."]},{"n":57,"s":3,"a":4,"p":"- 다음 중 보고서의 그룹화에 대한 설명으로 틀린 것은 57. ? 그룹화란 특정한 필드의 값을 기준으로 데이터를 구분하여","c":["표시하는 기능이다. 그룹 머리글과 그룹 바닥글을 이용하여 그룹별 요약 정보를","표시할 수 있다. 그룹을 만들려면 머리글 구역이나 바닥글 구역 중 하나 이상","을 설정해야 한다. 보고서에서는 필드나 식을 기준으로 개까지 그룹화할 수 5","있다."]},{"n":58,"s":3,"a":1,"p":"다음의 페이지 번호대화상자에 대한 설명으로 틀린 것은 58. ‘ ’ ? 보고서 디자인 테마 페이지 번호를 클릭하면 [ ] [ ] [ ]","c":["→ → 표시된다. 페이지는 현재 페이지 번호전체 페이지 수형식으로 N/M ‘ / ’","표시한다. 첫 페이지에 페이지 번호 표시옵션은 첫 페이지에 페이지 ‘ ’","번호 표시 여부를 설정한다. 페이지의 아래쪽바닥글 옵션은 페이지 바닥글에 페이지 ‘ [ ]’","번호를 표시한다."]},{"n":59,"s":3,"a":4,"p":"다음 중 이름이 제목인 텍스트 상자 컨트롤에 매출내역이라는 59. ‘txt ’ ‘ ’ 내용을 입력하는 명령으로 옳지 않은 것은 VBA ? 제목 매출내역 txt = “ ”","c":["제목 매출내역 txt .text = “ ”","제목 매출내역 txt .value = “ ”","제목 매출내역 txt .caption = “ ”",""]},{"n":60,"s":3,"a":4,"p":"- 다음 중 텍스트 상자의 내용이 변경될 때 발생하는 이벤트는 무엇인 60. 가? After Update","c":["Before Update","Click","Change",""]}]},{"id":"2026-상시-01","t":"2026 상시 01","q":[{"n":1,"s":1,"a":3,"p":"1. 다음 중 정보보안을 위해 사용하는 공개키 암호화 기법에 대한 설명으로 옳지 않은 것은? 알고리즘이 복잡하며 암호화와 복호화 속도가 느리다.","c":["키의 분배가 용이하고 관리해야 할 키의 수가 적다.","비대칭 암호화 기법이라고도 하며 대표적으로 가 있다 DES .","데이터를 암호화할 때 사용하는 키를 공개하고 복호화 할 때","키는 비밀로 한다."]},{"n":2,"s":1,"a":3,"p":"2. 다음 중 에 관한 설명으로 옳지 BIOS(Basic Input Output System) 않은 것은? 컴퓨터의 기본 입출력장치나 메모리 등 하드웨어 작동에 필요","c":["한 명령들을 모아 놓은 프로그램이다. 컴퓨터의 전원을 켜면 자동으로 가장 먼저 기동되며기본 입 ,","출력장치나 메모리 등 하드웨어의 이상 유무를 검사한다. 최근에는 보조기억장치인 에 저장되므로 칩을 교환하지 SSD","않고도 바이오스를 업그레이드 할 수 있다. 셋업 프로그램을 이용하여 시스템의 날짜와 시간부팅 CMOS ,","순서 등 일부 정보를 설정할 수 있다 BIOS ."]},{"n":3,"s":1,"a":4,"p":"3. 다음 중 네트워크 관련 장비로 브리지 에 관한 설명으로 (Bridge) 옳지 않은 것은? 통신 프로토콜을 변환하지 않고도 네트워크를 확장한다.","c":["두 개의 근거리 통신망을 상호 접속할 수 있도록 하는 통신망","연결 장치이다. 통신량을 조절하여 데이터가 다른 곳으로 가지 않도록 한다.","참조 모델의 물리 계층에 속한다 OSI .",""]},{"n":4,"s":1,"a":1,"p":"4. 다음 중 의 바로 가기 키에 대한 설명으로 옳지 않은 Windows 10 것은? 는 시작을 클릭한 것처럼 시작 메뉴를 표시한 [Alt]+[Esc] ‘ ’","c":["다. 은 선택한 항목의 바로 가기 메뉴를 표시한다 [Shift]+[F10] .","바로 가기 아이콘의 속성창에서 바로 가기 키를 지정할 수 ‘ ’","있다. 는 선택한 항목의 속성 대화상자를 호출한다 [Alt]+[Enter] .",""]},{"n":5,"s":1,"a":3,"p":"- 5. 다음 중 파일 탐색기의 즐겨찾기에 대한 설명으로 옳지 않은 ‘ ’ ‘ ’ 것은? 자","c":["주 사용하는 폴더나 최근에 사용한 파일이 자동으로 등록된다. 즐겨찾기에 개체를 추가하려면 추가할 개체를 파일 탐색기 ‘ ’ ‘ ’","의 즐겨찾기에 드래그하면 된다 ‘ ’ .","",""]},{"n":6,"s":1,"a":3,"p":"6. 다음 중 반도체를 이용한 컴퓨터 보조기억장치로 크기가 작고 충격에 강하며소음 발생이 없는 대용량 저장장치는 , ? HDD(Hard Disk Drive)","c":["DVD(Digital Versatile Disk)","SSD(Solid State Drive)","CD-RW(Compact Disc Rewritable)",""]},{"n":7,"s":1,"a":2,"p":"7. 다음 중 컴퓨터에서 사용하는 코드에 관한 설명으로 옳지 ASCII 않은 것은? 데이터 처리 및 통신 시스템 상호 간의 정보 교환을 위해 사용","c":["된다. 각 나라별 언어를 표현할 수 있다.","각","문자를 비트로 표현하며총 개의 문자 표현이 가능하다 7 , 128 . 확장 코드는 비트를 사용한다 ASCII 8 .",""]},{"n":8,"s":1,"a":1,"p":"8. 다음 중 컴퓨터 운영체제의 성능 평가 기준에 해당하지 않는 것은? 중앙처리장치의 사용 정도를 측정하는 사용 가능도","c":["(Availability) 주어진 문제를 정확하게 해결하는 정도를 의미하는 신뢰도","(Reliability) 일정 시간 내에 시스템이 처리하는 양을 의미하는 처리 능력","(Throughput) 작업을 의뢰한 시간부터 처리가 완료된 시간까지의 반환 시간","(Turn Around Time)"]},{"n":9,"s":1,"a":2,"p":"9. 다음 중 객체지향 프로그래밍 특징으로 옳은 것은? 객체에 대하여 절차적 프로그래밍의 장점을 사용할 수 있다.","c":["객체지향 프로그램은 코드의 재사용과 유지보수가 용이하다.","객체지향 프로그램은 주로 인터프리터 번역 방식을 사용한다.","프로그램의 구조와 절차에 중점을 두고 작업을 진행한다.",""]},{"n":10,"s":1,"a":3,"p":"10. 다음 중 멀티미디어 그래픽과 관련하여 렌더링 기법에 (Rendering) 대한 설명으로 옳은 것은? 제한된 색상을 조합하여 새로운 색을 만드는 기술이다.","c":["개의 이미지를 부드럽게 연결하여 변환하는 기술이다 2 .","차원 그래픽에서 화면에 그린 물체의 모형에 명암과 색상을 3","입혀 사실감을 더해주는 기술이다. 그림의 경계선을 부드럽게 처리해주는 필터링 기술이다.",""]},{"n":11,"s":1,"a":1,"p":"- 11. 다음 중 컴퓨터의 정상적인 작동을 방해하여 운영체제나 저장된 데이터에 손상을 입힐 수 있는 보안 위협의 종류는? 바이러스(Virus)","c":["키로거(Key Logger)","","",""]},{"n":12,"s":1,"a":2,"p":"12. 다음 중 텔레매틱스 에 대한 설명으로 옳지 않은 것은 (Telematics) ? 자동차에 정보 통신 기술과 정보 처리 기술을 융합한 무선","c":["인터넷 서비스이다. 통신 기술과 컴퓨터에 저장된 데이터베이스를 이용하여 GPS,","주변의 위치와 부가 서비스를 제공하는 기술이다. 이미지음성영상 등의 디지털 정보를 유무선 네트워크에 , ,","연결시켜 다양한 멀티미디어 서비스를 제공한다. 통신 과 정보과학 의 합성 (Telecommunication) (Informatics)","어이다."]},{"n":13,"s":1,"a":4,"p":"13. 다음 중 프로그래밍 기법에 대한 설명으로 옳지 않은 것은? 구조적 프로그래밍 입력과 출력이 각각 하나씩 이루어진 :","c":["구조로순서선택반복의 가지 논리 구조를 사용하는 기법 , , , 3 이다. 절차적 프로그래밍 지정된 문법 규칙에 따라 일련의 처리 :","절차를 순서대로 기술해 나가는 프로그래밍 기법이다. 객체 지향 프로그래밍 객체를 중심으로 한 프로그래밍 기법 :","으로소프트웨어의 재사용과 유지보수가 용이하다 , . 비주얼 프로그래밍 기호화된 아이콘 형태를 문자 방식의 :","명령어로 바꿔 프로그래밍 하는 기법이다."]},{"n":14,"s":1,"a":4,"p":"14. 다음 중 관리에 대한 설명으로 옳지 않은 것은 PC ? 컴퓨터의 성능 향상을 위해 주기적으로 디스크 정리드라이브 ,","c":["오류 검사드라이브 최적화 등을 실행하는 것이 좋다 , . 직사광선과 습기가 많거나 자성이 강한 물체가 있는 곳은 피하","는 것이 좋다. 컴퓨터 전용 전원 장치를 단독으로 사용하고전원을 끌때는 ,","사용 중인 프로그램을 먼저 종료하는 것이 좋다. 바이러스를 예방하기 위하여 업데이트를 자주 실행한 BIOS","다."]},{"n":15,"s":1,"a":1,"p":"15. 다음 중 인터넷 주소 체계에서 에 관한 설명으로 옳지 않은 IPv6 것은? 각 부분은 진수로 표현되며세미콜론 으로 구분한다 10 , (;) .","c":["주","소 체계는 유니캐스트멀티캐스트애니캐스트로 나누어진다 , , . 실시간 흐름 제어로 향상된 멀티미디어 기능을 지원한다.","비트씩 부분으로 총 비트로 구성된다 16 8 128 .",""]},{"n":16,"s":1,"a":3,"p":"16. 다음 중 아날로그 컴퓨터와 비교하여 디지털 컴퓨터에 대한 설명으 로 옳지 않은 것은? 이산적인 데이터를 처리한다.","c":["논리 회로를 사용한다.","연산 속도가 빠르다.","문자와 숫자를 사용하여 처리한다.",""]},{"n":17,"s":1,"a":1,"p":"- 17. 다음 중 한글 에서 작업 관리자대화상자의 각 탭에서 Windows 10 [ ] 할 수 있는 작업으로 옳지 않은 것은? 프로세스탭은 메모리디스크네트워크 의 자 [ ] CPU, , , , GPU","c":["원 사용 현황을 확인할 수 있다. 서비스탭은 시스템의 서비스 항목을 확인하고 실행 여부를 [ ]","지정할 수 있다. 사용자탭은 둘 이상의 사용자가 컴퓨터에 연결되어 있는 [ ]","경우 연결된 사용자 및 작업 상황을 확인하고 특정 사용자를 강제로 종료시킬 수 있다. 시작프로그램탭은 가 시작될 때 자동으로 실행되 [ ] Windows","는 앱의 사용 여부를 지정할 수 있다."]},{"n":18,"s":1,"a":4,"p":"18. 다음 중 파일의 바로 가기 메뉴 연결 프로그램에 대한 설명으로 [ ] 옳지 않은 것은? 문서나 그림 같은 데이터 파일을 더블클릭할 때 자동으로 실행","c":["되는 앱을 의미한다. 파일의 바로 가기 메뉴에서 연결 프로그램을 선택하면 연결 [ ]","프로그램을 변경할 수 있다. 연결 프로그램이 지정되지 않았을 경우 데이터 파일을 더블클","릭하면 연결 프로그램을 선택하기 위한 대화상자가 표시된다. 연결 프로그램대화상자에서 연결 프로그램을 삭제하면 연 [ ]","결된 데이터 파일도 함께 삭제된다."]},{"n":19,"s":1,"a":3,"p":"19. 다음 중 한글 의 인쇄 작업에 대한 설명으로 옳지 Windows 10 않은 것은? 여러 개의 출력 파일들의 출력대기 상태를 확인할 수 있다.","c":["여러 개의 출력 파일들이 출력대기 할 때 출력 순서를 임의로","조정할 수 있다. 일단 프린터에서 인쇄 작업에 들어간 것은 프린터 전원을 끄기","전에는 강제로 종료시킬 수 없다. 인쇄 중인 문서나 오류가 발생한 문서는 다른 프린터로 전송할","수 없다."]},{"n":20,"s":1,"a":4,"p":"20. 다음 중 채널 에 대한 설명으로 옳은 것은 (Channel) ? 저속의 출력장치를 고속의 중앙처리장치 와 병행 처리 (CPU)","c":["할 때 컴퓨터 전체의 처리 효율을 높이기 위해 사용하는 기능 이다. 프로그램을 실행하는 도중에 예기치 않은 상황이 발생할 경우","현재 실행중인 작업을 일시 중단하고발생된 상황을 우선 처 , 리한 후 실행중이던 작업으로 복귀하여 계속 처리하는 것이다. 둘 이상의 프로세스들이 자원을 점유한 상태에서 서로 다른","프로세스가 점유하고 있는 자원을 요구하며 무한정 기다리는 현상이다. 고속의 데이터 전송을 위하여 입출력만을 목적으로 만든 처리","기로 라고도 불린다 , IOP(Input Output Processor) . 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":1,"p":"21. 다음 중 차트에서 사용하는 축에 대한 설명으로 옳지 않은 것은? 방사형 차트와 거품형 차트에서는 기본 가로 축만 표시된다.","c":["가로항목축에서 축 위치옵션은 데이터 표시와 레이블이 ( ) [ ]","축에 표시되는 방식에 영향을 주며 차원 영역형 차트세로 2 , 막대형 차트 및 꺾은선형 차트에 사용할 수 있다. 가로항목축이 날짜 값인 경우 축 종류에서 날짜축을 ( ) [ ] ‘ ’","선택하여 단위를 일 월 년중 선택하여 지정할 수 있다 [ ] ‘ ’, ‘ ’, ‘ ’ . 차원 꺾은선형 차트는 세 개의 축가로세로깊이 축에 3 ( , , )","따라 데이터 요소를 비교한다."]},{"n":22,"s":2,"a":2,"p":"- 22. 다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 용지 방향용지 크기인쇄 품질을 설정할 수 있다 , , .","c":["머리글바닥글탭의 머리글영역에서 행열 머리글의 인쇄 ‘ / ’ ‘ ’ /","여부를 설정한다. 여백은 사용자가 직접 값을 입력할 수 있다.","워크시트에서 차트를 마우스로 선택한 후 페이지 설정메뉴 [ ]","를 선택하면 시트탭이 차트탭으로 바뀐다 , ‘ ’ ‘ ’ ."]},{"n":23,"s":2,"a":4,"p":"다음 중 에서 프로시저 추가대화상자의 각 옵션에 대한 23. VBA [ ] 설명으로 옳지 않은 것은? 와 을 선택한 경우 프로시저는 모듈 내의 모든 Sub Public Sub","c":["프로시저에서 해당 프로시저를 호출할 수 있다 Sub . 와 를 선택한 경우 프로시저는 선언된 모듈 Sub Private Sub","내의 다른 프로시저에서만 호출할 수 있다. 과 을 선택한 경우 프로시저는 모든 Function Public Function","모듈의 모든 프로시저에 액세스할 수 있다. 과 를 선택한 경우 프로시저는 모 Function Private Function","든 모듈의 다른 프로시저에서만 액세스할 수 있다."]},{"n":24,"s":2,"a":1,"p":"아래 시트에서 영역에 입력된 내용을 조건으로 고급 24. [A13:B15] 필터를 실행했을 때의 결과로 추출되는 데이터가 아닌 것은? 상품명이 컴퓨터이고 금액이 인 데이터 60,000","c":["상품명이 오디오이고 금액이 인 데이터 56,000","상품명이 비디오이고 금액이 인 데이터 30,000","상품명이 컴퓨터이고 금액이 인 데이터 30,000",""]},{"n":25,"s":2,"a":1,"p":"25. 다음 중 참조의 대상 범위로 사용하는 이름 정의 시 이름의 지정 방법에 대한 설명으로 옳지 않은 것은? 처럼 셀 주소와 같은 형태의 이름을 사용할 수 있다 ‘A1’ .","c":["이름의 첫 글자는 문자나 밑줄 만 쓸 수 있고나머지 글자 ( _ ) ,","는 문자숫자밑줄 마침표 를 사용할 수 있다 , , ( _ ), ( .) . 같은 통합 문서에서 동일한 이름을 중복하여 사용할 수 없다.","이름 상자의 화살표 단추를 누르고 정의된 이름 중 하나를","클릭하면 해당 셀 또는 셀 범위가 선택된다."]},{"n":26,"s":2,"a":2,"p":"- 26. 다음 중 윗주에 대한 설명으로 옳지 않은 것은? 윗주는 셀에 대한 주석을 설정하는 것이다.","c":["데이터를 삭제해도 윗주는 그대로 표시되어 있다.","문","자열 데이터가 입력되어 있는 셀에만 윗주를 표시할 수 있다. 윗주의 서식을 변경할 수 있다.",""]},{"n":27,"s":2,"a":4,"p":"아래 워크시트에서 매출액 을 이용하여 매출 구간별 빈도수 27. [B3:B9] 를 영역에 계산한 후 그 값만큼 를 반복하여 표시하고 [F3:F6] “ ” ★ 고자 한다다음 중 이를 위한 수식으로 옳은 것은 . ? =REPT(“ ”, FREQUENCY(E3:E6,B3:B9))","c":["★ =REPT(“ ”, FREQUENCY(B3:B9,E3:E6))","★ {=REPT(“ ”, FREQUENCY(E3:E6,B3:B9))}","★ {=REPT(“ ”, FREQUENCY(B3:B9,E3:E6))}","★"]},{"n":28,"s":2,"a":3,"p":"28. 다음 중 셀에 수식을 입력하는 방법에 대한 설명으로 옳지 않은 것은? 배열 상수에는 숫자나 텍스트 외에 등의 ‘TRUE’, ‘FALSE’","c":["논리값 또는 와 같은 오류 값도 포함될 수 있다 ‘#N/A’ . 계산할 셀 범위를 선택하여 수식을 입력한 후 [Ctrl]+[Enter]","를 누르면 선택한 영역에 수식을 한 번에 채울 수 있다. 수식을 입력한 후 결과값이 수식이 아닌 상수로 입력되게 하려","면 수식을 입력한 후 바로 를 누른다 [Alt]+[F9] . 수식에서 통합 문서의 여러 워크시트에 있는 동일한 셀 범위","데이터를 이용하려면 차원 참조를 사용한다 3 ."]},{"n":29,"s":2,"a":3,"p":"29. 다음 중 보기탭의 페이지 나누기 미리보기에 대한 설명으로 [ ] [ ] 옳지 않은 것은? 페이지 나누기는 구분선을 이용하여 인쇄를 위한 페이지 나누","c":["기를 빠르게 조정하는 기능이다. 행 높이와 열 너비를 변경하면 자동 페이지 나누기의 위치도","변경된다. 페이지 나누기 미리보기에서 수동으로 삽입된 페이지 나누 [ ]","기는 파선으로 표시되고 자동으로 추가된 페이지 나누기는 실선으로 표시된다. 용지 크기여백 설정배율 옵션 등에 따라 자동 페이지 나누기 , ,","가 삽입된다."]},{"n":30,"s":2,"a":3,"p":"30. 워크시트에서 영역을 블록 설정하고 [A1:D2] , ‘={1, 2, 3, 4; 6, 를 입력한 후 를 눌렀다다음 중 7, 8, 9}’ [Ctrl]+[Shift]+[Enter] . 셀에 입력되는 값은 [B2] ? 0","c":["4","7","없다.",""]},{"n":31,"s":2,"a":2,"p":"- 31. 다음 중 엑셀의 화면 제어에 관한 설명으로 옳지 않은 것은? 숨겨진 통합 문서를 표시 옳지 않은 것은 3D ? 입력한 도면을 바탕으로 차원 입체 물품을 만들어 내는 프린 3","c":["터이다. 인쇄 원리는 잉크젯 프린터의 인쇄 원리와 같다.","출력 단위로는 등이 사용된다 IPM, PPM .","기계건축예술의료 분야 등에서 활용되고 있다 , , , .",""]},{"n":3,"s":1,"a":2,"p":"3. 다음 중 에서 사용하는 에 대한 Windows USB(Universal Serial Bus) 설명으로 옳은 것은? 는 범용 병렬 장치를 연결할 수 있게 해 주는 컴퓨터 인터 USB","c":["페이스이다. 은 이론적으로 최대 의 전송속도를 가지며 USB 3.0 5Gbps ,","및 연결기기케이블 등의 모든 단자는 파랑색으 PC , USB 3.0 로 되어 있어 이전 버전과 구분이 된다. 허브를 이용하여 하나의 포트에 여러 개의 주변기기를 USB","연결할 수 있으며최대 개까지 연결할 수 있다 , 256 . 핫 플러그인 기능은 지원하지 않으나 플러그 (Hot Plug In)","앤 플레이 기능은 지원한다 (Plug & Play) ."]},{"n":4,"s":1,"a":3,"p":"4. 다음 중 컴퓨터의 내부 기억장치에 관한 설명으로 옳은 것은? 주","c":["기억장치의 접근 속도 개선을 위하여 가상 메모리가 사용된다. 이 보다 접근 속도가 느리다 SRAM DRAM .","R","에는 기본 글꼴 시스템 등이 저장되어 있다 OM BIOS, , POST . R","은 일시적으로 전원 공급이 없더라도 내용은 계속 기억된다 AM ."]},{"n":5,"s":1,"a":2,"p":"- 5. 다음 중 인트라넷 에 대한 설명으로 옳은 것은 (Intranet) ? 여","c":["러 대의 컴퓨터를 연결하여 하나의 서버로 사용하는 기술이다. 인터넷 기술을 이용하여 조직 내의 각종 업무를 수행할 수","있도록 만든 네트워크 환경이다. 이동 전화 단말기에서 개인용 컴퓨터의 운영체제와 같은 역할","을 하는 소프트웨어이다.",""]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 컴퓨터 범죄 예방과 대책에 관한 설명으로 옳지 않은 것은? 회원 가입한 사이트의 패스워드를 주기적으로 변경한다.","c":["컴퓨터 바이러스 예방 및 치료에 대한 프로그램을 지속적으로","개발한다. 정보 누출이나 해킹 방지를 위해 방화벽 체제를 정비한다.","정크 메일로 의심이 가는 이메일은 본문을 확인한 후 즉시","삭제한다."]},{"n":7,"s":1,"a":4,"p":"7. 다음 중 컴퓨터의 하드디스크와 관련하여 RAID(Redundant Array 기술에 관한 설명으로 옳지 않은 것은 of Inexpensive Disks) ? 여러 개의 하드디스크를 모아서 하나의 하드디스크처럼 사용","c":["할 수 있도록 하는 기술이다. 하드디스크의 모음뿐만 아니라 자동으로 복제해 백업 정책을","구현해 주는 기술이다. 미러링과 스트라이핑 기술을 결합하여 안정성과 속도를 향상","시킨 디스크 연결 기술이다. 하드디스크 스캐너 등을 통합적으로 연결해 주는 , CD-ROM,","기술이다."]},{"n":8,"s":1,"a":1,"p":"8. 다음 중 드라이브 조각 모음 및 최적화를 수행할 수 있는 대상으로 [ ] 옳은 것은? 외장 하드디스크 드라이브","c":["네트워크 드라이브","드라이브 CD-ROM","가 지원하지 않는 형식의 압축 프로그램 Windows",""]},{"n":9,"s":1,"a":4,"p":"9. 다음 중 컴퓨터에서 사용하는 코드에 대한 설명으로 EBCDIC 옳지 않은 것은? 비트의 존 부분과 비트의 디지트 부분으로 구성된다 4 4 .","c":["특수 문자 및 소문자 표현이 가능하다.","확장 이진화 진 코드로 코드를 확장한 것이다 10 BCD .","최대 개의 문자 표현이 가능하다 64 .",""]},{"n":10,"s":1,"a":4,"p":"10. 다음 중 중앙처리장치와 입출력장치 사이의 속도 차이로 인한 · 문제를 해결하기 위한 장치는? 범용 레지스터","c":["터미널","콘솔","채널",""]},{"n":11,"s":1,"a":2,"p":"- 11. 컴퓨터는 처리 방식에 의한 분류로 아날로그디지털하이브리드 , , 컴퓨터로 나타낼 수 있다아날로그 컴퓨터의 주요 구성 회로는 . ? 논리 회로","c":["증폭 회로","연산 회로","플립플롭 회로",""]},{"n":12,"s":1,"a":2,"p":"12. 한글 에서 프린터 스풀 기능에 대한 설명으로 Windows 10 (SPOOL) 올바른 것은? 스풀링 단위는 인쇄할 문서 전체 단위로만 스풀링이 가능하다.","c":["프린터가 인쇄중이라도 다른 응용 프로그램 실행이 가능하다.","스풀링은 인쇄할 내용을 프린터로 직접 전송한다.","저속의 프린터 사용 시 컴퓨터 효율이 크게 저하된다.",""]},{"n":13,"s":1,"a":1,"p":"13. 다음 중 한글 의 폴더 옵션대화상자에서 설정할 Windows 10 [ ] 수 있는 작업으로 옳지 않은 것은? 라이브러리의 항목 삭제를 선택할 수 있다 [ ] .","c":["알려진 파일 형식의 확장명 숨기기를 선택할 수 있다 [ ] .","폴더 팁에 파일 크기 정보 표시를 선택할 수 있다 [ ] .","숨김 파일폴더 또는 드라이브 표시 안 함을 선택할 수 있다 [ , ] .",""]},{"n":14,"s":1,"a":2,"p":"14. 데이터 통신망 중 부가가치 통신망 에 관한 설명으로 옳은 (VAN) 것은? 자원 공유를 목적으로 전송 거리가 짧은 구내에서 사용하는","c":["통신망이다. 기간 통신망 사업자로부터 회선을 빌려 기존의 정보에 새로운","가치를 부여하여 다수의 이용자에게 판매하는 통신망이다. 문자음성동영상 등 다양한 데이터를 통합하여 디지털화된 , ,","하나의 통신 회선으로 전송하는 통신망이다. 전화국과 가입자 단말 사이의 회선을 유선 대신 무선 시스템을","이용하여 구성하는 통신망이다."]},{"n":15,"s":1,"a":3,"p":"15. 다음 중 파일 형식에 대한 설명으로 옳지 않은 것은 JPEG ? 비트 컬러를 사용하여 트루 컬러로 이미지를 표현한다 24 .","c":["사진과 같은 정지 영상을 표현하기 위한 국제 표준 압축 방식","이다. 에서 기본적으로 사용하는 벡터 파일 형식이다 Windows .","사용자가 압축률을 지정해서 이미지를 압축하는 압축 기법을","사용할 수 있다."]},{"n":16,"s":1,"a":3,"p":"16. 다음 중 데이터 전송에 사용되는 장비에 대한 설명으로 옳지 않은 것은? 아날로그 데이터의 감쇠현상을 복원하기 위해서 증폭기를 사","c":["용한다. 모뎀은 디지털 신호와 아날로그 신호를 상호 변환하는 기능을","가진다. 데이터 전송의 정확성을 보장받기 위하여 라우터를 사용한다.","디지털 데이터의 감쇠현상을 방지하기 위해서 리피터를 사용","한다."]},{"n":17,"s":1,"a":2,"p":"17. 다음 중 니블 에 대한 설명으로 옳은 것은 (Nibble) ? 자료 표현의 최소 단위이다.","c":["바이트를 반으로 나눈 비트로 구성된 단위이다 1 4 .","문자를 표현하는 최소 단위이다.","가 한 번에 처리할 수 있는 명령 단위이다 CPU .",""]},{"n":18,"s":1,"a":2,"p":"18. 다음 중 객체 지향 프로그래밍 특징으로 옳은 것은? 객체에 대하여 절차적 프로그래밍의 장점을 사용할 수 있다.","c":["객체 지향 프로그램은 코드의 재사용과 유지 보수가 용이하다.","객체 지향 프로그램은 주로 인터프리터 번역 방식을 사용한다.","프로그램의 구조와 절차에 중점을 두고 작업을 진행한다.",""]},{"n":19,"s":1,"a":3,"p":"- 19. 다음 중 시스템 보안을 위해 사용하는 방화벽 에 대한 (Firewall) 설명으로 적절하지 않은 것은? 주소 및 포트 번호를 이용하거나 사용자 인증을 기반으로 IP","c":["접속을 차단하여 네트워크의 출입로를 단일화한다. 명백히 허용되지 않은 것은 금지한다라는 적극적 방어 개념 ‘ ’","","",""]},{"n":20,"s":1,"a":4,"p":"20. 다음 중 인터넷 주소 체계인 에 IPv6(Internet Protocol version 6) 관한 설명으로 옳지 않은 것은? 인증 서비스비밀성 서비스데이터 무결성 서비스를 제공함 , ,","c":["으로써 보안 문제를 해결할 수 있다. 주소 체계는 유니캐스트 애니캐스트 멀 (Unicast), (Anycast),","티캐스트 등 세 가지로 나뉜다 (Multicast) . 주소의 확장성융통성연동성이 뛰어나며 실시간 흐름 제어 , ,","로 향상된 멀티미디어 서비스를 제공할 수 있다. 비트씩 부분총 비트의 주소를 사용하여 주소의 부 16 4 , 64 IP","족 문제를 해결할 수 있다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"21. 다음 중 아래 그림과 같이 기간과 이율의 변화에 따른 월불입액을 계산하려고 한다이때 적용한 데이터 표의 내용으로 옳은 것은 . ? 월불입액 계산 수식은 임 ( ‘=PMT(B3/12, B2*12, -B4)’ ) 입력값 행 입력 셀 : [ ] : $B$2","c":["입력값 열 입력 셀 : [ ] : $A$2","입력값 행 입력 셀 열 입력 셀 : [ ] : $B$2 [ ] : $B$3","입력값 행 입력 셀 열 입력 셀 : [ ] : $B$3 [ ] : $B$2",""]},{"n":22,"s":2,"a":1,"p":"22. 다음 중 부분합에 대한 설명 중 옳지 않은 것은? 그룹화할 항목으로 선택된 필드는 자동으로 오름차순 정렬하","c":["여 부분합이 계산된다. 부분합에서는 합계평균개수 등의 함수 이외에도 다양한 , ,","함수를 선택할 수 있다. 부분합에서 데이터 아래에 요약을 표시할 수 있다.","부분합에서 그룹 사이에 페이지를 나눌 수 있다.",""]},{"n":23,"s":2,"a":2,"p":"- 23. 다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 용지 방향용지 크기인쇄 품질을 설정할 수 있다 , , .","c":["머리글바닥글탭의 머리글영역에서 행열 머리글의 인쇄 ‘ / ’ ‘ ’ /","여부를 설정한다. 여백은 사용자가 직접 값을 입력할 수 있다.","워크시트에서 차트를 마우스로 선택한 후 페이지 설정메뉴 [ ]","를 선택하면 시트탭이 차트탭으로 바뀐다 , ‘ ’ ‘ ’ ."]},{"n":24,"s":2,"a":1,"p":"아래 워크시트에서 자격증 응시자에 대한 과목별 점수의 합계를 24. 배열 수식으로 구하였다다음 중 셀에 입력된 배열 수식으로 . [C10] 옳은 것은? {=SUM(IF($B$2:$B$7=B10, $C$2:$C$7))}","c":["{=SUM(IF(MOD(ROW($C$2:$C$7), 2)=1, $C$2:$C$7))}","{=SUM(IF(C2:C7, B2:B7=B10))}","{=SUM(IF(MOD(ROWS(C2:C7), 2)=0, C2:C7))}",""]},{"n":25,"s":2,"a":3,"p":"25. 다음 중 엑셀의 틀 고정에 대한 기능 설명으로 옳지 않은 것은? 틀 고정은 특정 행 또는 열을 고정할 때 사용하는 기능으로","c":["주로 표의 제목 행 또는 제목 열을 고정한 후 작업할 때 유용하다. 선택된 셀의 왼쪽 열과 바로 위의 행이 고정된다.","틀 고정 구분선을 마우스로 잡아끌어 틀 고정 구분선을 이동시","킬 수 있다. 틀 고정 방법으로 첫 행 고정을 실행하면 선택된 셀의 위치와","상관없이 첫 행이 고정된다."]},{"n":26,"s":2,"a":3,"p":"26. 다음 중 에 대한 설명으로 틀린 것은 VBA ? 을 누르면 가 실행된다 [Alt]+[F11] VBA .","c":["에서 를 눌러 매크로를 실행할 수 있다 VBA [F5] .","매","크로를 단계별로 실행할 수는 없으나 중간에 중단할 수 있다. 기록된 매크로의 내용을 수정할 수","있다 ."]},{"n":27,"s":2,"a":1,"p":"27. 다음 중 머리글바닥글기능에 대한 설명으로 옳지 않은 것은 [ / ] ? 보기탭 통합 문서 보기그룹의 페이지 나누기 미리 보기 [ ] [ ] ‘ ’","c":["를 클릭하면 머리글 및 바닥글을 쉽게 삽입할 수 있다. 머리글이나 바닥글의 텍스트에 앰퍼샌드 문자 한 개를 포 (&)","함시키려면 앰퍼샌드 문자를 두 번 입력한다 (&) . 여러 워크시트에 동일한 머리글바닥글을 한 번에 추가하려 [ / ]","면 여러 워크시트를 선택하여 그룹화 한 후 설정한다. 차트 시트인 경우 페이지 설정대화상자의 머리글바닥글 [ ] [ / ]","탭에서 머리글바닥글을 추가할 수 있다 / ."]},{"n":28,"s":2,"a":2,"p":"- 28. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는 데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단계에 포함되지 않는다. 개인용 매크로 통합 문서에 저장한 매크로는 엑셀을 시작할","때마다 자동으로 로드되므로 다른 통합 문서에서도 실행할 수 있다."]},{"n":29,"s":2,"a":2,"p":"29. 다음 중 데이터 입력에 대한 설명으로 옳지 않은 것은? 고정 소수점이 포함된 숫자를 입력하려면 옵션의 고 [Excel ] [","c":["급편집 옵션에서 소수점 자동 삽입확인란을 선택하고 소 ] ‘ ’ 수점 위치를 설정한다. 셀에 입력하는 글자 중 처음 몇 자가 해당 열의 기존 내용과","일치하면 나머지 글자가 자동으로 입력되며텍스트나 텍스트 , 숫자 조합날짜가 입력되는 경우에만 자동으로 입력된다 / , . 두 개 이상의 셀을 선택하고 채우기 핸들을 끌 때 을 [Ctrl]","누르고 있으면 자동 채우기 기능을 해제할 수 있다. 시간을 시간제로 입력하려면 과 같이 시간 뒤에 12 ‘9:00 pm’","공백을 입력하고 또는 을 입력한다 am pm ."]},{"n":30,"s":2,"a":1,"p":"30. 다음 중 사용자 지정 표시 형식에 대한 설명으로 틀린 것은? 소수점 오른쪽의 자리 표시자 보다 더 긴 숫자가 소수점 이하","c":["의 숫자로 셀에 입력될 경우 자리 표시자 만큼 소수 자릿수로 내림된다. 양수음수 텍스트 순으로 한 번에 네 가지의 표시 형식을 , , 0,","지정할 수 있다. 각 섹션에 대한 색은 섹션의 맨 앞에 개의 색 중 하나를 대괄 8","호로 묶어 입력해야 한다. 두 개의 섹션을 지정하면 첫 번째 섹션은 양수 또는 두 0,","번째 섹션은 음수에 대한 표시 형식이다."]},{"n":31,"s":2,"a":3,"p":"31. 아래 그림과 같이 설정한 상태에서 매크로 기록대화상자의 [ ] 확인단추를 누른다 범위를 선택한 후 글꼴 스타일을 [ ] . [A2:A6] 굵게로 지정하고 기록 중지를 눌러 서식매크로의 작성을 ‘ ’ [ ] ‘ ’ 완료하였다다음 중 매크로 작성 후 셀을 선택하고 서식 . [C1] ‘ ’ 매크로를 실행한 결과로 옳은 것은? 영역의 글꼴 스타일이 굵게 지정된다 [A2:A6] .","c":["셀만 글꼴 스타일이 굵게 지정된다 [A1] .","영역의 글꼴 스타일이 굵게 지정된다 [C2:C6] .","셀만 글꼴 스타일이 굵게 지정된다 [C1] .",""]},{"n":32,"s":2,"a":3,"p":"- 32. 아래의 시트에서 횟수에 따른 택배비를 계산하려고 한다횟수가 . 이하면 초과 이하면 초과면 무료로 표시하기 5 2000, 5 9 3000, 9 위해 셀에 입력해야 할 수식으로 옳지 않은 것은 [C2] ? 무료 =IF(B2<=5, 2000, IF(B2<=9, 3000, “ ”))","c":["무료 =IF(B2>9, “ ”, IF(B2>5, 3000, 2000))","무료 =IF(B2<=5, 2000, IF(OR(B2>5, B2<=9), 3000, “ ”))","무료 =IF(B2<=5, 2000, IF(AND(B2>5, B2<=9), 3000, “ ”))",""]},{"n":33,"s":2,"a":2,"p":"33. 다음 중 아래의 코드에 대한 설명으로 옳지 않은 것은 VBA ? Private Sub Worksheet_Change(ByVal Target As Range) If Target.Address = Range(“A1”).Address Then Target.Font.ColorIndex = 5 입니다 MsgBox Range(“A1”).Value & “ .“ End If End Sub 셀이 변경되면 셀의 글꼴 색이 가 인 [A1] [A1] ColorIndex 5","c":["색으로 변경된다. 셀을 선택하면 셀의 값이 메시지 박스에 표시된다 [A1] [A1] .","코드가 작성된 워크시트에서만 동작한다 VBA .","일반 모듈이 아닌 워크시트 이벤트를 사용한 코드이다.",""]},{"n":34,"s":2,"a":3,"p":"다음 중 아래 시트에 대한 수식의 결과로 옳은 것은 34. ? =SUM(B2:C5 C2:D5 B3:D4) 30","c":["#N/A","5","0",""]},{"n":35,"s":2,"a":3,"p":"35. 다음 중 인쇄 미리 보기 및 인쇄에 관한 설명으로 옳지 않은 [ ] 것은? 인쇄 미리 보기 및 인쇄화면에서 여백 표시를 선택한 경우 [ ] ‘ ’","c":["마우스로 여백을 변경할 수 있다. 인쇄 미리 보기 및 인쇄화면을 표시하는 바로 가기 키는 [ ]","이다 [Ctrl]+[F2] . 인쇄 미리 보기 및 인쇄화면에서 인쇄 영역을 다시 설정할 [ ]","수 있다. 인쇄될 내용이 없는 상태에서 인쇄 미리 보기 및 인쇄화면 [ ]","을 실행하면 인쇄할 내용이 없다는 메시지가 표시된다."]},{"n":36,"s":2,"a":2,"p":"36. 다음 중 데이터가 입력된 셀에서 채우기 핸들을 드래그하여 데이터 를 채우는 경우에 대한 설명으로 옳은 것은? 일반적인 문자 데이터나 날짜 데이터는 그대로 복사되어 채워","c":["진다. 개의 숫자와 문자가 조합된 텍스트 데이터는 숫자만 씩 증 1 1","가하고 문자는 그대로 복사되어 채워진다. 숫자 데이터는 씩 증가하면서 채워진다 1 .","숫자가 입력된 두 셀을 블록 설정하여 채우기 핸들을 드래그하","면 두 숫자가 반복하여 채워진다."]},{"n":37,"s":2,"a":3,"p":"37. 다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은? 조건부 서식의 조건은 결과가 또는 가 TRUE(1) FALSE(0)","c":["나오도록 작성한다. 같은 통합 문서의 특정 셀을 이용하여 조건을 지정할 수 있다.","수식을 이용하여 조건을 지정할 경우워크시트의 특정 셀을 ,","클릭하면 상대 참조로 작성된다. 이동 옵션을 이용하여 조건부 서식이 지정된 셀을 찾을 수","있다."]},{"n":38,"s":2,"a":2,"p":"- 38. 다음 중 고급 필터 실행을 위한 조건 지정 방법에 대한 설명으로 옳지 않은 것은? 함수나 식을 사용하여 조건을 입력하면 셀에는 비교되는 현재","c":["대상의 값에 따라 나 가 표시된다 TRUE FALSE .","","",""]},{"n":39,"s":2,"a":1,"p":"39. 다음 중 차트에서 사용하는 축에 대한 설명으로 옳지 않은 것은? 방사형 차트와 거품형 차트에서는 기본 가로 축만 표시된다.","c":["가로항목축에서 축 위치옵션은 데이터 표시와 레이블이 ( ) [ ]","축에 표시되는 방식에 영향을 주며 차원 영역형 차트세로 2 , 막대형 차트 및 꺾은선형 차트에 사용할 수 있다. 가로항목축이 날짜 값인 경우 축 종류에서 날짜 축을 ( ) [ ] ‘ ’","선택하여 단위를 일 월 년중 선택하여 지정할 수 있다 [ ] ‘ ’, ‘ ’, ‘ ’ . 차원 꺾은선형 차트는 세 개의 축가로세로깊이 축에 3 ( , , )","따라 데이터 요소를 비교한다."]},{"n":40,"s":2,"a":2,"p":"40. 다음 중 공유 통합 문서에 대한 설명으로 옳지 않은 것은? 여","c":["러 사용자가 동시에 동일한 셀을 변경하려면 충돌이 발생한다. 통합 문서를 공유한
