:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--soft:#eff6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 90px}.top{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.93);backdrop-filter:blur(12px);padding:12px 0;display:flex;align-items:center;gap:8px}.brand{font-weight:900;font-size:19px}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.blue{background:var(--accent);color:#fff;border-color:var(--accent)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.hero{padding:20px}.hero h1{margin:0 0 8px;font-size:26px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:900}.menu small{display:block;margin-top:6px;color:var(--muted);font-weight:600}.exam{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;padding:5px 8px;background:var(--soft);color:#1d4ed8;border-radius:999px}.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.qnum{font-weight:900}.subject{font-size:12px;color:var(--muted)}.prompt{font-size:17px;line-height:1.58;font-weight:750;white-space:pre-wrap}.choices{margin-top:14px;display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;line-height:1.45;font-size:15px}.choice.sel{border-color:#2563eb;background:#eff6ff}.choice.correct{border-color:#16a34a;background:#f0fdf4}.choice.wrong{border-color:#dc2626;background:#fef2f2}.nav{display:flex;gap:8px;margin-top:14px}.nav .btn{flex:1}.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 14px}.progress>div{height:100%;background:#2563eb}.score{font-size:46px;font-weight:950}.pass{color:var(--ok)}.fail{color:var(--bad)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.scorecard{background:#f8fafc;border-radius:13px;padding:11px}.scorecard b{display:block;font-size:20px}.wrongbox{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.explain{background:#f8fafc;border-radius:13px;padding:12px;margin-top:9px;font-size:14px;line-height:1.55}.optline{padding:7px 0;border-top:1px dashed #e5e7eb}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.stat b{font-size:24px;display:block}.chart{height:190px;display:flex;align-items:flex-end;gap:8px;padding:12px 4px 24px;border-bottom:1px solid var(--line);overflow-x:auto}.barwrap{min-width:38px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end}.bar{background:#2563eb;border-radius:8px 8px 3px 3px;min-height:2px}.barlabel{font-size:10px;color:var(--muted);margin-top:4px}.hidden{display:none!important}.pillrow{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}.pill.on{background:#111827;color:#fff}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.scores{grid-template-columns:1fr}.prompt{font-size:16px}.wrap{padding-left:12px;padding-right:12px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">컴활 1급 CBT</div><div class="spacer"></div><button id="homeBtn" class="btn hidden">홈</button></div><main id="app"></main></div><script>const DATA=[{"id":"2023-상시-01","t":"2023 상시 01","q":[{"n":1,"s":1,"a":1,"p":"핸드폰노트북과 같은 휴대기기를 서로 연결하여 정보를 교환할 1. , 수 있도록 하는 근거리 무선 통신 기술은? 블루투스","c":["와이파이","와이브로","테더링",""]},{"n":2,"s":1,"a":3,"p":"다음 중 데이터 전송에 사용되는 장비에 대한 설명으로 옳지 않은 2. 것은? 아날로그 데이터의 감쇠현상을 복원하기 위해서 증폭기를 사","c":["용한다. 모뎀은 디지털 신호와 아날로그 신호를 상호 변환하는 기능을","가진다. 데이터 전송의 정확성을 보장받기 위하여 라우터를 사용한다.","디지털 데이터의 감쇠현상을 방지하기 위해서 리피터를 사용","한다."]},{"n":3,"s":1,"a":3,"p":"다음 중 바이러스 감염 증상에 대한 설명으로 옳지 않은 것은 3. ? 특정 날짜가 되면 화면에 이상한 메시지가 표시된다.","c":["디스크를 인식하지 못하거나디스크 볼륨명이 변경될 수도 ,","있다. 파일의 크기가 작아지고프로그램의 실행 속도가 빨라진다 , .","시스템 파일이 손상되어 부팅 이 정상적으로 수행되 (Booting)","지 않는다."]},{"n":4,"s":1,"a":4,"p":"다음 중 파일 탐색기의 검색 도구에 대한 설명으로 옳지 않은 4. [ ] 것은? 수정한 날짜를 이용하여 지난 주에 수정한 파일들을 검색할","c":["수 있다. 파일의 크기를 선택하여 검색할 수 있다.","파일의 종류를 선택하여 검색할 수 있다.","파일 특성이 읽기 전용인 파일들을 검색할 수 있다 ‘ ’ .",""]},{"n":5,"s":1,"a":3,"p":"다음 중 외부로부터의 데이터 침입 행위에 관한 유형 중 위조 5. 에 대한 설명으로 옳은 것은 (Fabrication) ? 데이터의 정상적인 전달을 가로막아서 흐름을 방해하는 행위","c":["데이터가 수신지까지 가는 도중에 몰래 보거나 도청하여 정보","를 유출하는 행위 데이터가 다른 송신자로부터 전송된 것처럼 꾸미는 행위","전송된 원래의 데이터를 다른 내용으로 바꾸는 행위",""]},{"n":6,"s":1,"a":1,"p":"- 다음 중 의 바이오스 에 대한 설명으로 옳지 않은 것은 6. PC (BIOS) ? 최근에는 보조기억장치인 에 저장이 가능하여 칩 교환 SSD","c":["","","",""]},{"n":7,"s":1,"a":3,"p":"다음 중 의 장치 관리자에서 할 수 있는 작업으로 7. Windows 10 [ ] 옳은 것은? 사용하지 않는 응용 프로그램을 제거할 수 있다.","c":["시동 디스크를 만들 수 있다.","설치된 하드웨어의 드라이버를 업데이트 할 수 있다.","가상 메모리에 대한 정보를 확인하고설정 값을 변경할 수 ,","있다."]},{"n":8,"s":1,"a":4,"p":"다음 중 비트 및 비트 버전의 에 관한 설명으로 8. 32 64 Windows OS 옳지 않은 것은? 비트 버전의 에서는 대용량 을 비트 시스 64 Windows RAM 32","c":["템보다 효과적으로 처리한다. 비트 버전의 를 설치하려면 비트 버전의 64 Windows 64","를 실행할 수 있는 가 필요하다 Windows CPU . 비트 버전의 에서 하드웨어 장치가 정상적으로 64 Windows","동작하려면 비트용 장치 드라이버가 필요하다 64 . 앱이 비트 버전의 용으로 설계된 경우 호환성 유 64 Windows","지를 위해 비트 버전의 에서도 작동되도록 설계 32 Windows 되어 있다."]},{"n":9,"s":1,"a":2,"p":"다음 중 프린터의 인쇄 대기열에서 수행할 수 있는 작업으로 옳지 9. 않은 것은? 여러 개의 출력 파일들의 출력 대기 상태를 확인할 수 있다.","c":["프린터에서 인쇄 중인 문서를 중지시키면 다른 프린터에서","이어서 출력할 수 있다. 인쇄 대기열에 있는 문서의 인쇄 순서를 변경할 수 있다.","인쇄 대기 중인 문서를 삭제하거나 출력 대기 순서를 임의로","조정할 수 있다."]},{"n":10,"s":1,"a":3,"p":"다음 중 의 그림판에 대한 내용으로 옳지 않은 것은 10. Windows 10 [ ] ? 그림판에서 와 등의 파일을 작업할 수 PNG JPG, GIF, BMP","c":["있다. 그림을 회전하거나 대칭 이동 등의 작업을 할 수 있다.","레이어를 이용하면 여러 사진을 추가하여 합성할 수 있다 [ ] .","그림에 텍스트를 입력할 수 있고글꼴 서식을 변경할 수 있다 , .",""]},{"n":11,"s":1,"a":2,"p":"- 다음 중 유비쿼터스 센서 네트워크 의 활용 분야에 속하는 11. (USN) 것은? 테더링","c":["텔레매틱스","블루투스","고퍼",""]},{"n":12,"s":1,"a":3,"p":"다음 중 컴퓨터의 분류에 대한 설명으로 옳지 않은 것은 12. ? 컴퓨터는 처리 능력에 따른 분류데이터 취급에 따른 분류 , ,","c":["사용 용도에 따른 분류로 나눌 수 있다. 하이브리드 컴퓨터는 디지털 컴퓨터와 아날로그 컴퓨터의 장","점을 혼합하여 만든 컴퓨터이다. 컴퓨터를 데이터 취급 형태에 따라 미니 컴퓨터마이크로 컴 ,","퓨터슈퍼 컴퓨터 등으로 구분할 수 있다 , . 컴퓨터를 어떠한 목적으로 사용하느냐에 따라 범용 컴퓨터와","전용 컴퓨터로 분류할 수 있다."]},{"n":13,"s":1,"a":4,"p":"다음 중 컴퓨터 운영체제 대한 설명으로 옳지 않은 것은 13. (OS) ? 컴퓨터 하드웨어와 응용 프로그램을 사용하고자 하는 사용자","c":["사이에 위치하여 인터페이스 역할을 해주는 소프트웨어이다. 운영체제는 컴퓨터가 동작하는 동안 주기억장치에 위치하며,","프로세스기억장치입출력장치파일 등의 자원을 관리한다 , , · , . 운영체제의 목적에는 처리 능력의 향상응답 시간의 단축 , ,","사용 가능도의 향상신뢰도 향상 등이 있다 , . 운영체제의 종류에는 어셈블러컴파일러인터프리터 등이 , ,","있다."]},{"n":14,"s":1,"a":2,"p":"다음 중 컴퓨터에서 사용하는 코드에 관한 설명으로 옳지 14. ASCII 않은 것은? 데이터 처리 및 통신 시스템 상호 간의 정보 교환을 위해 사용","c":["된다. 각 나라별 언어를 표현할 수 있다.","각 문자를 비트로 표현하며총 개의 문자 표현이 가능하 7 , 128","다. 확장 코드는 비트를 사용한다 ASCII 8 .",""]},{"n":15,"s":1,"a":4,"p":"다음 중 컴퓨터에서 사용하는 기억장치에 관한 설명으로 옳지 15. 않은 것은? 플래시 메모리는 비휘발성 기억장치로 주로 디지털 (Flash)","c":["카메라나 개인용 정보 단말기 드라이브 등 휴대형 기기 , USB 에서 대용량 정보를 저장하는 용도로 사용된다. 하드디스크 인터페이스 방식은 방식 등이 EIDE, SATA, SCSI","있다. 캐시 메모리는 와 주기억장치 사이에 위치하여 (Cache) CPU","두 장치간의 속도 차이를 줄여 컴퓨터의 처리 속도를 빠르게 하기 위한 메모리이다. 연관 메모리는 보조기억장치를 마치 주기억장 (Associative)","치와 같이 사용하여 실제 주기억장치 용량보다 기억용량을 확대하여 사용하는 방법이다."]},{"n":16,"s":1,"a":3,"p":"다음 중 프로그램 카운터 에 대한 설명으로 옳은 것은 16. (PC) ? 명령 레지스터에 있는 명령어를 해독한다.","c":["연산 결과를 일시적으로 저장한다.","다음에 실행할 명령어의 주소를 저장한다.","현재 실행 중인 명령을 기억한다.",""]},{"n":17,"s":1,"a":1,"p":"다음 중 마이크로프로세서 에 관한 설명으로 터시트에서 데이터를 직접 편집할 수 없다.","개 이상의 열 머리글 옵션과 행 머리글 옵션값 옵션 등을 2 ,","지정해야 한다. 행과 열이 교차하는 곳의 숫자 필드는 합계평균분산표준 , , ,","편차 등을 계산할 수 있다."]},{"n":55,"s":3,"a":4,"p":"다음 중 데이터베이스의 장점이 아닌 것은 55. ? 데이터의 일관성을 유지할 수 있다.","c":["데이터의 중복을 최소화할 수 있다.","데이터의 무결성을 유지할 수 있다.","데이터 유실 시 파일 회복이 쉽다.",""]},{"n":56,"s":3,"a":4,"p":"다음 중 데이터 모델의 구성 요소가 아닌 것은 56. ? 논리적으로 표현된 데이터 구조","c":["실제 데이터의 논리적인 제약 조건","실제 데이터를 처리하는 연산","실제 데이터의 물리적인 저장 구조",""]},{"n":57,"s":3,"a":4,"p":"- 다음 보고서에 대한 설명으로 옳지 않은 것은 57. ? 음영으로 표시된 거래처별보고서는 페이지 머리글에 작성 “ ”","c":["되었다. 거래처별로 그룹이 설정되었고 날짜를 기준으로 내림차순 정","렬이 설정되었다. 순번은 컨트롤 원본에 이 입력되고 누적 합계속성이 ‘ ’ “=1” ‘ ’","그룹으로 설정되었다 “ ” . 보고서 바닥글에 표시된 페이지 번호는 전체 페이지 번호와","현재 페이지 번호가 레이블을 이용하여 작성되었다."]},{"n":58,"s":3,"a":3,"p":"58. 다음 화면에서 설정되어 있는 폼의 속성 값으로 옳지 않은 것은? 캡션 주문현황 :","c":["탐색 단추 예 :","보기 형식 단일 폼 :","레코드 선택기 예 :",""]},{"n":59,"s":3,"a":4,"p":"다음 중 입력 마스크 설정에 사용하는 사용자 정의 입력 마스크 59. 기호에 대한 설명으로 옳은 것은? 소문자로 변환 9 :","c":["숫자나 공백을 입력받도록 설정 > :","영문 대문자로 변환하여 입력받도록 설정 < :","영문자와 한글만 입력받도록 설정 L :",""]},{"n":60,"s":3,"a":2,"p":"- 다음은 폼 디자인 보기에서의 작업에 대한 설명이다각 번호에 60. ‘ ’ . 대한 마우스 작업 설명 중 옳지 않은 것은? ❶ ❷ ❸ ❹ 을 오른쪽 버튼으로 클릭하여 레이아웃 보기로 보기 형식 ‘ ’","c":["❶ 을 변경할 수 있다. 를 더블클릭하면 탭 순서대화상자가 표시된다 ‘ ’ .","❷ 을 클릭하면 본문의 모든 컨트롤이 선택된다.","❸ 를 더블클릭하면 폼 속성 시트창이 표시된다 ‘ ’ .","❹"]}]},{"id":"2023-상시-02","t":"2023 상시 02","q":[{"n":1,"s":1,"a":1,"p":"웹 기반 애플리케이션을 활용하여 인터넷 개인 서버에서 대용량 1. 데이터베이스를 연산처리하고 저장한 데이터를 나 스마트폰 ( ) PC , 등 다양한 단말기에서 불러오거나 가공할 수 있도록 하는 Pad 환경을 의미하는 것은? 클라우드 컴퓨팅(Cloud Computing)","c":["그리드 컴퓨팅(Grid Computing)","사물 인터넷(Internet of Things)","빅 데이터(Big Data)",""]},{"n":2,"s":1,"a":2,"p":"데이터 통신망 중 부가가치 통신망 에 관한 설명으로 옳은 2. (VAN) 것은? 자원 공유를 목적으로 전송 거리가 짧은 구내에서 사용하는","c":["통신망이다. 기간 통신망 사업자로부터 회선을 빌려 기존의 정보에 새로운","가치를 부여하여 다수의 이용자에게 판매하는 통신망이다. 문자음성동영상 등 다양한 데이터를 통합하여 디지털화된 , ,","하나의 통신 회선으로 전송하는 통신망이다. 전화국과 가입자 단말 사이의 회선을 유선 대신 무선 시스템을","이용하여 구성하는 통신망이다."]},{"n":3,"s":1,"a":3,"p":"다음 중 한글 의 레지스트리에 관한 설명으로 옳지 3. Windows 10 않은 것은? 의 자체 구성 정보를 저장하는 데이터베이스이다 Windows .","c":["에 탑재된 레지스트리 편집기는 이다 Windows ‘regedit.exe’ .","레지스트리 정보는 의 부팅 시에만 참조된다 Windows .","레지스트리에는 각 사용자의 프로필과 시스템 하드웨어설치 ,","된 프로그램 및 속성 설정에 대한 정보가 들어 있다."]},{"n":4,"s":1,"a":3,"p":"4. 다음 중 한글 의 폴더 옵션대화상자에서 설정할 Windows 10 [ ] 수 있는 작업으로 옳지 않은 것은? 숨김 파일이나 폴더의 표시 여부를 지정할 수 있다.","c":["알려진 파일 형식의 파일 확장명을 숨기도록 설정할 수 있다.","탐색 창미리 보기 창세부 정보 창의 표시 여부를 선택할 , ,","수 있다. 폴더에서 시스템 파일을 검색할 때 색인의 사용 여부를 선택할","수 있다."]},{"n":5,"s":1,"a":1,"p":"- 5. 다음 중 한글 에서 설치된 기본 프린터의 인쇄 관리자 Windows 10 창에서 실행할 수 있는 작업으로 옳지 않은 것은? 인쇄 중인 문서나 오류가 발생한 문서를 다른 프린터로 전송할","c":["수 있다.","","",""]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 파일의 바로 가기 메뉴 연결 프로그램에 대한 설명으로 [ ] 옳지 않은 것은? 문서나 그림 같은 데이터 파일을 더블클릭할 때 자동으로 실행","c":["되는 앱을 의미한다. 파일의 바로 가기 메뉴에서 연결 프로그램을 선택하면 연결 [ ]","프로그램을 변경할 수 있다. 연결 프로그램이 지정되지 않았을 경우 데이터 파일을 더블클","릭하면 연결 프로그램을 선택하기 위한 대화상자가 표시된다. 연결 프로그램대화상자에서 연결 프로그램을 삭제하면 연 [ ]","결된 데이터 파일도 함께 삭제된다."]},{"n":7,"s":1,"a":1,"p":"다음 중 특정한 목적을 위한 작은 컴퓨터 시스템으로 하드웨어와 7. 소프트웨어가 하나로 조합되어 있고 냉장고밥솥 등의 가전제 , TV, , 품에 사용되는 시스템은? 임베디드 시스템","c":["듀얼 시스템","듀플렉스 시스템","시분할 시스템",""]},{"n":8,"s":1,"a":3,"p":"다음 중 컴퓨터의 연산장치에 있는 레지스터에 관한 설명으로 8. 옳지 않은 것은? 누산기는 연산 결과를 일시적으로 저장한다.","c":["가산기는 진수 덧샘을 수행한다 2 .","보수기는 곱셈과 나눗셈을 위하여 데이터를 보수로 변환한다.","상태 레지스터는 연산중에 발생하는 여러 가지 상태값을 기억","한다."]},{"n":9,"s":1,"a":1,"p":"9. 다음 중 컴퓨터 그래픽과 관련하여 벡터 이미지에 관한 (Vector) 설명으로 옳지 않은 것은? 픽셀로 이미지를 표현하며래스터 이미지라고도 한 , (Raster)","c":["다. 점을 연결하는 직선이나 곡선을 이용하여 이미지를 구성한다.","대표적인 파일 형식에는 등이 있다 AI, WMF .","이미지의 크기를 확대하여도 화질에 손상이 없다.",""]},{"n":10,"s":1,"a":2,"p":"- 10. 다음 중 인터넷 주소 체계인 에 IPv6(Internet Protocol version 6) 관한 설명으로 옳지 않은 것은? 주소의 확장성융통성연동성이 뛰어나며 실시간 흐름 제어 , ,","c":["로 향상된 멀티미디어 서비스를 제공할 수 있다. 비트씩 부분총 비트의 주소를 사용하여 주소의 부 16 4 , 64 IP","족 문제를 해결할 수 있다. 주소 체계는 유니캐스트 애니캐스트 멀 (Unicast), (Anycast),","티캐스트 등 세 가지로 나뉜다 (Multicast) .",""]},{"n":11,"s":1,"a":2,"p":"다음 중 시스템의 정보 보안을 위한 기본 충족 요건에 대한 설명으로 11. 옳지 않은 것은? 무결성 시스템 내의 정보는 인가된 사용자만 수정할 수 있다 : .","c":["부인방지 정보를 보내오는 사람의 신원을 확인한다 : .","가용성 인가받은 사용자는 언제라도 사용할 수 있다 : .","기밀성 시스템 내의 정보와 자원은 인가된 사용자에게만 :","접근이 허용된다."]},{"n":12,"s":1,"a":2,"p":"12. 다음 중 소프트웨어 자체에 광고를 포함하여 이를 보는 대가로 무료로 사용하는 소프트웨어는? 스파이웨어(Spyware)","c":["애드웨어(Adware)","프리웨어(Freeware)","셰어웨어(Shareware)",""]},{"n":13,"s":1,"a":4,"p":"13. 다음 중 레지스터 에 대한 설명 중 옳지 않은 것은 (Register) ? 레지스터의 크기는 컴퓨터가 한 번에 처리할 수 있는 데이터의","c":["크기를 나타낸다. 구조는 플립플롭 이나 래치 를 직렬 또는 병 (Flip-Flop) (Latch)","렬로 연결한다. 내부에서 처리할 명령어나 연산 결과 값을 일시적으로 CPU","저장하는 기억장치이다. 펌웨어 를 저장하는 비휘발성 메모리로 액세스 속 (Firmware)","도가 가장 빠른 기억장치이다."]},{"n":14,"s":1,"a":2,"p":"14. 다음 중 방화벽에 대한 설명으로 적절하지 않은 것은? 보안이 필요한 네트워크의 통로를 단일화하여 관리한다.","c":["방화벽 시스템은 내부와 외부로부터 불법적인 해킹을 완전히","차단할 수 있다. 권한이 없는 사용자가 네트워크를 통해 컴퓨터에 액세스 하는","것을 방지한다. 역추적 기능으로 외부 침입자의 흔적을 찾을 수 있다.",""]},{"n":15,"s":1,"a":1,"p":"15. 다음 중 멀티미디어의 특징에 관한 설명으로 옳지 않은 것은? 용이성 각각의 분리된 매체오디오 등보다 콘텐 (Easiness) : ( )","c":["츠 제작이 용이하다. 비선형성 데이터가 일정한 방향으로 순차적으 (Non-Linear) :","로 처리되는 것이 아니라 사용자의 선택에 따라 다양한 방향으 로 처리된다. 디지털화 여러 종류의 정보를 컴퓨터로 처리하 (Digitization) :","기 위해서 디지털 방식으로 변환하여 처리한다. 상호 작용성 정보 제공자의 선택에 의해 일방적 (Interaction) :","으로 데이터가 전달되는 것이 아니라 정보 제공자와 사용자 간의 의견을 통한 상호 작용에 의해 데이터가 전달된다."]},{"n":16,"s":1,"a":3,"p":"다음 중 멀티미디어와 관련하여 16. MPEG(Moving Picture Experts 에 관한 설명으로 옳지 않은 것은 Group) ? 동영상 전문가 그룹에서 제정한 동영상 압축 기술에 대한 국제","c":["표준 기술이다. 는 멀티미디어 통신을 전제로 만들어진 영상 압축 기 MPEG4","술로서 낮은 전송률로 동영상을 보내고자 개발된 데이터 압축 과 복원 기술이다. 프레임 간의 연관성을 고려하여 중복 데이터를 제거하는 비손","실 압축 기법을 사용한다. 동영상뿐만 아니라 오디오 데이터도 압축할 수 있다.",""]},{"n":17,"s":1,"a":2,"p":"- 다음 중 프로토콜에서 프로토콜의 개요 및 기능에 관한 17. TCP/IP IP 설명으로 옳은 것은? 메시지를 송수신자의 주소와 정보로 묶어 패킷 단위로 나눈 /","c":["다.","","",""]},{"n":18,"s":1,"a":1,"p":"다음 중 에 대한 설명으로 옳지 않은 것은 18. RAID ? 의 구성 방식을 이라 하고 의 숫자가 RAID RAID Level , Level","c":["작을수록 저장장치의 신뢰성이 높고 효율성이 좋다. 주로 서버에서 사용하며데이터의 안전성이 높다 , .","를 사용하면 데이터 복구가 용이하며속도도 빨라진다 RAID , .","여러 개의 하드디스크를 모아서 하나의 하드디스크처럼 사용","할 수 있도록 하는 기술이다."]},{"n":19,"s":1,"a":4,"p":"다음 중 관리에 대한 설명으로 옳지 않은 것은 19. PC ? 컴퓨터의 성능 향상을 위해 주기적으로 디스크 정리드라이브 ,","c":["오류 검사드라이브 최적화 등을 실행하는 것이 좋다 , . 직사광선과 습기가 많거나 자성이 강한 물체가 있는 곳은 피하","는 것이 좋다. 컴퓨터 전용 전원 장치를 단독으로 사용하고전원을 끌 때는 ,","사용 중인 프로그램을 먼저 종료하는 것이 좋다. 바","이러스를 예방하기 위하여 업데이트를 자주 실행한다 BIOS ."]},{"n":20,"s":1,"a":4,"p":"다음 중 한글 에서 하드디스크의 용량 부족 문제가 20. Windows 10 발생하였을 때의 해결 방법으로 적절하지 않은 것은? 휴지통 비우기를 수행한다 [ ] .","c":["디스크 정리를 통해 임시 파일들을 삭제한다 [ ] .","사용하지 않는 응용 프로그램을 삭제한다.","드라이브 조각 모음 및 최적화를 수행한다.","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":4,"p":"다음 중 여러 워크시트를 선택하여 그룹으로 설정한 경우에 대한 21. 설명으로 옳지 않은 것은? 엑셀 창의 맨 위 제목 표시줄에 그룹이라고 표시된다 [ ] .","c":["그룹으로 설정된 임의의 시트에서 데이터를 입력하면 그룹으","로 설정된 모든 시트에 반영된다. 그룹으로 설정된 임의의 시트에서 셀 서식을 지정하면 그룹으","로 설정된 모든 시트에 반영된다. 그룹을 해제하려면 를 누른다 [Esc] .",""]},{"n":22,"s":2,"a":2,"p":"22. 다음 중 윗주에 대한 설명으로 옳지 않은 것은? 윗주는 셀에 대한 주석을 설정하는 것이다.","c":["데이터를 삭제해도 윗주는 그대로 표시되어 있다.","문","자열 데이터가 입력되어 있는 셀에만 윗주를 표시할 수 있다. 윗주의 서식을 변경할 수 있다.",""]},{"n":23,"s":2,"a":3,"p":"23. 다음 중 찾기 및 바꾸기대화상자에서 문자 자체를 찾는 [ ] ‘*’ 방법은? 찾을 내용에 를 입력한다 ’ “%*” .","c":["찾을 내용에 를 입력한다 ’ “!*” .","찾을 내용에 를 입력한다 ’ “~*” .","찾을 내용에 를 입력한다 ’ “$*” .",""]},{"n":24,"s":2,"a":4,"p":"- 24. 다음 중 연속적인 위치에 데이터가 입력되어 있는 여러 개의 셀을 범위로 설정한 후셀 병합을 실행하였을 때의 결과에 대한 설명으 , 로 옳은 것은? 기존에 입력되어 있던 데이터들이 한 셀에 모두 표시된다.","c":["데이터가 들어 있는 여러 셀은 셀 보호가 자동으로 설정되어","병합할 수 없다.","",""]},{"n":25,"s":2,"a":4,"p":"25. 숫자 를 입력한 후 아래의 표시 형식을 적용했을 때 표시되는 123.45 결과로 옳은 것은? [>200]0;(0);0“*” 123.45","c":["(123)","123","123*",""]},{"n":26,"s":2,"a":1,"p":"아래 시트에서 영역을 선택한 후 조건부 서식을 그림과 26. [A2:C4] 같이 설정하였다다음 중 이에 대한 설명으로 옳은 것은 단 . ? ( , 규칙의 적용 대상은 임 $A$2:$C$4 ) 영역이 조건부 서식의 첫번째 규칙에 설정된 서식으 [A3:C3]","c":["로 바뀐다. 셀만 조건부 서식의 첫번째 규칙에 설정된 서식으로 바 [B3]","뀐다. 영역이 조건부 서식의 두번째 규칙에 설정된 서식으 [A3:C3]","로 바뀐다. 셀만 조건부 서식의 두번째 규칙에 설정된 서식으로 [A3]","바뀐다."]},{"n":27,"s":2,"a":4,"p":"다음 중 아래의 워크시트에서 셀에 수식 을 27. [C1] ‘=A1+B1+C1’ 입력할 경우 발생하는 상황으로 옳은 것은? 셀에 오류 표시 [C1] ‘#REF!’","c":["셀에 오류 표시 [C1] ‘#NUM!’","데이터 유효성 오류 메시지 창 표시","순환 참조 경고 메시지 창 표시",""]},{"n":28,"s":2,"a":2,"p":"- 아래의 시트에서 셀에 수식 28. [A6] “=SUM(OFFSET(A1, 1, 0, 3, 을 입력했을 때 알맞은 결과값은 1))” ? 9","c":["27","6","15",""]},{"n":29,"s":2,"a":3,"p":"아래 워크시트에서 매출액 을 이용하여 매출 구간별 빈도수 29. [B3:B9] 를 영역에 계산하고자 한다다음 중 이를 위한 배열 [F3:F6] . 수식으로 옳은 것은? {=PERCENTILE(B3:B9, E3:E6)}","c":["{=PERCENTILE(E3:E6, B3:B9)}","{=FREQUENCY(B3:B9, E3:E6)}","{=FREQUENCY(E3:E6, B3:B9)}",""]},{"n":30,"s":2,"a":2,"p":"30. 아래 워크시트에서 영역을 범위로 설정하고그림과 같이 [A1:C2] , 입력하고 를 눌렀다 셀에 를 [Ctrl]+[Shift]+[Enter] . [A5] ‘=A1+B2’ 입력했을 때 결과는? 4","c":["5","6","7",""]},{"n":31,"s":2,"a":2,"p":"31. 다음 중 엑셀 차트의 추세선에 관한 설명으로 옳지 않은 것은? 추세선은 지수선형로그다항식거듭제곱이동 평균 등 , , , , ,","c":["가지의 종류가 있다 6 . 하나의 데이터 계열에 두 개 이상의 추세선을 동시에 표시할","수는 없다. 방사형원형도넛형 차트에는 추세선을 사용할 수 없다 , , .","추세선이 추가된 데이터 계열의 차트 종류를 차원으로 바꾸 3","면 추세선이 사라진다."]},{"n":32,"s":2,"a":3,"p":"32. 다음 중 워크시트의 화면 확대축소에 관한 설명으로 옳지 않은 [ / ] 것은? 선택 영역 확대축소 명령은 선택된 영역으로 전체 창을 [ / ]","c":["채우도록 워크시트를 확대하거나 축소한다. 문서의 확대축소는 에서 까지 설정할 수 있다 / 10% 400% .","설정한 확대축소 배율은 통합 문서의 모든 시트에 자동으로 /","적용된다. 화면의 확대축소는 단지 화면에서 보이는 상태만을 확대축 / /","소하는 것으로 인쇄 시 적용되지 않는다."]},{"n":33,"s":2,"a":3,"p":"- 33. 다음 중 인쇄 미리 보기에 관한 설명으로 옳지 않은 것은 [ ] ? 인쇄 미리 보기 및 인쇄에서 여백 표시를 선택한 경우 마우 [ ] ‘ ’","c":["스로 여백을 변경할 수 있다. 인쇄 미리 보기 및 인쇄화면을 표시하는 바로 가기 키는 [ ]","이다 [Ctrl]+[F2] . 인쇄 미리 보기 및 인쇄화면에서 인쇄 영역을 다시 설정할 [ ]","수 있다. 인쇄될 내용이 없는 상태에서 인쇄 미리 보기 및 인쇄화면 [ ]","을 실행하면 인쇄할 내용이 없다는 메시지가 표시된다."]},{"n":34,"s":2,"a":3,"p":"34. 다음 중 데이터 정렬에 관한 설명으로 옳지 않은 것은? 대소문자를 구분하여 정렬할 수 있다 / .","c":["표 안에서 다른 열에는 영향을 주지 않고 선택한 한 열내에서","만 정렬하도록 할 수 있다. 행을 기준으로 정렬하려면 정렬대화상자의 옵션에서 정 [ ] [ ]","렬 옵션의 방향을 위쪽에서 아래쪽으로 선택한다 ‘ ’ . 정렬 기준으로 셀 아이콘을 선택한 경우 기본 정렬 순서는 ‘ ’","위에 표시이다 ‘ ’ ."]},{"n":35,"s":2,"a":1,"p":"35. 다음 워크시트에서 종료기간이 월인 레코드를 검색하려고 할 3 때 고급 필터의 조건으로 올바르게 표현된 것은?","c":["","","",""]},{"n":36,"s":2,"a":3,"p":"다음 중 아래의 피벗 테이블에 대한 설명으로 옳지 않는 것은 36. ? 보고서 필터로 사용된 필드는 구분과 차종이다 ‘ ’ ‘ ’ .","c":["행 레이블로 사용된 필드는 이름과 입사이다 ‘ ’ ‘ ’ .","값 영역에 사용된 필드는 부서이다 ‘ ’ .","이지원은 총무부이며 통근거리는 이다 ‘ ’ ‘25’ .",""]},{"n":37,"s":2,"a":2,"p":"- 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 37. 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는 데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단 어놓기 Windows 10 (Drag & Drop) 기능을 이용하여 할 수 있는 작업으로 옳지 않은 것은? 파일을 마우스로 선택한 후 동일한 드라이브의 다른 폴더로","c":["끌어서 놓으면 이동이 된다. 파일을 마우스로 선택한 후 다른 드라이브의 임의의 폴더로","끌어서 놓으면 복사가 된다. 파일을 마우스로 선택한 후 을 누른 채 동일한 드라이브 [Ctrl]","의 다른 폴더로 끌어서 놓으면 복사가 된다. 에 저장되어 있는 파일을 드라이브로 끌어서 놓으면 USB C","이동이 된다."]},{"n":3,"s":1,"a":2,"p":"다음 중 의 메모장에 관한 설명으로 옳지 않은 것은 3. Windows 10 [ ] ? 텍스트 파일이나 웹 페이지를 편집하는 간단한 도구로 사용할","c":["수 있다. 이동명령으로 원하는 줄 번호를 입력하여 문서의 특정 줄로 [ ]","이동할 수 있으며자동 줄 바꿈이 설정된 경우에도 이동 명령 , 을 사용할 수 있다. 특정 문자나 단어를 찾아서 바꾸거나창 크기에 맞추어 텍스 ,","트 줄을 바꾸어 문서의 내용을 표시할 수 있다. 머리글과 바닥글을 설정하여 문서의 위쪽과 아래쪽 여백에","원하는 텍스트를 표시하여 인쇄할 수 있다."]},{"n":4,"s":1,"a":2,"p":"- 4. 다음 중 한글 에서의 프린터 설치에 관한 설명으로 Windows 10 옳지 않은 것은? 프린터를 설치하려면 설정 장치 프린터 및 스캐너 [ ] [ ] [ ]","c":["→ → 에서 프린터 또는 스캐너 추가를 선택한다 ‘ ’ . 새로운 프린터를 설치하는 과정에서 네트워크 프린터를 기본","프린터로 설정하려면 반드시 스풀링의 설정이 필요하다. 로컬 프린터 설치 시 프린터가 범용 직렬 버스모델인 USB( )","경우에는 프린터를 컴퓨터에 연결하면 에서 자동으 Windows 로 검색하고 설치한다.",""]},{"n":5,"s":1,"a":1,"p":"다음 중 5. [드라이브 조각 모음 및 최적화를 ] 수행할 수 있는 대상으로 옳은 것은? 외장 하드디스크 드라이브","c":["네트워크 드라이브","드라이브 CD-ROM","가 지원하지 않는 형식의 압축 프로그램 Windows",""]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 의 설정 네트워크 및 인터넷에 대한 Windows 10 [ ] [ ] → 설명으로 옳지 않은 것은? 현재 네트워크 상태를 확인할 수 있다.","c":["앱별 데이터 사용량을 확인할 수 있다.","사용 가능한 네트워크를 표시할 수 있다.","자동 업데이트 사용을 설정할 수 있다 Windows .",""]},{"n":7,"s":1,"a":1,"p":"다음 중 아날로그 컴퓨터와 비교하여 디지털 컴퓨터의 특징으로 7. 옳지 않은 것은? 온도전압진동 등과 같이 연속적으로 변하는 데이터를 효율 , ,","c":["적으로 처리할 수 있다. 산술 및 논리 연산을 처리하는 회로에 기반을 둔 범용 컴퓨터","로 사용된다. 데이터의 각 자리마다 혹은 의 비트로 표현한 이산적인 0 1","데이터를 처리한다. 데이터 처리를 위한 명령어들로 구성된 프로그램에 의해 동작","된다."]},{"n":8,"s":1,"a":1,"p":"다음 중 자료 구성 단위에 대한 설명으로 옳지 않은 것은 8. ? 워드 는 문자를 표현하는 최소 단위이다 (Word) .","c":["니블 은 개의 비트 가 모여 구성한 것으로 진 (Nibble) 4 (Bit) , 16","수 자리를 표현한다 1 . 레코드 는 하나 이상의 관련된 필드 가 모여서 (Record) (Field)","구성되는 자료 처리 단위이다. 필드 는 파일 구성의 최소 단위이며여러 개의 필드가 (Field) ,","모여 레코드 가 된다 (Record) ."]},{"n":9,"s":1,"a":2,"p":"- 9. 다음 중 컴퓨터에서 사용하는 유니코드 에 대한 설명으로 (Unicode) 옳지 않은 것은? 세계 각국의 언어를 통일된 방법으로 표현할 수 있게 제안된","c":["국제적인 코드 규약의 이름이다. 데이터의 원활한 교환을 위해 개의 문자를 비트로 통일하였 1 8","다. 한글은 조합형완성형옛글자 모두를 표현할 수 있다 , , .","최대 자의 글자를 코드화할 수 있다 65,536 .",""]},{"n":10,"s":1,"a":3,"p":"다음 중 에 대한 설명으로 옳은 10. RAM(Random Access Memory) 것은? 전원이 꺼져도 기억된 내용이 사라지지 않는 비휘발성 메모리","c":["로 읽기만 가능하다. 주로 펌웨어 를 저장한다 (Firmware) .","주기적으로 재충전 이 필요한 은 주기억장치 (Refresh) DRAM","로 사용된다. 컴퓨터의 기본적인 입출력 프로그램자가진단 프로그램 등이 ,","저장되어 있어 부팅 시 실행된다."]},{"n":11,"s":1,"a":2,"p":"11. 다음 중 프린터에서 출력할 파일의 해상도를 조절하거나 스캐너를 이용해 스캔한 파일의 해상도를 조절하기 위해 쓰는 단위는? PPM(Paper Per Minute)","c":["DPI(Dots Per Inch)","CPS(Character Per Second)","BPS(Bits Per Second)",""]},{"n":12,"s":1,"a":3,"p":"12. 다음 중 셋업 프로그램에서 설정할 수 없는 항목은 CMOS ? 시스템 암호 설정","c":["하드디스크의 타입","멀티 부팅 시 사용하려는 의 종류 BIOS","하드디스크나 등의 부팅 순서 USB",""]},{"n":13,"s":1,"a":2,"p":"다음 중 소프트웨어의 사용권에 따른 분류에 대한 설명으로 옳은 13. 것은? 애드웨어 정식으로 대가를 지불하고 사용하는 소프트웨어이 :","c":["다. 데모 정식 프로그램의 기능을 홍보하기 위해 사용 기간이나 :","기능을 제한하여 배포하는 프로그램이다. 벤치마크 정식 버전을 출시하기 전에 테스트 목적으로 일반 :","인에게 공개하는 프로그램이다. 셰어웨어 베타 테스트를 하기 전에 제작 회사내에서 테스트 :","할 목적으로 제작된 프로그램이다."]},{"n":14,"s":1,"a":2,"p":"14. 다음 중 컴퓨터 운영체제의 운영방식에 대한 설명으로 옳지 않은 것은? 일괄 처리는 컴퓨터에 입력하는 데이터를 일정량 또는 일정시","c":["간 동안 모았다가 한꺼번에 처리하는 방식이다. 실시간 처리는 오프라인에서 처리할 데이터가 입력될 때 마다","즉시 처리하는 방식이다. 시분할 시스템은 한 대의 시스템을 여러 사용자가 동시에 사용","하는 방식이다. 분산 처리 시스템은 여러 대의 컴퓨터들에 의해 작업한 결과를","통신망을 이용하여 상호 교환할 수 있도록 연결되어 있는 방식 이다."]},{"n":15,"s":1,"a":4,"p":"다음 중 컴퓨터 프로그래밍 언어인 언어에 대한 설명으로 15. JAVA 옳지 않은 것은? 네트워크 환경에서 분산 작업이 가능하다.","c":["멀티스레드 기능을 제공하므로 여러 작업을 동시에 처리할","수 있다. 운영체제에 관계없이 독립적으로 실행할 수 있는 프로그램을","작성할 수 있다. 수식처리를 비롯하여 기호 처리 분야에 사용되고 있으며 특히","인공 지능 분야에 널리 사용되고 있다."]},{"n":16,"s":1,"a":1,"p":"- 다음 중 네트워크의 구성 에서 망형 에 관한 설명 16. (Topology) (Mesh) 으로 옳지 않은 것은? 단말장치의 추가제거 및 기밀 보호가 어렵다 / .","c":["모든 지점의 컴퓨터와 단말장치를 서로 연결한 형태이다.","","",""]},{"n":17,"s":1,"a":4,"p":"17. 다음 중 컴퓨터 통신에서 사용하는 프로토콜 기능에 관한 설명으로 옳지 않은 것은? 통신망에 전송되는 패킷의 흐름을 제어해서 시스템 전체의","c":["안전성을 유지한다. 정보를 전송하기 위해 송수신기 사이에 같은 상태를 유지하도 ·","록 동기화 기능을 수행한다. 데이터 전송 도중에 발생하는 오류를 검출한다.","네트워크에 접속된 다양한 단말장치를 자동으로 인식하여 호","환성을 제공한다."]},{"n":18,"s":1,"a":4,"p":"다음 중 한글 에서 전자우편 사용에 관한 설명으 18. Windows (E-mail) 로 옳지 않은 것은? 전자우편 주소는 사용자 호스트 주소의 형식으로 이루 ‘ ID@ ’","c":["어진다. 전자우편에 사용하는 프로토콜은 등이 SMTP, POP3, MIME","있다. 전","자우편은 메일 서버에 사용자 계정이 있어야 사용할 수 있다. 전자우편은 기본적으로 진수 코드를 사용한다 16 EBCDIC .",""]},{"n":19,"s":1,"a":2,"p":"19. 다음 중 사물 인터넷에 대한 설명으로 옳지 않은 것은? 라고도 하며 개인 맞춤형 스마트 서 IoT(Internet of Things)","c":["비스를 지향한다. 사람을 제외한 사물과 공간데이터 등을 이더넷으로 서로 연 ,","결시켜주는 무선 통신 기술을 의미한다. 스마트 센싱 기술과 무선 통신 기술을 융합하여 실시간으로","데이터를 주고받는 기술이다. 사물 인터넷 기반 서비스는 개방형 아키텍처를 필요로 하기","때문에 정보 공유에 대한 부작용을 최소화하기 위한 정보보안 기술의 적용이 중요하다."]},{"n":20,"s":1,"a":4,"p":"정보시스템을 통하여 전자문서를 전송하기 위해서는 정보보호를 20. 위하여 보안 서비스가 필요하다다음 중 보안 서비스에 해당하지 . 않는 것은? 부인방지","c":["기밀성","무결성","확장성","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":4,"p":"21. 다음 중 아래 워크시트에서 영역의 문자열을 셀에 [B1:B3] [B4] 목록으로 표시하여 입력하기 위한 키 조작으로 옳은 것은? [Tab]+[ ]","c":["↓ [Shift]+[ ]","↓ [Ctrl]+[ ]","↓ [Alt]+[ ]","↓"]},{"n":22,"s":2,"a":4,"p":"- 22. 다음 중 데이터 입력에 대한 설명으로 옳지 않은 것은? 를 입력하면 자동으로 지수 형식으로 입력된다 3e9 .","c":["현재 날짜와 시간을 입력하려면 를 누른 다음 한칸 [Ctrl]+[;]","","",""]},{"n":23,"s":2,"a":3,"p":"23. 다음 중 아래 워크시트의 셀에서 을 입력한 후 을 [A1] 10.1 [Ctrl] 누르고 자동 채우기 핸들을 아래로 드래그한 경우 셀에 입력되 [A4] 는 값은? 10.1","c":["10.4","13.1","13.4",""]},{"n":24,"s":2,"a":1,"p":"24. 다음 중 공유된 통합 문서에 대한 설명으로 옳지 않은 것은 암호로 보호된 공유 통합 문서에서 보호를 해제하여도 통합","c":["문서의 공유 상태는 해제되지 않는다. 공유 통합 문서를 네트워크 위치에 복사해도 다른 통합 문서와","의 연결은 그대로 유지된다. 여러 사용자가 동시에 동일한 셀을 변경하려면 충돌이 발생한","다. 병합된 셀조건부 서식데이터 유효성 검사차트그림과 , , , ,","같은 일부 기능은 공유 통합 문서에서 추가하거나 변경할 수 없다."]},{"n":25,"s":2,"a":1,"p":"25. 다음 중 사용자 지정 표시 형식에 대한 설명으로 틀린 것은? 소수점 오른쪽의 자리표시자 보다 더 긴 숫자가 소수점 이하의","c":["숫자로 셀에 입력될 경우 자리표시자 만큼 소수 자릿수로 내림 된다. 양수음수 텍스트 순으로 한 번에 네 가지의 표시 형식을 , , 0,","지정할 수 있다. 각 섹션에 대한 색은 섹션의 맨 앞에 개의 색 중 하나를 대괄 8","호로 묶어 입력해야 한다. 두 개의 섹션을 지정하면 첫 번째 섹션은 양수 또는 두 0,","번째 섹션은 음수에 대한 표시 형식이다."]},{"n":26,"s":2,"a":3,"p":"다음 중 셀에 수식을 입력하는 방법에 대한 설명으로 옳지 않은 26. 것은?","c":["통합 문서의 여러 워크시트에 있는 동일한 셀 범위 데이터를 이용하려면 수식에서 차원 참조를 사용한다 3 .","계산할 셀 범위를 선택하여 수식을 입력한 후 [Ctrl]+ 를 누르면 선택한 영역에 수식을 한 번에 채울 수 [Enter] 있다.","수식을 입력한 후 결과 값이 상수로 입력되게 하려면 수식을 입력한 후 바로 를 누른다 [  (3)","있다. 이런 폼의 기본 보기 속성은 연속 폼으로 하는 것이 좋다 ‘ ’ .",""]}]},{"id":"2023-상시-04","t":"2023 상시 04","q":[{"n":1,"s":1,"a":3,"p":"다음 중 한글 의 시스템 정보에 관한 설명으로 1. Windows 10 [ ] [ ] → 옳지 않은 것은? 설치된 의 크기를 확인할 수 있다 RAM .","c":["의 설치 날짜를 확인할 수 있다 Windows .","설치된 운영체제를 비트에서 비트로 변경할 수 있다 32 64 .","컴퓨터의 이름을 확인하거나 변경할 수 있다.",""]},{"n":2,"s":1,"a":4,"p":"2. 다음 중 의 레지스트리 에 관한 설명으로 Windows 10 (Registry) 옳지 않은 것은? 작업 표시줄의 검색 상자에 를 입력하여 레지스트리 ‘regedit’","c":["편집기를 실행할 수 있다. 레지스트리 편집기를 사용하면 레지스트리 폴더 및 각 레지스","트리 파일에 대한 설정을 볼 수 있다. 레지스트리 편집기에서 내보내기를 이용하여 레지스트리를 [ ]","백업할 수 있다. 레지스트리의 정보는 수정할 수는 있으나 삭제는 할 수 없어","언제든지 레지스트리 복원이 가능하다."]},{"n":3,"s":1,"a":4,"p":"3. 다음 중 에 연결된 컴퓨터에서 고정 주소로 인터넷에 접속하 LAN IP 기 위해 설정해야 할 인터넷 프로토콜 항목으로 옳지 (TCP/IP) 않은 것은? 기본 게이트웨이","c":["서브넷 마스크","주소 IP","서버 주소 DHCP",""]},{"n":4,"s":1,"a":1,"p":"4. 다음 중 컴퓨터에서 사용하는 자료의 표현에 관한 설명으로 옳지 않은 것은? 실수형 데이터는 정해진 크기에 부호 와 가수부 로 (1bit) (7bit)","c":["구분하여 표현한다. 진 정수 데이터는 실수 데이터 보다 표현할 수 있는 범위가 2","작으며 연산 속도는 빠르다. 숫자 데이터 표현 중 진 연산을 위하여 팩 과 언팩 10 “ (Pack)","표현 방식이 사용된다 (Unpack)” . 컴퓨터에서 뺄셈을 수행하기 위해서는 보수와 덧셈 연산을","이용한다."]},{"n":5,"s":1,"a":4,"p":"- 다음 중 컴퓨터에서 문자를 표현하는 코드 체계에 대한 설명으로 5. 옳지 않은 것은? 코드는 가지의 문자를 표현할 수 있으나 영문 소문자 BCD 64","c":["는 표현 불가능하다. 코드는 코드를 확장한 코드체계로 가지의 EBCDIC BCD 256","문자를 표현할 수 있다.","",""]},{"n":6,"s":1,"a":3,"p":"다음 중 컴퓨터에서 사용하는 가상 메모리에 관한 설명으로 옳은 6. 것은? 중앙처리장치와 주기억장치 사이에 위치하여 컴퓨터의 처리","c":["속도를 향상 시키는 역할을 한다. 가 데이터를 처리하는 동안 미리 가 필요로 하는 데 CPU CPU","이터를 저장해 두는 기억장치이다. 보조기억장치의 일부를 주기억장치처럼 사용하는 메모리 사","용 기법으로 주기억장치 보다 큰 프로그램을 로드하여 실행할 경우에 유용하다. 디스크와 같은 보조기억장치의 기억 공간을 가상으로 확장하","는 기억장치이다."]},{"n":7,"s":1,"a":3,"p":"다음 중 프린터에 관한 설명으로 옳지 않은 것은 7. 3D ? 입력한 도면을 바탕으로 차원 입체 물품을 만들어 내는 프린 3","c":["터이다. 인쇄 원리는 잉크를 종이 표면에 분사하여 이미지를 인쇄 2D","하는 잉크젯 프린터의 원리와 같다. 출력 단위로는 등이 사용된다 IPM, PPM .","기계건축예술우주 등 많은 분야에서 응용되고 있으며 , , , ,","의료 분야에서도 활발히 활용되고 있다."]},{"n":8,"s":1,"a":2,"p":"다음 중 소프트웨어의 사용권에 따른 분류에 대한 설명으로 옳지 8. 않은 것은? 번들 특정한 하드웨어나 소프트웨어를 구매하였을 때 포함하 :","c":["여 주는 소프트웨어이다. 셰어웨어 정식 버전이 출시되기 전에 프로그램에 대한 일반 :","인의 평가를 받기 위해 제작된 소프트웨어이다. 애드웨어 배너 광고를 보는 대가로 무료로 사용하는 소프트 :","웨어이다. 프리웨어 돈을 내지 않고도 사용가능하고 다른 사람에게 :","전달해 줄 수 있는 소프트웨어이다."]},{"n":9,"s":1,"a":3,"p":"- 9. 다음 중 임베디드 시스템에 관한 설명으로 옳은 것은? 지역적으로 다른 위치에 있는 여러 대의 컴퓨터를 연결하여","c":["분산 처리하는 시스템이다. 처리할 데이터를 일정시간 동안 모아서 일괄 처리하는 방식의","시스템이다. 특정 기능을 수행하기 위하여 전체 장치의 일부분으로 내장되","는 전자 시스템이다. 두 개의 가 동시에 같은 업무를 처리하는 방식으로 업무 CPU","의 신뢰도를 높이는 작업에 이용된다."]},{"n":10,"s":1,"a":3,"p":"다음 중 컴퓨터 프로그래밍 언어에 대한 설명으로 옳지 않은 것은 10. ? 객체 지향 언어는 동작보다는 객체논리보다는 자료를 바탕으 ,","c":["로 구성된 객체 지향 프로그래밍 언어이다. 문제 중심 언어는 처리 방법이나 절차보다는 해결하려는 문제","에 중심을 두고 프로그램할 수 있는 언어로서비절차적이며 , 대화식으로 구성된다. 고급 언어는 번역 과정이 없어 보다 편리하게 프로그래밍 할","수 있다. 절차 중심 언어는 정해진 문법에 맞게 일련의 처리 절차를","순서대로 기술해 나가는 언어이다."]},{"n":11,"s":1,"a":3,"p":"다음 중 네트워크 관련 장비로 브리지 에 관한 설명으로 11. (Bridge) 옳지 않은 것은? 두 개의 근거리 통신망을 상호 접속할 수 있도록 하는 통신망","c":["연결 장치이다. 통신량을 조절하여 데이터가 다른 곳으로 가지 않도록 한다.","참조 모델의 물리 계층에 속한다 OSI .","통신 프로토콜을 변환하지 않고도 네트워크를 확장한다.",""]},{"n":12,"s":1,"a":2,"p":"다음 중 인트라넷 에 대한 설명으로 옳은 것은 12. (Intranet) ? 여러 대의 컴퓨터를 연결하여 하나의 서버로 사용하는 기술이","c":["다. 인터넷 기술을 이용하여 조직 내의 각종 업무를 수행할 수","있도록 만든 네트워크 환경이다. 이동 전화 단말기에서 개인용 컴퓨터의 운영체제와 같은 역할","을 하는 소프트웨어이다. 기업체가 협력업체와 고객 간의 정보 공유를 목적으로 구성한","네트워크이다."]},{"n":13,"s":1,"a":3,"p":"다음 중 인터넷 주소 체계에서 에 관한 설명으로 옳은 것은 13. IPv6 ? 주소 체계는 등 세 가지로 나뉜 Unicast, Anycast, Broadcast","c":["다. 비트씩 부분으로 총 비트로 구성되며주소의 각 부분 16 8 128 ,","은 세미콜론 으로 구분한다 (;) . 인증성기밀성데이터 무결성의 지원으로 보안성이 강화되었 , ,","다. 와 비교하였을 때 자료 전송 속도가 늦지만주소의 확장 IPv4 ,","성과 융통성이 우수하다."]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 정보 보안을 위한 비밀키 암호화 기법에 대한 설명으로 옳지 않은 것은? 비밀키 암호화 기법의 안전성은 키의 길이 및 키의 비밀성","c":["유지 여부에 영향을 많이 받는다. 암호화와 복호화 시 사용하는 키가 동일한 암호화 기법이다.","복잡한 알고리즘으로 인해 암호화와 복호화 속도가 느리다.","사용자가 증가할 경우 상대적으로 관리해야 할 키의 수가 많아","진다."]},{"n":15,"s":1,"a":1,"p":"- 15. 다음 중 컴퓨터에서 사용하는 압축 프로그램에 관한 설명으로 옳지 않은 것은? 압축한 파일을 모아 재압축을 반복하면 파일 크기를 계속 줄일","c":["수 있다. 여러 개의 파일을 압축하면 하나의 파일로 생성되어 파일 관리","를 용이하게 할 수 있다. 대부분의 압축 프로그램에는 분할 압축이나 암호 설정 기능이","있다. 파일의 전송시간과 비용을 절약하고디스크 공간을 효율적으 ,","로 사용할 수 있다."]},{"n":16,"s":1,"a":1,"p":"다음 중 그래픽 데이터 형식에 관한 설명으로 옳지 않은 것은 16. ? 운영체제의 표준 비트맵 파일 형식으로 압축 BMP : Windows","c":["하여 저장하므로 파일의 크기가 작은 편이다. 인터넷 표준 그래픽 형식으로 비트 컬러를 사용하여 GIF : 8","최대 색상까지만 표현할 수 있으며애니메이션 표현이 256 , 가능하다. 사진과 같은 선명한 정지 영상 압축 기술에 대한 국제 JPEG :","표준으로 주로 인터넷에서 그림 전송에 사용된다. 트루 컬러의 지원과 투명색 지정이 가능하다 PNG : .",""]},{"n":17,"s":1,"a":1,"p":"다음 중 컴퓨터 통신과 관련하여 방식에 관한 설명으로 옳은 17. P2P 것은? 인터넷에서 이루어지는 개인 대 개인의 파일 공유를 위한 기술","c":["이다. 인터넷을 통해 를 제공해 주는 기술 및 서비스이다 MP3 .","인터넷을 통해 동영상을 상영해 주는 기술 및 서비스이다.","여러 사용자가 동시에 온라인 게임을 할 수 있도록 제공해","주는 기술이다."]},{"n":18,"s":1,"a":3,"p":"다음 중 저작권법에 대한 설명으로 가장 적절하지 않은 것은 18. ? 저작권법은 저작자의 권리를 보호함을 목적으로 한다.","c":["원저작물을 번역편곡변형 등의 방법으로 작성한 차적 저 , , 2","작물도 독자적인 저작물로서 보호된다. 프로그램을 작성하기 위하여 사용하고 있는 프로그램 언어와","해법에도 적용된다. 저작 재산권이 있는 소프트웨어를 복사하여 판매한 경우 저작","권법에 저촉된다."]},{"n":19,"s":1,"a":2,"p":"다음 중 에 대한 설명으로 옳은 것은 19. DoS(Denial of Service) ? 네트워크 주변을 지나다니는 패킷을 엿보면서 계정과 패스워","c":["드를 알아내는 행위이다. 대량의 데이터를 한 곳의 서버에 집중적으로 전송함으로써,","서버의 정상적인 기능을 방해하는 것이다. 정상적인 기능을 하는 프로그램으로 가장하여 프로그램 내에","숨어 있다가 해당 프로그램이 동작할 때 활성화되어 부작용을 일으키는 것이다. 서비스 기술자나 유지보수 프로그래머들의 액세스 편의를 위","해 만든 보안이 제거된 비밀통로이다."]},{"n":20,"s":1,"a":2,"p":"다음 중 휴대폰을 모뎀처럼 활용하는 방법으로컴퓨터나 노트북 20. , 등의 기기를 휴대폰에 연결하여 무선 인터넷을 사용할 수 있게 IT 하는 기능은? 와이파이","c":["테더링","블루투스","와이브로","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"다음 중 이름 상자에 대한 설명으로 옳지 않은 것은 21. ? 을 누르고 여러 개의 셀을 선택한 경우 마지막 선택한 [Ctrl]","c":["셀 주소가 표시된다. 셀이나 셀 범위에 이름을 정의해 놓은 경우 이름이 표시된다.","차트가 선택되어 있는 경우 차트의 종류가 표시된다.","수식을 작성 중인 경우 최근 사용한 함수 목록이 표시된다.",""]},{"n":22,"s":2,"a":2,"p":"- 다음 중 공유 통합 문서에 대한 설명으로 옳지 않은 것은 22. ? 여러 사용자가 동시에 동일한 셀을 변경하려면 충돌이 발생한","c":["다. 통합 문서를 공유한 후 하이퍼링크시나리오매크로 등의 , ,","","",""]},{"n":23,"s":2,"a":3,"p":"다음 중 찾기 및 바꾸기대화상자에 대한 설명으로 옳지 않은 23. [ ] 것은? 문서에서 찾을 내용에 입력한 내용과 일치하는 이전 항목을 ‘ ’","c":["찾으려면 를 누른 상태에서 다음 찾기단추를 클릭한 [Shift] [ ] 다. 찾을 내용에 입력한 문자만 있는 셀을 검색하려면 전체 셀 ‘ ’ ‘","내용 일치를 선택한다 ’ . 별표 물음표 및 물결표 등의 문자가 포함된 내용을 (*), (?) (~)","찾으려면 찾을 내용에 작은따옴표 뒤에 해당 문자를 붙여 ‘ ’ (’) 입력한다. 찾을 내용을 워크시트에서 검색할지 전체 통합 문서에서 검색","할지 등을 선택하려면 범위에서 시트또는 통합 문서를 ‘ ’ ‘ ’ ‘ ’ 선택한다."]},{"n":24,"s":2,"a":3,"p":"다음 중 시트 보호에 대한 설명으로 옳지 않은 것은 24. ? 시트 보호 설정 시 암호를 설정할 수 있다.","c":["시트 보호는 통합 문서 전체가 아닌 특정 시트만을 보호한다.","시트 보호를 실행하면 시트의 삽입삭제이동숨기기이름 , , , ,","바꾸기 등의 작업을 할 수 없다. 시트 보호를 설정하면 셀에 데이터를 입력하거나 수정하려고","했을 때 경고 메시지가 나타난다."]},{"n":25,"s":2,"a":3,"p":"- 25. 다음과 같이 영역에 판매량이 이상이고 상태가 [A2:E10] ‘ ’ 40 , ‘ ’ 양호면 배경색을 노랑으로 설정하는 조건부 서식을 지정하려 “ ” ‘ ’ [ ] 고 한다다음 중 조건부 서식의 수식 입력란에 입력해야 할 . [ ] 수식으로 옳은 것은? 양호 =OR($D2>=40, $C2=“ ”)","c":["양호 =OR(D$2>=40, C$2=“ ”)","양호 =AND($D2>=40, $C2=“ ”)","양호 =AND(D$2>=40, C$2=“ ”)",""]},{"n":26,"s":2,"a":1,"p":"다음 중 참조의 대상 범위로 사용하는 이름 정의 시 이름의 지정 26. 방법에 대한 설명으로 옳지 않은 것은? 처럼 셀 주소와 같은 형태의 이름을 사용할 수 있다 ‘A1’ .","c":["이름의 첫 글자는 문자나 밑줄 만 쓸 수 있고나머지 글자는 (_) ,","문자숫자밑줄 마침표 를 사용할 수 있다 , , (_), (.) . 같은 통합 문서에서 동일한 이름을 중복하여 사용할 수 없다.","이름 상자의 화살표 단추를 누르고 정의된 이름 중 하나를","클릭하면 해당 셀 또는 셀 범위가 선택된다."]},{"n":27,"s":2,"a":2,"p":"27. 다음 워크시트에서 영역에 월요일부터 금요일까지 모두 [G3:G6] 출석 하면 우수 그렇지 않으면 빈칸을 표시하려고 할 때 옳은 ( ) “ ”, √ 수식은? 우수 =IF(COUNT(B3:F3)=5, “ ”, “ ”)","c":["우수 =IF(COUNTA(B3:F3)=5, “ ”, “ ”)","우수 =IF(NOT(COUNTBLANK(B3:F3)=5), “ ”, “ ”)","우수 =IF(COUNTIF(B3:F3, “ ”)=5, “ ”, “ ”)",""]},{"n":28,"s":2,"a":3,"p":"28. 다음 중 아래 시트에서 변경 전내용을 변경 후와 같이 변경하는 < > < > 수식으로 옳은 것은? =SUBSTITUTE(A2, “136”, “36”, 1)","c":["=SUBSTITUTE(A2, “136”, “36”, 2)","=SUBSTITUTE(A2, “36”, “136”, 1)","=SUBSTITUTE(A2, “36”, “136”, 2)",""]},{"n":29,"s":2,"a":3,"p":"29. 아래 시트에서 영역을 선택한 후 배열 수식으로 한 번에 [C2:E5] 금액을 구하려고 한다다음 중 이를 위한 수식으로 옳은 것은 . ? 금액 수량 단가 ( = * ) {=B2*C1:E1}","c":["{=B2*C1:B5*E5}","{=B2:B5*C1:E1}","={B2:B5*C1:E1}",""]},{"n":30,"s":2,"a":3,"p":"- 30. 다음 중 각 차트 종류에 대한 설명으로 적절하지 않은 것은? 주식형 고가저가종가 등의 주식 거래 가격을 바탕으로 : , ,","c":["차트를 작성한다. 분산형 차트 여러 데이터 계열에 있는 숫자 값 사이의 관계를 :","보여 주거나 두 개의 숫자 그룹을 좌표로 이루어진 하나의 xy 계열로 표시할 때 사용된다. 거품형 데이터 값이 두 개인 경우에만 사용할 수 있으며 :","첫번째 값이 축두 번째 값이 데이터 표식의 크기로 사용된다 X , . 표면형 차트 두 개의 데이터 집합에서 최적의 조합을 찾을 :","때 사용된다."]},{"n":31,"s":2,"a":3,"p":"아래의 시트에서 영역에 영역의 표를 참조하는 31. [I2:I5] [B2:E14] 배열 수식을 사용하여 지점별 총대출금액을 구하였다다음 중 . 영역을 블록으로 지정한 후 수식을 입력할 경우 수식 입력줄 [ 셈을 수행하기 위해 입력된 값을 보수로 변환하는 보수기","가 있다 (Complementor) . 연산 결과를 일시적으로 저장하는 누산기 가 있 (Accumulator)","다. 연산에 사용될 데이터를 기억하는 상태 레지스터(Status","가 있다 Register) ."]},{"n":2,"s":1,"a":4,"p":"다음 중 인터넷 보안을 위한 해결책으로 사용되는 암호화 기법에 2. 대한 설명으로 옳지 않은 것은? 비밀키 암호화 기법은 동일한 키로 데이터를 암호화하고 복호","c":["화한다. 비밀키 암호화 기법은 대칭키 암호화 기법 또는 단일키 암호화","기법이라고도 하며 대표적으로 , DES(Data Encryption 가 있다 Standard) . 공개키 암호화 기법은 비대칭 암호화 기법이라고도 하며대표 ,","적인 암호화 방식으로 가 있 RSA(Rivest, Shamir, Adleman) 다. 공개키 암호화 기법에서는 암호화할 때 사용하는 키는 비밀로","하고복호화 할 때 사용하는 키는 공개하는 방식을 사용한다 , ."]},{"n":3,"s":1,"a":1,"p":"다음 중 컴퓨터에서 사용하는 자료의 외부적 표현 방식에 관한 3. 설명으로 옳은 것은? 는 데이터 통신용이나 개인용 컴퓨터에서 사용하며 ASCII ,","c":["가지의 문자를 표현할 수 있다 128 . 는 비트로 구성되어 있으며하나의 문자를 표현할 수 BCD 8 ,","있다. 는 대형 컴퓨터에서 사용되는 범용 코드이며 비트 EBCDIC , 6","로 구성되어 있다. 는 국제 표준 코드로 최대 가지의 문자 표현이 Unicode 256","가능하다."]},{"n":4,"s":1,"a":3,"p":"- 통신 기술과 그리고 컴퓨터에 저장된 데이터베이스를 이용하 4. GPS, 여 주변의 위치와 부가 서비스를 제공하는 기술은? 사물 인터넷(IoT)","c":["빅 데이터(Big Data)","위치 기반 서비스(LBS)","시맨틱 웹(Semantic Web)",""]},{"n":5,"s":1,"a":4,"p":"다음 중 시스템 복구를 해야 하는 시기로 가장 적절하지 않은 5. 것은? 새 장치를 설치한 후 시스템이 불안정 할 때","c":["로그온 화면이 나타나지 않으며운영체제를 시작할 수 없을 ,","때 누락되거나 손상된 데이터 파일을 이전 버전으로 되돌리고자","할 때 파일의 단편화를 개선하여 디스크의 접근 속도를 향상시키고","자 할 때"]},{"n":6,"s":1,"a":3,"p":"다음 중 의 레지스트리에 관한 설명으로 옳지 않은 것은 6. Windows ? 의 자체 구성 정보를 저장하는 데이터베이스이다 Windows .","c":["에 탑재된 레지스트리 편집기는 이다 Windows ‘regedit.exe’ .","레지스트리 정보는 의 부팅 시에만 참조된다 Windows .","레지스트리에는 각 사용자의 프로필과 시스템 하드웨어설 ,","치된 프로그램 및 속성 설정에 대한 정보가 들어 있다."]},{"n":7,"s":1,"a":2,"p":"다음 중 인터넷과 관련하여 스트리밍 기술에 관한 7. (Streaming) 설명으로 옳은 것은? 정지 화상의 프레임에서 중복되는 정보를 삭제하여 데이터를","c":["압축하는 기술이다. 네트워크를 통해 대용량의 멀티미디어 데이터 파일을 다운","받을 때 사용자가 전체 파일을 다운 받을 때까지 기다릴 필요 없이 전송되는 대로 재생시키는 기술이다. 하이퍼텍스트와 멀티미디어를 통합한 개념으로 문자뿐만 아","니라 그래픽사운드동영상 등의 정보를 연결해 놓은 미디어 , , 통합 기술이다. 카메라로 촬영한 아날로그 영상을 디지털 영상으로 변환캡 ,","처하여 편집저장 시키는 기술이다 , ."]},{"n":8,"s":1,"a":1,"p":"다음 중 자료 구성 단위에 대한 설명으로 옳지 않은 것은 8. ? 워드 는 문자를 표현하는 최소 단위이다 (Word) .","c":["니","블 은 개의 비트 가 모여 개의 니블을 구성한다 (Nibble) 4 (Bit) 1 . 레코드 는 하나 이상의 관련된 필드가 모여서 구성되 (Record)","는 자료 처리 단위이다. 필드 는 파일 구성의 최소 단위이며여러 개의 필드가 (Field) ,","모여 레코드 가 된다 (Record) ."]},{"n":9,"s":1,"a":2,"p":"- 다음 중 의 메모장에 관한 설명으로 옳지 않은 것은 9. Windows 10 [ ] ? 텍스트 파일이나 웹 페이지를 편집하는 간단한 도구로 사용할","c":["수 있다. 이동명령으로 원하는 줄 번호를 입력하여 문서의 특정 줄로 [ ]","이동할 수 있으며자동 줄 바꿈이 설정된 경우에도 이동 명령 , 을 사용할 수 있다. 특정 문자나 단어를 찾아서 바꾸거나창 크기에 맞추어 텍스 ,","트 줄을 바꾸어 문서의 내용을 표시할 수 있다. 머리글과 바닥글을 설정하여 문서의 위쪽과 아래쪽 여백에","원하는 텍스트를 표시하여 인쇄할 수 있다."]},{"n":10,"s":1,"a":1,"p":"다음 중 아날로그 컴퓨터와 비교하여 디지털 컴퓨터의 특징으로 10. 옳지 않은 것은? 온도전압진동 등과 같이 연속적으로 변하는 데이터를 효율 , ,","c":["적으로 처리할 수 있다. 산술 및 논리 연산을 처리하는 회로에 기반을 둔 범용 컴퓨터","로 사용된다. 데이터의 각 자리마다 혹은 의 비트로 표현한 이산적인 0 1","데이터를 처리한다. 데이터 처리를 위한 명령어들로 구성된 프로그램에 의해 동작","된다."]},{"n":11,"s":1,"a":3,"p":"다음 중 한글 의 인쇄 작업에 대한 설명으로 옳지 11. Windows 10 않은 것은? 여러 개의 출력 파일들의 출력대기 상태를 확인할 수 있다.","c":["여러 개의 출력 파일들이 출력대기 할 때 출력 순서를 임의로","조정할 수 있다. 일단 프린터에서 인쇄 작업에 들어간 것은 프린터 전원을 끄기","전에는 강제로 종료시킬 수 없다. 인쇄 중인 문서나 오류가 발생한 문서는 다른 프린터로 전송할","수 없다."]},{"n":12,"s":1,"a":4,"p":"12. 다음 중 인터넷 서비스와 관련하여 에 FTP(File Transfer Protocol) 관한 설명으로 옳지 않은 것은? 컴퓨터와 컴퓨터 사이에 파일을 주거나 받을 수 있는 원격","c":["파일 전송 프로토콜이다. 웹 브라우저에서 를 사용할 수 있다 FTP .","기본적으로 그림 파일은 모드로 텍스트 파일은 Binary ASCII","모드로 전송한다. 서버에 있는 프로그램은 접속 후에 서버에서 바로 실행 FTP","시킬 수 있다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 방화벽에 대한 설명으로 적절하지 않은 것은? 보안이 필요한 네트워크의 통로를 단일화하여 관리한다.","c":["방화벽 시스템은 내부와 외부로부터 불법적인 해킹을 완전히","차단할 수 있다. 권한이 없는 사용자가 네트워크를 통해 컴퓨터에 액세스 하는","것을 방지한다. 역추적 기능으로 외부 침입자의 흔적을 찾을 수 있다.",""]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 시스템 보안과 관련한 불법적인 형태에 대한 설명으로 옳지 않은 것은? 피싱 은 거짓 메일을 보내서 가짜 금융기관 등의 (Phishing)","c":["가짜 웹 사이트로 유인하여 정보를 빼내는 행위이다. 스푸핑 은 검증된 사람이 네트워크를 통해 데이터 (Spoofing)","를 보낸 것처럼 데이터를 변조하여 접속을 시도하는 행위이 다. 분산 서비스 거부 공격 은 마이크로소프트사의 (DDOS) MS-","를 운영체제로 사용하는 컴퓨터에 네트워크를 통해 불법 DOS 적으로 접속하는 행위이다. 키로거 는 키 입력 캐치 프로그램을 사용하여 (Key Logger)","나 암호를 알아내는 행위이다 ID ."]},{"n":15,"s":1,"a":4,"p":"- 15. 다음 중 컴퓨터 통신에서 사용하는 프록시 서버의 기능으로 (Proxy) 옳은 것은? 네트워크 병목현상 해결 기능","c":["내부 불법 해킹 차단 기능","프로토콜 연결 해제 기능 FTP","방화벽 기능과 캐시 기능",""]},{"n":16,"s":1,"a":3,"p":"16. 다음 중 셋업 프로그램에서 설정할 수 없는 항목은 CMOS ? 시스템 암호 설정","c":["하드디스크의 타입","멀티 부팅 시 사용하려는 의 종류 BIOS","하드디스크나 등의 부팅 순서 USB",""]},{"n":17,"s":1,"a":1,"p":"17. 다음 중 한글 에서 파일의 검색 기능을 향상시키기 Windows 10 위한 기능은? 색인","c":["압축","복원","백업",""]},{"n":18,"s":1,"a":2,"p":"18. 다음 중 컴퓨터에서 사용하는 멀티미디어 활용과 관련하여 서비스에 관한 설명으로 옳은 것은 VOD(Video On Demand) ? 초고속 통신망을 이용하여 먼거리에 있는 사람들과 비디오와","c":["오디오를 통해 회의를 할 수 있도록 하는 서비스이다. 다양한 영상 정보 데이터베이스를 구축하여 사용자가 요구하","는 영상 정보를 원하는 시간에 볼 수 있도록 하는 서비스이다. 다양한 장치를 통해 컴퓨터가 만들어낸 가상 세계에서 여러","다른 경험을 체험할 수 있게 하는 서비스이다. 초고속 통신망을 이용하여 의료 활동 등을 할 수 있는 서비스","이다."]},{"n":19,"s":1,"a":2,"p":"19. 다음 중 사물 인터넷에 대한 설명으로 옳지 않은 것은? 라고도 하며 개인 맞춤형 스마트 서 IoT(Internet of Things)","c":["비스를 지향한다. 사람을 제외한 사물과 공간데이터 등을 이더넷으로 서로 연 ,","결시켜주는 무선 통신 기술을 의미한다. 스마트 센싱 기술과 무선 통신 기술을 융합하여 실시간으로","데이터를 주고받는 기술이다. 사물 인터넷 기반 서비스는 개방형 아키텍처를 필요로 하기","때문에 정보 공유에 대한 부작용을 최소화하기 위한 정보보안 기술의 적용이 중요하다."]},{"n":20,"s":1,"a":1,"p":"20. 다음 중 컴퓨터에서 사용하는 압축 프로그램에 관한 설명으로 옳지 않은 것은? 압축한 파일을 모아 재압축을 반복하면 파일 크기를 계속 줄일","c":["수 있다. 여러 개의 파일을 압축하면 하나의 파일로 생성되어 파일 관리","를 용이하게 할 수 있다. 대부분의 압축 프로그램에는 분할 압축이나 암호 설정 기능이","있다. 파일의 전송시간과 비용을 절약하고디스크 공간을 효율적으 ,","로 사용할 수 있다. 제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":2,"p":"21. 다음 중 워크시트의 이름 작성에 관한 설명으로 옳지 않은 것은? 시트 탭의 시트 이름을 더블클릭하여 이름을 수정할 수 있다.","c":["시트 이름은 영문 기준으로 대소문자 구분 없이 최대 자 · 255","까지 지정할 수 있다. 하나의 통합 문서 안에서는 동일한 시트 이름을 지정할 수","없다. 시트 이름 입력 시 등의 기호는 입력되지 않는다 *, ?, /, [ ] .",""]},{"n":22,"s":2,"a":3,"p":"- 22. 다음 중 셀에 입력된 데이터에 사용자 지정 표시 형식을 설정한 후의 표시 결과로 옳은 것은? 0.25 0#.#% 0.25%","c":["→ → 0.57 #.# 0.6","→ →","",""]},{"n":23,"s":2,"a":3,"p":"23. 다음 중 셀에 수식을 입력하는 방법에 대한 설명으로 옳지 않은 것은? 수식에서 통합 문서의 여러 워크시트에 있는 동일한 셀 범위","c":["데이터를 이용하려면 차원 참조를 사용한다 3 . 계산할 셀 범위를 선택하여 수식을 입력한 후 [Ctrl]+[Enter]","를 누르면 선택한 영역에 수식을 한 번에 채울 수 있다. 수식을 입력한 후 결과값이 수식이 아닌 상수로 입력되게 하려","면 수식을 입력한 후 바로 를 누른다 [Alt]+[F9] . 배열 상수에는 숫자나 텍스트 외에 등의 ‘TRUE’, ‘FALSE’","논리값 또는 와 같은 오류 값도 포함될 수 있다 ‘#N/A’ ."]},{"n":24,"s":2,"a":1,"p":"24. 다음 중 부분합에 대한 설명으로 옳지 않은 것은? 다중 함수를 이용하는 중첩 부분합을 작성하려면 부분합대 ‘ ’","c":["화상자에서 매번 새로운 값으로 대치항목을 선택해야 한다 ‘ ’ . 부분합을 제거하면 부분합과 함께 목록에 삽입된 개요 및 페이","지 나누기도 제거된다. 세부 정보가 있는 행 아래에 요약 행을 지정하려면 데이터 ‘","아래에 요약 표시항목을 선택한다 ’ . 중첩 부분합은 이미 작성된 부분합 그룹 내에 새로운 부분합","그룹을 추가하는 것이다."]},{"n":25,"s":2,"a":2,"p":"25. 다음 중 데이터가 입력된 셀에서 채우기 핸들을 드래그하여 데이터 를 채우는 경우에 대한 설명으로 옳은 것은? 일반적인 문자 데이터나 날짜 데이터는 그대로 복사되어 채워","c":["진다. 개의 숫자와 문자가 조합된 텍스트 데이터는 숫자만 씩 증 1 1","가하고 문자는 그대로 복사되어 채워진다. 숫자 데이터는 씩 증가하면서 채워진다 1 .","숫자가 입력된 두 셀을 블록 설정하여 채우기 핸들을 드래그하","면 두 숫자가 반복하여 채워진다."]},{"n":26,"s":2,"a":1,"p":"26. 다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은? 피벗 테이블 보고서를 작성한 후 원본 데이터를 수정하면 피벗","c":["테이블 보고서에 자동으로 반영된다. 피벗 테이블 필드에서 보고서에 추가할 필드 선택 시 데이터 [ ]","형식이 텍스트이거나 논리값인 필드를 선택하여 행 영역에 추가한다. 값 영역에 추가된 필드가 개 이상이면 값 필드가 열 또는 2","Σ 행 영역에 추가된다. 열 레이블행 레이블 단추를 클릭하여 레이블 필터나 값 필터 /","를 설정할 수 있다."]},{"n":27,"s":2,"a":3,"p":"- 다음 그림과 같이 표기능을 사용하여 이자율에 따른 이자액을 27. “ ” 계산하려고 한다이때 실행하여야 할 작업 내용에 대한 설명으로 . 옳지 않은 것은? 데이터 테이블대화상자가 표시되면 행 입력 셀은 ‘ ’ “ ” [B3]","c":["셀과 열 입력 셀은 셀을 지정한 후 확인을 선택한 , “ ” [A3] < > 다.","","",""]},{"n":28,"s":2,"a":4,"p":"아래 워크시트에서 매출액 을 이용하여 매출 구간별 빈도수 28. [B3:B9] 를 영역에 계산한 후 그 값만큼 를 반복하여 표시하고 [F3:F6] “ ” ★ 고자 한다다음 중 이를 위한 수식으로 옳은 것은 . ? =REPT(“ ”, FREQUENCY(E3:E6, B3:B9))","c":["★ =REPT(“ ”, FREQUENCY(B3:B9, E3:E6))","★ {=REPT(“ ”, FREQUENCY(E3:E6, B3:B9))}","★ {=REPT(“ ”, FREQUENCY(B3:B9, E3:E6))}","★"]},{"n":29,"s":2,"a":2,"p":"29. 다음 중 워크시트 이름으로 적절하지 않은 것은? 매출실적 _","c":["매출실적?","매출실적 #","매출실적&",""]},{"n":30,"s":2,"a":1,"p":"30. 아래 워크시트에서 단가표 를 이용하여 단가 를 [A10:D13] [C2:C7] 배열수식으로 계산하고자 한다다음 중 셀에 입력된 수식으 . [C2] 로 옳은 것은? =INDEX($B$12:$D$13, MATCH(A2,$A$12:$A$13, 0), M","c":["ATCH(B2, $B$10:$D$10, 1)) =INDEX($B$12:$D$13, MATCH(A2, $A$12:$A$13, 1), M","ATCH(B2, $B$10:$D$10, 0)) =INDEX(MATCH(A2, $A$12:$A$13, 0), MATCH(B2, $B$","10:$D$10, 1), $B$12:$D$13) =INDEX(MATCH(A2, $A$12:$A$13, 1), MATCH(B2, $B$","10:$D$10, 0), $B$12:$D$13)"]},{"n":31,"s":2,"a":2,"p":"- 다음 중 워크시트에 데이터를 입력하는 방법에 대한 설명으로 31. 옳지 않은 것은? 날짜 데이터를 입력하면 기본적으로 셀의 오른쪽에 정렬된다.","c":["과 같이 입력하면 기본적으로 셀의 오른쪽에 정렬된다 ‘3 .","수식 또는 함수 식을 입력할 때는 기호를 수 있다. 긴 텍스트 형식에는 짧은 텍스트와 비슷하나 최대 자까지 255","입력 가능하다. 하이퍼링크 형식에는 웹 사이트나 파일의 특정 위치로 바로","이동하는 주소 데이터를 입력할 수 있다."]},{"n":54,"s":3,"a":2,"p":"다음 중 위쪽 구역에 데이터시트를 표시하는 열 형식의 폼을 만들고 54. , 아래쪽 구역에 선택한 레코드에 대한 정보를 수정하거나 입력할 수 있는 데이터시트 형식의 폼을 자동으로 만들어 주는 도구는? 폼","c":["폼 분할","여러 항목","폼 디자인",""]},{"n":55,"s":3,"a":4,"p":"다음 중 관계 데이터베이스에 대한 설명으로 옳지 않은 것은 55. ? 관계 데이터베이스는 테이블의 형태로 데이터를 관리한다.","c":["기본키는 레코드를 식별하는 유일한 값을 갖는 필드이다.","외래키 필드는 다른 테이블의 기본키나 유일성 속성 (Unique)","을 갖는 필드를 참조한다. 일종의 그래프 형태로 계층 데이터베이스 모델이 확장된 형태","이다."]},{"n":56,"s":3,"a":1,"p":"- 다음 중 정규화에 대한 설명으로 옳지 않은 것은 56. ? 정규화를 통해 테이블 간의 종속성을 높이기 위한 것이다.","c":["대체로 더 작은 필드를 갖는 테이블로 분해하는 과정이다.","데이터 중복을 최소화하기 위한 작업이다.","추가갱신삭제 등 작업 시의 이상 현상이 발생하 , , (Anomaly)","지 않도록 하기 위한 것이다."]},{"n":57,"s":3,"a":2,"p":"다음 매출 테이블에 대한 함수 적용 결과로 틀린 것은 57. < > ? 매출 < > 순번 수량 금액 1 10 4000 2 20 5000 3 10 4500 4 Null 3500 5 10 4600 금액 =Count([ ]) 5","c":["→ 수량 =Avg([ ]) 10","→ 금액 =Max([ ]) 5000","→ 수량 =Sum([ ]) 50","→"]},{"n":58,"s":3,"a":1,"p":"다음 중 매크로 함수에 대한 설명으로 옳지 않은 것은 58. ? 조건에 맞는 모든 레코드를 검색한다 FindRecord : .","c":["테이블이나 쿼리로부터 레코드를 필터링한다 ApplyFilter : .","작성된 보고서를 호출하여 실행한다 OpenReport : .","메시지 상자를 통해 경고나 알림 등의 정보를 MessageBox :","표시한다."]},{"n":59,"s":3,"a":1,"p":"다음 중 개체 관계 모델링에 관한 것으로 옳지 59. (Entity Relationship) 않은 것은? 데이터베이스에 표현하려는 것으로사람이 생각하는 개념이 ,","c":["나 정보 단위 같은 물리적인 현실 세계의 대상체를 속성 이라고 한다 (Attribute) . 개체 타입 과 이들 간의 관계 타입 (Entity Type) (Relationship","을 이용해 현실 세계를 개념적으로 표현한다 Type) . 모델에서는 데이터를 개체 관계 E-R (Entity), (Relationship),","속성 으로 묘사한다 (Attribute) . 모델은 특정 를 고려한 것은 아니다 E-R DBMS .",""]},{"n":60,"s":3,"a":1,"p":"- 다음 중 보고서의 시작 부분에 한 번만 표시되며 일반적으로 회사의 60. 로고나 제목 등을 표시하는 구역은? 보고서 머리글","c":["페이지 머리글","그룹 머리글","그룹 바닥글",""]}]},{"id":"2024-상시-02","t":"2024 상시 02","q":[{"n":1,"s":1,"a":3,"p":"1. 다음 중 컴퓨터의 소프트웨어 관련 용어에 대한 설명으로 옳지 않은 것은? 셰어웨어 는 일정기간 무료 사용 후 원하면 정식 (Shareware)","c":["프로그램을 구입할 수 있는 형태의 프로그램이다. 프리웨어 는 누구나 자유롭게 사용할 수 있는 프로 (Freeware)","그램으로 기간 및 기능에 제한이 없다. 패치 프로그램 은 기능을 알리기 위해 기간이 (Patch Program)","나 기능에 제한을 두어 무료 배포하는 프로그램이다. 베타버전 은 정식 프로그램을 발표하기 전에 (Beta Version)","프로그램의 문제 발견이나 기능 향상을 위해 무료로 배포하는 프로그램이다."]},{"n":2,"s":1,"a":3,"p":"2. 다음 중 한글 의 폴더 옵션창에서 설정할 수 있는 Windows 10 [ ] 작업으로 옳지 않은 것은? 숨김 파일이나 폴더의 표시 여부를 지정할 수 있다.","c":["알려진 파일 형식의 파일 확장명을 숨기도록 설정할 수 있다.","탐색 창미리 보기 창세부 정보 창의 표시 여부를 선택할 , ,","수 있다. 폴더에서 시스템 파일을 검색할 때 색인의 사용 여부를 선택할","수 있다."]},{"n":3,"s":1,"a":1,"p":"다음 중 컴퓨터 통신과 관련하여 방식에 관한 설명으로 옳은 3. P2P 것은? 인터넷에서 이루어지는 개인 대 개인의 파일 공유를 위한 기","c":["술이다. 인터넷을 통해 를 제공해 주는 기술 및 서비스이다 MP3 .","인터넷을 통해 동영상을 상영해 주는 기술 및 서비스이다.","여러 사용자가 동시에 온라인 게임을 할 수 있도록 제공해","주는 기술이다."]},{"n":4,"s":1,"a":2,"p":"- 다음 중 컴퓨터에서 사용하는 가상 메모리에 관한 설명으로 옳은 4. 것은? 중앙처리장치와 주기억장치 사이에 위치하여 컴퓨터의 처리","c":["속도를 향상 시키는 역할을 한다. 보조기억장치의 일부를 주기억장치처럼 사용하는 메모리 사","용 기법으로 주기억장치 보다 큰 프로그램을 로드하여 실행 할 경우에 유용하다. 가 데이터를 처리하는 동안 미리 가 필요로 하는 CPU CPU","데이터를 저장해 두는 기억장치이다. 디스크와 같은 보조기억장치의 기억 공간을 가상으로 확장하",""]},{"n":5,"s":1,"a":2,"p":"5. 다음 중 프린터에서 출력할 파일의 해상도를 조절하거나 스캐너를 이용해 스캔한 파일의 해상도를 조절하기 위해 쓰는 단위는? PPM(Paper Per Minute)","c":["DPI(Dots Per Inch)","CPS(Character Per Second)","BPS(Bits Per Second)",""]},{"n":6,"s":1,"a":4,"p":"다음 중 컴퓨터의 하드디스크와 관련하여 6. RAID(Redundant Array 기술에 관한 설명으로 옳지 않은 것은 of Inexpensive Disks) ? 여러 개의 하드디스크를 모아서 하나의 하드디스크처럼 사용","c":["할 수 있도록 하는 기술이다. 하드디스크의 모음뿐만 아니라 자동으로 복제해 백업 정책을","구현해 주는 기술이다. 미러링과 스트라이핑 기술을 결합하여 안정성과 속도를 향상","시킨 디스크 연결 기술이다. 하드디스크 스캐너 등을 통합적으로 연결해 주는 , CD-ROM,","기술이다."]},{"n":7,"s":1,"a":3,"p":"다음 중 반도체를 이용한 컴퓨터 보조기억장치로 크기가 작고 7. 충격에 강하며소음 발생이 없는 대용량 저장장치는 , ? HDD(Hard Disk Drive)","c":["DVD(Digital Versatile Disk)","SSD(Solid State Drive)","CD-RW(Compact Disc Rewritable)",""]},{"n":8,"s":1,"a":3,"p":"8. 다음 중 파일의 크기를 결정하는 요소에 해당하지 않는 것은 mp3 ? 재생 방식(Mono, Stereo)","c":["샘플 크기(Bit)","프레임 너비(Pixel)","표본 추출률(Hz)",""]},{"n":9,"s":1,"a":3,"p":"다음 중 바이러스 감염 증상에 대한 설명으로 옳지 않은 것은 9. ? 특정 날짜가 되면 화면에 이상한 메시지가 표시된다.","c":["디스크를 인식하지 못하거나디스크 볼륨명이 변경될 수도 ,","있다. 파일의 크기가 작아지고프로그램의 실행 속도가 빨라진다 , .","시스템 파일이 손상되어 부팅 이 정상적으로 수행되 (Booting)","지 않는다."]},{"n":10,"s":1,"a":1,"p":"- 다음 중 한글 의 시스템 정보에 관한 설명으로 10. Windows 10 [ ] [ ] → 옳지 않은 것은? 설치된 운영체제를 비트에서 비트로 변경할 수 있다 32 64 .","c":["컴퓨터의 이름을 확인하거나 변경할 수 있다.","설치된 의 크기를 확인할 수 있다 RAM .","의 설치 날짜를 확인할 수 있다 Windows .",""]},{"n":11,"s":1,"a":1,"p":"11. 다음 중 컴퓨터 그래픽과 관련하여 벡터 이미지에 관한 (Vector) 설명으로 옳지 않은 것은? 픽셀로 이미지를 표현하며래스터 이미지라고도 한 , (Raster)","c":["다. 점을 연결하는 직선이나 곡선을 이용하여 이미지를 구성한다.","대표적인 파일 형식에는 등이 있다 AI, WMF .","이미지의 크기를 확대하여도 화질에 손상이 없다.",""]},{"n":12,"s":1,"a":2,"p":"12. 다음 중 컴퓨터 메인보드의 버스 에 관한 설명으로 옳지 않은 (Bus) 것은? 컴퓨터에서 데이터를 주고받는 통로로 사용 용도에 따라 내부","c":["버스외부 버스확장 버스로 구분된다 , , . 내부 버스는 와 주변장치 간의 데이터 전송에 사용되는 CPU","통로이다. 외부 버스는 전달하는 신호의 형태에 따라 데이터 버스주소 ,","버스제어 버스로 구분된다 , . 확장 버스는 메인보드에서 지원하는 기능 외에 다른 기능을","지원하는 장치를 연결하는 부분으로 끼울 수 있는 형태이기에 확장 슬롯이라고도 한다."]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 에 대한 설명으로 옳지 IPv6(Internet Protocol Version 6) 않은 것은? 주소는 진수의 숫자를 콜론 으로 구분하여 표시한 IPv6 16 (:)","c":["다. 의 주소는 비트로 표시된다 IPv6 IP 64 .","실시간 흐름 제어로 향상된 멀티미디어 기능을 지원한다.","의 한계를 극복하기 위해서 출현하였다 IPv4 .",""]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 정보 보안을 위한 비밀키 암호화 기법에 대한 설명으로 옳지 않은 것은? 비밀키 암호화 기법의 안전성은 키의 길이 및 키의 비밀성","c":["유지 여부에 영향을 많이 받는다. 암호화와 복호화 시 사용하는 키가 동일한 암호화 기법이다.","복잡한 알고리즘으로 인해 암호화와 복호화 속도가 느리다.","사용자가 증가할 경우 상대적으로 관리해야 할 키의 수가 많","아진다."]},{"n":15,"s":1,"a":2,"p":"15. 다음 중 한글 의 글꼴에 관한 설명으로 옳지 않은 Windows 10 [ ] 것은? 글꼴에는 기울임꼴굵게굵게 기울임꼴과 같은 글꼴 스타일 , ,","c":["이 있다. 글꼴 파일은 또는 의 확장자를 가지고 있다 .rtf .inf .","글꼴과 글꼴을 제공하며프린터 및 TrueType OpenType ,","앱에서 작동한다. 시스템에서 사용하는 글꼴은 폴더에 C:\\Windows\\Fonts","파일 형태로 저장되어 있다."]},{"n":16,"s":1,"a":2,"p":"- 16. 다음 중 컴퓨터 운영체제의 운영방식에 대한 설명으로 옳지 않은 것은? 일괄 처리는 컴퓨터에 입력하는 데이터를 일정량 또는 일정시","c":["간 동안 모았다가 한꺼번에 처리하는 방식이다. 실시간 처리는 오프라인에서 처리할 데이터가 입력될 때 마다","즉시 처리하는 방식이다. 시분할 시스템은 한 대의 시스템을 여러 사용자가 동시에 사","용하는 방식이다. 분산 처리 시스템은 여러 대의 컴퓨터들에 의해 작업한 결과","를 통신망을 이용하여 상호 교환할 수 있도록 연결되어 있는 방식이다."]},{"n":17,"s":1,"a":4,"p":"17. 다음 중 한글 에서 하드디스크의 용량 부족 문제가 Windows 10 발생하였을 때의 해결 방법으로 적절하지 않은 것은? 휴지통 비우기를 수행한다 [ ] .","c":["디스크 정리를 통해 임시 파일들을 삭제한다 [ ] .","사용하지 않는 응용 프로그램을 삭제한다.","드라이브 조각 모음 및 최적화를 수행한다.",""]},{"n":18,"s":1,"a":4,"p":"18. 다음 중 의 레지스트리 에 관한 설명으로 Windows 10 (Registry) 옳지 않은 것은? 작업 표시줄의 검색 상자에 를 입력하여 레지스트리 ‘regedit’","c":["편집기를 실행할 수 있다. 레지스트리 편집기를 사용하면 레지스트리 폴더 및 각 레지스","트리 파일에 대한 설정을 볼 수 있다. 레지스트리 편집기에서 내보내기를 이용하여 레지스트리를 [ ]","백업할 수 있다. 레지스트리의 정보는 수정할 수는 있으나 삭제는 할 수 없어","언제든지 레지스트리 복원이 가능하다."]},{"n":19,"s":1,"a":3,"p":"19. 다음 중 공공기관 등에서 터치 패널을 이용하여 운영되는 무인 종합 정보 단말기는? 주문형 비디오(VOD)","c":["화상회의 시스템(VCS)","키오스크(Kiosk)","CAI(Computer Assisted Instruction)",""]},{"n":20,"s":1,"a":1,"p":"20. 다음 중 한글 에서 설치된 하드웨어를 확인하거나 Windows 10 제거할 수 있는 창으로 옳은 것은? 장치 관리자 창 [ ]","c":["레지스트리 편집 창 [ ]","작업 관리자 창 [ ]","하드웨어 추가제거 창 [ / ]","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"21. 다음 중 피벗 테이블 보고서와 피벗 차트 보고서에 대한 설명으로 옳지 않은 것은? 피벗 테이블 보고서에서는 값 영역에 표시된 데이터 일부를","c":["삭제하거나 추가할 수 없다. 피벗 차트 보고서를 만들 때마다 동일한 데이터로 관련된 피벗","테이블 보고서가 자동으로 생성된다. 피벗 차트 보고서는 분산형주식형거품형 등 다양한 차트 , ,","종류로 변경할 수 있다. 행 또는 열 레이블에서의 데이터 정렬은 수동항목을 끌어 (","다시 정렬 오름차순내림차순 중 선택할 수 있다 ), , ."]},{"n":22,"s":2,"a":2,"p":"- 22. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단계에 포함되지 않는다. 개인용 매크로 통합 문서에 저장한 매크로는 엑셀을 시작할","때마다 자동으로 로드되므로 다른 통합 문서에서도 실행할 수 있다."]},{"n":23,"s":2,"a":1,"p":"23. 다음 중 수식의 결과가 나머지 셋과 다른 것은? =ABS(INT(-3/2))","c":["=MOD(-3, 2)","=ROUNDUP(RAND( ), 0)","=FACT(1.9)",""]},{"n":24,"s":2,"a":2,"p":"24. 다음 중 엑셀의 화면 확대축소 작업에 관한 설명으로 옳지 않은 / 것은? 문서의 확대축소는 에서 까지 설정할 수 있다 / 10% 400% .","c":["설정한 확대축소 배율은 통합 문서의 모든 시트에 자동으로 /","적용된다. 화면의 확대축소는 단지 화면에서 보이는 상태만을 확대축 / /","소하는 것으로 인쇄 시 적용되지 않는다. 을 누른 채 마우스의 스크롤을 위로 올리면 화면이 확대 [Ctrl]","되고아래로 내리면 화면이 축소된다 , ."]},{"n":25,"s":2,"a":3,"p":"25. 다음 중 이름 상자에 대한 설명으로 옳지 않은 것은? 을 누르고 여러 개의 셀을 선택한 경우 마지막 선택한 [Ctrl]","c":["셀 주소가 표시된다. 셀이나 셀 범위에 이름을 정의해 놓은 경우 이름이 표시된다.","차트가 선택되어 있는 경우 차트의 종류가 표시된다.","수식을 작성 중인 경우 최근 사용한 함수 목록이 표시된다.",""]},{"n":26,"s":2,"a":4,"p":"26. 다음 중 자동 필터와 고급 필터에 대한 설명으로 옳은 것은? 자동 필터는 각 열에 입력된 데이터의 종류가 혼합되어 있는","c":["경우 날짜숫자텍스트 필터가 모두 표시된다 , , . 고급 필터는 조건을 수식으로 작성할 수 있으며조건의 첫 ,","셀은 반드시 필드명으로 입력해야 한다. 자동 필터에서 여러 필드에 조건을 설정한 경우 필드간은 OR","조건으로 처리되어 결과가 표시된다. 고급 필터는 필터링 한 결과를 원하는 위치에 별도의 표로","생성할 수 있다."]},{"n":27,"s":2,"a":1,"p":"다음 중 아래 조건을 처리하는 셀 서식의 사용자 지정 표시 형식으로 27. 옳은 것은? 셀의 값이 이상이면 파랑 미만 이상 1000 ‘ ’, 1000 500 이면 빨강 미만이면 색을 지정하지 않고각 조건 ‘ ’, 500 , 에 대해 천단위 구분 기호 와 소수 이하 첫째 자리까지 (,) 표시한다. 표시 예 [ : 1234.56 1,234.6, 432 432.0] → → 파랑 빨강 [ ][>=1000]#,##0.0;[ ][>=500]#,##0.0;#,##0.0","c":["파랑 빨강 [ ][>=1000]#,###.#;[ ][>=500]#,###.#;#,###.#","파랑 빨강 [>=1000]< >#,##0.0;[>=500]< >#,##0.0;#,##0.0","","파랑 빨강 [>=1000]< >#,###.#;[>=500]< >#,###.#;#,###.#"]},{"n":28,"s":2,"a":3,"p":"- 다음 중 찾기 및 바꾸기대화상자에 대한 설명으로 옳지 않은 28. [ ] 것은? 문서에서 찾을 내용에 입력한 내용과 일치하는 이전 항목을 ‘ ’","c":["찾으려면 를 누른 상태에서 다음 찾기단추를 클릭한 [Shift] [ ] 다.","","",""]},{"n":29,"s":2,"a":2,"p":"다음 중 아래 시트에서 각 수식을 실행했을 때의 결과 값으로 29. 옳지 않은 것은? =EOMONTH(A1,-3) 2020-12-31","c":["→ =DAYS(A1,A3) 36","→ =NETWORKDAYS(A1,A2) 11","→ =WORKDAY(A1,10) 2021-03-19","→"]},{"n":30,"s":2,"a":2,"p":"다음 중 아래 시트에서 고급 필터 기능을 이용하여 점수가 전체 30. 평균보다 크면서 성별이 남인 데이터를 추출하려고 할 때고급 “ ” , 필터의 조건식으로 옳은 것은?","c":["","","",""]},{"n":31,"s":2,"a":4,"p":"- 31. 다음 중 아래 워크시트에서 영역의 문자열을 셀에 [B1:B3] [B4] 목록으로 표시하여 입력하기 위한 키 조작으로 옳은 것은? [Tab] + [ ]","c":["↓ [Shift] + [ ]","↓ [Ctrl] + [ ]","↓ [Alt] + [ ]","↓"]},{"n":32,"s":2,"a":2,"p":"다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 32. [ ] ? 페이지탭에서 자동 맞춤의 용지 너비와 용지 높이를 각각 [ ] ‘ ’","c":["로 지정하면 여러 페이지가 한 페이지에 인쇄된다 1 . 머리글바닥글의 여백은 머리글바닥글탭에서 머리글 [ / ] [ / ] ‘ ’","과 바닥글의 여백을 단위로 지정할 수 있다 ‘ ’ mm . 여백탭에서 페이지 가운데 맞춤의 가로 및 세로를 체크 [ ] ‘ ’","하면 인쇄 내용이 용지의 가운데에 맞춰 인쇄된다. 시트 탭에서 눈금선의 표시 여부를 지정할 수 있다 [ ] ‘ ’ .",""]},{"n":33,"s":2,"a":4,"p":"33. 다음 중 아래 차트에 대한 설명으로 옳지 않은 것은? 판매 현황이라는 차트 제목이 표시되어 있다 ‘ ’ .","c":["수량계열을 보조 축으로 지정하였다 ‘ ’ .","데이터 테이블에 범례 표지가 표시되어 있다.","수량계열에 데이터 레이블이 가운데로 표시되어 있다 ‘ ’ ‘ ’ .",""]},{"n":34,"s":2,"a":2,"p":"34. 다음 중 정렬에 대한 설명으로 옳지 않은 것은? 표 스타일이 적용된 데  데이터 처리를 전담","한다. 모든 단말기가 동등한 계층으로 연결되어 모두 클라이언트와","서버 역할을 할 수 있다. 단방향 통신 방식으로 데이터 처리를 위한 대기시간이 필요하","다."]},{"n":2,"s":1,"a":3,"p":"2. 다음 중 한글 의 레지스트리에 관한 설명으로 옳지 Windows 10 않은 것은? 컴퓨터에 설치된 모든 하드웨어와 소프트웨어의 실행정보를","c":["관리하는 데이터베이스이다. 레지스트리 정보는 가 작동하는 동안 지속적으로 참 Windows","조된다. 에 탑재된 레지스트리 편집기는 이다 Windows ‘reg.exe’ .","레","지스트리에 문제가 발생하면 시스템 부팅이 안 될 수도 있다."]},{"n":3,"s":1,"a":1,"p":"3. 다음 중 마이크로프로세서 에 관한 설명으로 옳지 (Microprocessor) 않은 것은? 제어장치연산장치주기억장치가 하나의 반도체 칩에 내장된 , ,","c":["장치이다. 클럭 주파수와 내부 버스의 폭 으로 성능을 평가 (Bandwidth)","한다. 개인용 컴퓨터의 중앙처리장치로 사용된다.","작은 규모의 임베디드 시스템이나 휴대용 기기에도 사용된다.",""]},{"n":4,"s":1,"a":3,"p":"4. 다음 중 스마트폰을 모뎀처럼 활용하는 방법으로컴퓨터나 노트북 , 등의 기기를 스마트폰에 연결하여 무선 인터넷을 사용할 수 IT 있게 하는 기능은? 와이파이(WiFi)","c":["블루투스(Bluetooth)","테더링(Tethering)","와이브로(WiBro)",""]},{"n":5,"s":1,"a":3,"p":"- 5. 다음 중 한글 에서 을 사용해야 하는 작업으로 Windows 10 [Ctrl] 옳지 않은 것은? 마우스와 함께 사용하여 같은 드라이브 내의 다른 폴더로 파일","c":["이나 폴더를 복사할 때 마우스와 함께 사용하여 비연속적인 위치에 있는 여러 파일이","나 폴더를 동시에 선택할 때","",""]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 컴퓨터에서 사용하는 코드에 관한 설명으로 옳지 ASCII 않은 것은? 각 문자를 비트로 표현하며총 개의 문자 표현이 가능하 7 , 128","c":["다. 확장 코드는 비트를 사용한다 ASCII 8 .","데이터 처리 및 통신 시스템 상호 간의 정보 교환을 위해 사용","된다. 각 나라별 언어를 표현할 수 있다.",""]},{"n":7,"s":1,"a":2,"p":"7. 다음 중 컴퓨터의 펌웨어 에 관한 설명으로 옳은 것은 (Firmware) ? 주로 하드디스크에 저장되며 부팅 시 동작한다.","c":["펌웨어 업데이트만으로도 시스템의 성능을 향상시킬 수 있다.","컴퓨터 바이러스 백신과 관련이 있는 프로그램이다.","컴퓨터 연산 속도를 빠르게 도와주는 하드웨어이다.",""]},{"n":8,"s":1,"a":1,"p":"8. 다음 중 컴퓨터 통신에서 사용하는 프록시 서버의 기능으로 (Proxy) 옳은 것은? 방화벽 기능과 캐시 기능","c":["내부 불법 해킹 차단 기능","프로토콜 연결 해제 기능 FTP","네트워크 병목현상 해결 기능",""]},{"n":9,"s":1,"a":3,"p":"9. 다음 중 반도체를 이용한 컴퓨터 보조기억장치로 크기가 작고 충격에 강하며소음 발생이 없는 대용량 저장장치는 , ? HDD(Hard Disk Drive)","c":["DVD(Digital Versatile Disk)","SSD(Solid State Drive)","CD-RW(Compact Disc Rewritable)",""]},{"n":10,"s":1,"a":2,"p":"10. 다음 중 프로토콜에서 프로토콜의 개요 및 기능에 관한 TCP/IP IP 설명으로 옳은 것은? 메시지를 송수신자의 주소와 정보로 묶어 패킷 단위로 나눈 /","c":["다. 패킷 주소를 해석하고 경로를 결정하여 다음 호스트로 전송한","다. 전송 데이터의 흐름을 제어하고 데이터의 에러를 검사한다.","계층에서 전송 계층에 해당한다 OSI 7 .",""]},{"n":11,"s":1,"a":3,"p":"- 11. 다음 중 시스템 보안을 위해 사용하는 방화벽 에 대한 (Firewall) 설명으로 적절하지 않은 것은? 주소 및 포트 번호를 이용하거나 사용자 인증을 기반으로 IP","c":["접속을 차단하여 네트워크의 출입로를 단일화한다. 명백히 허용되지 않은 것은 금지한다라는 적극적 방어 개념 ‘ ’","을 가지고 있다.","",""]},{"n":12,"s":1,"a":3,"p":"12. 다음 중 프린터에 관한 설명으로 옳지 않은 것은 3D ? 입력한 도면을 바탕으로 차원 입체 물품을 만들어 내는 프린 3","c":["터이다. 인쇄 원리는 잉크젯 프린터의 인쇄 원리와 같다.","출력 단위로는 등이 사용된다 IPM, PPM .","기계건축예술의료 분야 등에서 활용되고 있다 , , , .",""]},{"n":13,"s":1,"a":1,"p":"13. 다음 중 컴퓨터에서 사용하는 자료의 표현에 관한 설명으로 옳지 않은 것은? 실수형 데이터는 정해진 크기에 부호 와 가수부 로 (1bit) (7bit)","c":["구분하여 표현한다. 진 정수 데이터는 실수 데이터 보다 표현할 수 있는 범위가 2","작으며 연산 속도는 빠르다. 숫자 데이터 표현 중 진 연산을 위하여 팩 과 언팩 10 “ (Pack)","표현 방식이 사용된다 (Unpack)” . 컴퓨터에서 뺄셈을 수행하기 위해서는 보수와 덧셈 연산을","이용한다."]},{"n":14,"s":1,"a":3,"p":"14. 다음 중 한글 의 시스템 정보에 관한 설명으로 Windows 10 [ ] [ ] → 옳지 않은 것은? 설치된 의 크기를 확인할 수 있다 RAM .","c":["의 설치 날짜를 확인할 수 있다 Windows .","설치된 운영체제를 비트에서 비트로 변경할 수 있다 32 64 .","컴퓨터의 이름을 확인하거나 변경할 수 있다.",""]},{"n":15,"s":1,"a":3,"p":"15. 다음 중 바이러스 감염 증상에 대한 설명으로 옳지 않은 것은? 특정 날짜가 되면 화면에 이상한 메시지가 표시된다.","c":["디스크를 인식하지 못하거나디스크 볼륨명이 변경될 수도 ,","있다. 파일의 크기가 작아지고프로그램의 실행 속도가 빨라진다 , .","시스템 파일이 손상되어 부팅 이 정상적으로 수행되 (Booting)","지 않는다."]},{"n":16,"s":1,"a":1,"p":"16. 다음 중 자료 구성 단위에 대한 설명으로 옳지 않은 것은? 워드 는 문자를 표현하는 최소 단위이다 (Word) .","c":["니블 은 개의 비트 가 모여 개의 니블을 구성한 (Nibble) 4 (Bit) 1","다. 레코드 는 하나 이상의 관련된 필드가 모여서 구성되 (Record)","는 자료 처리 단위이다. 필드 는 파일 구성의 최소 단위이며여러 개의 필드가 (Field) ,","모여 레코드 가 된다 (Record) ."]},{"n":17,"s":1,"a":2,"p":"17. 다음 중 인터넷 통신 장비인 라우터 에 대한 설명으로 옳은 (Router) 것은? 두 개의 근거리 통신망을 상호 접속할 수 있도록 하는 통신망","c":["연결 장치이다. 서로 다른 네트워크 간에 자료가 전송될 최적의 경로를 찾아","준다. 장거리 전송을 위하여 전송 신호를 재생시키거나 출력 전압을","높여 준다. 주로 에서 다른 네트워크에 데이터를 보내거나 다른 네트 LAN","워크로부터 데이터를 받아들이는데 사용된다."]},{"n":18,"s":1,"a":4,"p":"- 18. 다음 중 한글 에서 전자우편 사용에 관한 설명으 Windows (E-mail) 로 옳지 않은 것은? 전자우편 주소는 사용자 호스트 주소의 형식으로 이루 ‘ ID@ ’","c":["어진다.","","",""]},{"n":19,"s":1,"a":4,"p":"19. 다음 중 프로그래밍 기법에 대한 설명으로 옳지 않은 것은? 구조적 프로그래밍 입력과 출력이 각각 하나씩 이루어진 :","c":["구조로순서선택반복의 가지 논리 구조를 사용하는 기법 , , , 3 이다. 절차적 프로그래밍 지정된 문법 규칙에 따라 일련의 처리 :","절차를 순서대로 기술해 나가는 프로그래밍 기법이다. 객체 지향 프로그래밍 객체를 중심으로 한 프로그래밍 기법 :","으로소프트웨어의 재사용과 유지보수가 용이하다 , . 비주얼 프로그래밍 기호화된 아이콘 형태를 문자 방식의 :","명령어로 바꿔 프로그래밍 하는 기법이다."]},{"n":20,"s":1,"a":3,"p":"20. 다음 중 에 대한 설명으로 옳지 않은 것은 RAID ? 여러 개의 하드디스크를 모아서 하나의 하드디스크처럼 사용","c":["할 수 있도록 하는 기술이다. 를 사용하면 데이터 복구가 용이하며속도도 빨라진다 RAID , .","의 구성 방식을 이라 하고 의 숫자가 RAID RAID Level , Level","작을수록 저장장치의 신뢰성이 높고 효율성이 좋다. 주로 서버에서 사용하며데이터의 안전성이 높다 , .","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":2,"p":"21. 다음 중 페이지 레이아웃보기 상태에서 설정 가능한 설명으로 [ ] 옳지 않은 것은? 눈금자눈금선머리글 등을 표시하거나 숨길 수 있다 , , .","c":["마우스로 페이지 구분선을 클릭하여 페이지 나누기 위치를","조정할 수 있다. 기본 보기에서와 같이 셀 서식을 변경하거나 수식 작업을 할","수 있다. 머리글과 바닥글을 짝수 페이지와 홀수 페이지에 각각 다르게","지정할 수 있다."]},{"n":22,"s":2,"a":2,"p":"22. 다음 중 워크시트의 이름 작성에 관한 설명으로 옳지 않은 것은? 시트 탭의 시트 이름을 더블클릭하여 이름을 수정할 수 있다.","c":["시트 이름은 영문 기준으로 대소문자 구분 없이 최대 자 · 255","까지 지정할 수 있다. 하나의 통합 문서 안에서는 동일한 시트 이름을 지정할 수","없다. 시트 이름 입력 시 등의 기호는 입력되지 않는다 *, ?, /, [ ] .",""]},{"n":23,"s":2,"a":2,"p":"- 23. 다음 중 매크로를 작성하고 사용하는 방법에 대한 설명으로 옳지 않은 것은? 매크로를 기록하는 경우 기본적으로 셀은 절대 참조로 기록되","c":["며상대 참조로 기록하고자 할 경우 상대 참조로 기록을 선 , ‘ ’ 택한 다음 매크로 기록을 실행한다. 매크로에 지정된 바로 가기 키가 엑셀 고유의 바로 가기 키와","중복될 경우 엑셀 고유의 바로 가기 키가 우선한다. 매크로를 기록하는 경우 실행하려는 작업을 완료하는데 필요","한 모든 단계가 매크로 레코더에 기록되며리본 메뉴에서의 , 탐색은 기록된 단계에 포함되지 않는다. 개인용 매크로 통합 문서에 저장한 매크로는 엑셀을 시작할","때마다 자동으로 로드되므로 다른 통합 문서에서도 실행할 수 있다."]},{"n":24,"s":2,"a":4,"p":"아래 워크시트에서 성취도 는 성취율 을 로 24. [C2:C6] [B2:B6] 10% 나눈 값만큼 표시한 것으로성취율이 를 초과하면 를 , 70% “ ” , ■ 그 외는 을 반복하여 표시하였다다음 중 이를 위한 수식으로 “ ” . □ 옳은 것은? =REPLACE(QUOTIENT(B2, 10%), IF(B2>70%, “ ”, “ ”","c":["■ □ )) =REPT(QUOTIENT(B2, 10%), IF(B2>70%, “ ”, “ ”))","■ □ =REPLACE(IF(B2>70%, “ ”, “ ”), QUOTIENT(B2,","■ □ 10%)) =REPT(IF(B2>70%, “ ”, “ ”), QUOTIENT(B2, 10%))","■ □"]},{"n":25,"s":2,"a":1,"p":"25. 다음 중 부분합에 대한 설명으로 옳지 않은 것은? 다중 함수를 이용하는 중첩 부분합을 작성하려면 부분합대 ‘ ’","c":["화상자에서 매번 새로운 값으로 대치항목을 선택해야 한다 ‘ ’ . 부분합을 제거하면 부분합과 함께 목록에 삽입된 개요 및 페이","지 나누기도 제거된다. 세부 정보가 있는 행 아래에 요약 행을 지정하려면 데이터 ‘","아래에 요약 표시항목을 선택한다 ’ . 중첩 부분합은 이미 작성된 부분합 그룹 내에 새로운 부분합","그룹을 추가하는 것이다."]},{"n":26,"s":2,"a":1,"p":"다음 중 아래 조건을 처리하는 셀 서식의 사용자 지정 표시 형식으로 26. 옳은 것은? 셀의 값이 이상이면 파랑 미만 이상이 1000 ‘ ’, 1000 500 면 빨강 미만이면 색을 지정하지 않고 각 조건에 ‘ ’, 500 , 대해 천단위 구분 기호 와 소수 이하 첫째 자리까지 표 (,) 시한다. 표시 예 [ : 1234.56 1,234.6, 432 432.0] → → 파랑 빨강 [ ][>=1000]#,##0.0;[ ][>=500]#,##0.0;#,##0.0","c":["파랑 빨강 [ ][>=1000]#,###.#;[ ][>=500]#,###.#;#,###.#","파랑 빨강 [>=1000]< >#,##0.0;[>=500]< >#,##0.0;#,##0.0","","파랑 빨강 [>=1000]< >#,###.#;[>=500]< >#,###.#;#,###.#"]},{"n":27,"s":2,"a":2,"p":"27. 다음 중 엑셀의 화면 확대축소 작업에 관한 설명으로 옳지 않은 / 것은? 문서의 확대축소는 에서 까지 설정할 수 있다 / 10% 400% .","c":["설정한 확대축소 배율은 통합 문서의 모든 시트에 자동으로 /","적용된다. 화면의 확대축소는 단지 화면에서 보이는 상태만을 확대축 / /","소하는 것으로 인쇄 시 적용되지 않는다. 을 누른 채 마우스의 스크롤을 위로 올리면 화면이 확대 [Ctrl]","되고아래로 내리면 화면이 축소된다 , ."]},{"n":28,"s":2,"a":4,"p":"- 28. 다음 중 데이터 정렬에 관한 설명으로 옳지 않은 것은? 대소문자를 구분하여 정렬할 수 있다 / .","c":["표 안에서 다른 열에는 영향을 주지 않고 선택한 한 열 내에서","만 정렬하도록 할 수 있다. 정렬 기준으로 조건부 서식 아이콘을 선택한 경우 기본 정렬 ‘ ’","순서는 위에 표시이다 ‘ ’ . 행을 기준으로 정렬하려면 정렬대화상자의 옵션에서 정 [ ] [ ]","렬 옵션의 방향을 위쪽에서 아래쪽으로 선택한다 ‘ ’ ."]},{"n":29,"s":2,"a":1,"p":"29. 다음 중 아래 그림 보기탭 창그룹의 각 명령에 대한 설명으로 [ ] [ ] 옳지 않은 것은? 새 창을 클릭하면 새로운 빈 통합 문서가 표시된다 [ ] .","c":["모두 정렬은 현재 열려 있는 통합 문서를 바둑판식계단식 [ ] , ,","가로세로 등 가지 형태로 배열한다 , 4 . 숨기기는 현재 활성화된 통합 문서 창을 보이지 않도록 숨긴 [ ]","다. 나누기를 클릭하면 워크시트를 최대 개의 창으로 분할하 [ ] 4","여 멀리 떨어져 있는 여러 부분을 한 번에 볼 수 있다."]},{"n":30,"s":2,"a":4,"p":"다음 중 아래의 영역에서 열과 열에만 배경색을 설정하 30. [A1:E5] B D 기 위한 조건부 서식의 규칙으로 옳은 것은? =MOD(COLUMNS($A1), 2)=1","c":["=MOD(COLUMNS(A$1), 2)=0","=MOD(COLUMN($A1), 2)=0","=MOD(COLUMN(A$1), 2)=0",""]},{"n":31,"s":2,"a":1,"p":"31. 다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은? 피벗 테이블 보고서를 작성한 후 원본 데이터를 수정하면 피벗","c":["테이블 보고서에 자동으로 반영된다. 피벗 테이블 필드에서 보고서에 추가할 필드 선택 시 데이터 [ ]","형식이 텍스트이거나 논리값인 필드를 선택하여 행 영역에 추가한다. 값 영역에 추가된 필드가 개 이상이면 값 필드가 열 또는 2","Σ 행 영역에 추가된다. 열 레이블행 레이블 단추를 클릭하여 레이블 필터나 값 필터 /","를 설정할 수 있다."]},{"n":32,"s":2,"a":4,"p":"32. 다음 중 워크시트 이름으로 적절하지 않은 것은? 매출실적 #","c":["매출실적 _","매출실적&","매출실적?",""]},{"n":33,"s":2,"a":2,"p":"- 33. 다음 중 고급 필터의 조건 범위를 영역으로 지정한 후 [E1:F3] 정하면 폼의 모든 영역이 반복되어 표시된다.","c":["폼에는 기본적으로 세부 구역본문이 표시되며폼 머리글바 ( ) , /","닥글페이지 머리글바닥글 구역을 표시하거나 숨길 수 있다 , / . 페이지 머리글과 바닥글은 인쇄를 위해 사용된다.","",""]},{"n":57,"s":3,"a":2,"p":"다음과 같이 제품테이블의 레코드는 모두 표시되고구매테이블 57. ‘ ’ , ‘ ’ 에서는 제품번호필드가 일치하는 레코드만 표시하는 조인 형식은 ‘ ’ 무엇인가? 내부 조인(Inner Join)","c":["왼쪽 외부 조인(Left Join)","오른쪽 외부 조인(Right Join)","카테션 곱(Cartesian Projuct Join)",""]},{"n":58,"s":3,"a":3,"p":"다음 화면에서 설정되어 있는 폼의 속성 값으로 옳지 않은 것은 58. ? 캡션 주문현황 :","c":["탐색 단추 예 :","보기 형식 단일 폼 :","레코드 선택기 예 :",""]},{"n":59,"s":3,"a":4,"p":"다음 중 아래와 같이 표시된 폼의 탐색 단추에 대한 설명으로 59. 옳지 않은 것은? ㉠ ㉡ ㉢㉣ 첫 레코드로 이동한다.","c":["㉠ 이전 레코드로 이동한다.","㉡ 마지막 레코드로 이동한다.","㉢ 이동할 레코드 번호를 입력하여 이동한다.","㉣"]},{"n":60,"s":3,"a":4,"p":"- 다음 중 액세스의 매크로에 대한 설명으로 옳지 않은 것은 60. ? 반복적으로 수행되는 작업을 자동화하여 간단히 처리할 수","c":["있도록 하는 기능이다. 매크로 함수 또는 매크로 함수 집합으로 구성되며각 매크로 ,","함수의 수행 방식을 제어하는 인수를 추가할 수 있다. 매크로를 이용하여 폼을 열고 닫거나 메시지 박스를 표시할","수도 있다. 매크로는 주로 컨트롤의 이벤트에 연결하여 사용하며폼 개체 ,","내에서만 사용할 수 있다."]}]},{"id":"2024-상시-04","t":"2024 상시 04","q":[{"n":1,"s":1,"a":4,"p":"1. 다음 중 를 구성하는 각 계층에 관한 설명으로 옳지 않은 TCP/IP 것은? 응용 계층은 응용 프로그램 간의 데이터 송수신을 담당한다.","c":["전송 계층은 호스트들 간의 신뢰성 있는 통신을 지원한다.","인터넷 계층은 데이터 전송을 위한 주소지정 및 경로 설정을","지원한다. 링크 계층은 사용자가 컴퓨터에 접근할 수 있도록 서비스를","제공한다."]},{"n":2,"s":1,"a":2,"p":"2. 다음 중 컴퓨터에서 사용되는 운영체제의 목적에 관한 설명으로 옳지 않은 것은? 일정 시간 내에 시스템이 처리하는 일의 양을 의미하는 처리","c":["능력의 향상이 요구된다. 시스템을 사용할 수 있는 사용자의 수를 의미하는 사용 가능도","의 향상이 요구된다. 시스템이 주어진 문제를 정확하게 해결하는 정도를 의미하는","신뢰도의 향상이 요구된다. 시스템에 작업을 의뢰한 시간부터 처리가 완료될 때까지 걸린","시간을 의미하는 반환 시간의 단축이 요구된다."]},{"n":3,"s":1,"a":4,"p":"3. 다음 중 컴퓨터의 에서 설정할 수 있는 항목으로 옳지 않은 CMOS 것은? 시스템 날짜와 시간","c":["칩셋 설정","부팅 순서","로그인 암호 변경 Windows",""]},{"n":4,"s":1,"a":1,"p":"4. 다음 중 컴퓨터 통신과 관련하여 방식에 관한 설명으로 옳은 P2P 것은? 인터넷에서 이루어지는 개인 대 개인의 파일 공유를 위한 기술","c":["이다. 인터넷을 통해 를 제공해 주는 기술 및 서비스이다 MP3 .","인터넷을 통해 동영상을 상영해 주는 기술 및 서비스이다.","여러 사용자가 동시에 온라인 게임을 할 수 있도록 제공해","주는 기술이다."]},{"n":5,"s":1,"a":4,"p":"- 5. 다음 중 컴퓨터 시스템에서 사용하는 가상 기억장치(Virtual 에 대한 설명으로 옳지 않은 것은 Memory) ? 보조기억장치 같은 큰 용량의 기억장치를 주기억장치처럼 사","c":["용하는 개념이다. 주기억장치의 용량보다 큰 프로그램의 실행을 가능하게 한다.","","",""]},{"n":6,"s":1,"a":3,"p":"6. 다음 중 주소 체계에 관한 설명으로 옳지 않은 것은 IPv6 ? 주소 체계의 주소 부족 문제를 해결하기 위하여 개발되 IPv4","c":["었다. 주소는 비트씩 부분으로 총 비트로 구성되어 있 IPv6 16 8 128","다. 주소는 네트워크의 크기나 호스트의 수에 따라 A, B, C, D,","클래스로 나누어진다 E . 실시간 흐름 제어로 향상된 멀티미디어 기능을 지원한다.",""]},{"n":7,"s":1,"a":4,"p":"7. 다음 중 바이러스에 대한 설명으로 옳지 않은 것은? 감염 부위에 따라 부트 바이러스와 파일 바이러스로 구분한다.","c":["사용자 몰래 스스로 복제하여 다른 프로그램을 감염시키고,","정상적인 프로그램이나 다른 데이터 파일 등을 파괴한다. 주로 복제품을 사용하거나 통신 매체를 통하여 다운받은 프로","그램에 의해 감염된다. 컴퓨터 하드웨어와 무관하게 소프트웨어에만 영향을 미친다.",""]},{"n":8,"s":1,"a":1,"p":"8. 다음 중 의 제어장치를 구성하는 레지스터에 관한 설명으로 CPU 옳지 않은 것은? 프로그램 카운터 프로그램의 실행된 명령어의 개수를 계산한 :","c":["다. 명령 레지스터 현재 실행 중인 명령을 기억한다 : .","부호기 해독된 명령에 따라 각 장치로 보낼 제어 신호를 :","생성한다. 메모리 주소 레지스터 기억장치에 입출력되는 데이터의 번지 :","를 기억한다."]},{"n":9,"s":1,"a":4,"p":"9. 다음 중 네트워크 프로토콜 의 기능에 해당하지 않는 (Protocol) 것은? 패킷 수를 조정하는 흐름 제어 기능","c":["송수신기를 같은 상태로 유지하는 동기화 기능 /","데이터 전송 도중에 발생하는 에러 검출 기능","네트워크 기반 하드웨어 연결 문제 해결 기능",""]},{"n":10,"s":1,"a":3,"p":"- 10. 다음 중 네트워크 관련 장비로 브리지 에 관한 설명으로 (Bridge) 옳지 않은 것은? 참조 모델의 데이터 링크 계층에 속한다 OSI .","c":["두 개의 근거리 통신망을 상호 접속할 수 있도록 하는 통신망","연결 장치이다. 통신 프로토콜을 변환하여 네트워크를 확장한다.","통신량을 조절하여 데이터가 다른 곳으로 가지 않도록 한다.",""]},{"n":11,"s":1,"a":2,"p":"11. 다음 중 컴퓨터에서 사용하는 그래픽 파일의 형식에 관한 설명으로 옳지 않은 것은? 는 손실 압축 기법과 무손실 압축 기법을 사용하며사용 JPEG ,","c":["자가 임의로 압축률을 지정할 수 있다. 는 에서 기본적으로 지원하는 포맷으로 압축을 BMP Windows","사용하여 파일의 크기가 작다. 는 인터넷 표준 그래픽 형식으로무손실 압축 기법을 사용 GIF ,","하여 선명한 화질을 제공한다. 는 트루 컬러의 지원과 투명색 지정이 가능하다 PNG .",""]},{"n":12,"s":1,"a":2,"p":"12. 프로그램을 실행하는 도중에 예기치 않은 상황이 발생할 경우 현재 실행중인 작업을 일시 중단하고발생된 상황을 우선 처리한 , 후 실행중이던 작업으로 복귀하여 계속 처리하는 것을 의미하는 용어는? 채널","c":["인터럽트","DMA","레지스터",""]},{"n":13,"s":1,"a":4,"p":"13. 다음 중 이미지와 그래픽에서 사용되는 비트맵 방식의 파일 형식에 관한 설명으로 옳지 않은 것은? 래스터 방식이라고도 하며 다양한 색상을 사용하므로 사실","c":["같은 이미지를 표현할 수 있다. 이미지를 확대하면 테두리가 거칠게 표현된다.","비트맵 파일 형식으로는 등이 있다 BMP, GIF, JPEG .","베지어스플라인 등의 곡선을 이용하여 이미지를 표현하므로 ,","확대축소 시 화질의 손상이 거의 없다 / ."]},{"n":14,"s":1,"a":1,"p":"14. 다음 중 아날로그 컴퓨터와 비교하여 디지털 컴퓨터의 특징으로 옳지 않은 것은? 온도전압진동 등과 같이 연속적으로 변하는 데이터를 효율 , ,","c":["적으로 처리할 수 있다. 산술 및 논리 연산을 처리하는 회로에 기반을 둔 범용 컴퓨터","로 사용된다. 데이터의 각 자리마다 혹은 의 비트로 표현한 이산적인 0 1","데이터를 처리한다. 데이터 처리를 위한 명령어들로 구성된 프로그램에 의해 동작","된다."]},{"n":15,"s":1,"a":1,"p":"15. 통신 기술과 그리고 컴퓨터에 저장된 데이터베이스를 이용하 GPS, 여 주변의 위치와 부가 서비스를 제공하는 기술은? 위치 기반 서비스(LBS)","c":["빅 데이터(Big Data)","사물 인터넷(IoT)","시맨틱 웹(Semantic Web)",""]},{"n":16,"s":1,"a":3,"p":"16. 다음 중 한글 의 관리 도구에 대한 설명으로 Windows 10 Windows 옳지 않은 것은? 시스템 정보를 실행하면 하드웨어 리소스구성 요소설치 [ ] , ,","c":["된 소프트웨어 환경 등의 정보를 알 수 있다. 리소스 모니터는 네트워크디스크메모리 사용 현황 [ ] CPU, , ,","을 실시간으로 모니터링 할 수 있다. 드라이브에 대하여 드라이브 조각 모음 및 최적화를 DVD [ ]","수행하면 시스템의 성능을 향상시킬 수 있다. 디스크 정리를 사용하면 임시 파일이나 휴지통에 있는 파일 [ ]","등을 삭제하여 디스크의 공간을 확보할 수 있다."]},{"n":17,"s":1,"a":2,"p":"- 17. 다음 중 정보 통신망의 구성 형태를 설명한 내용으로 옳지 않은 것은? 망형 은 네트워크 상의 모든 노드들이 서로 (Mesh Topology)","c":["연결되는 방식으로 특정 노드에 이상이 생겨도 전송이 가능하 다.","","",""]},{"n":18,"s":1,"a":2,"p":"18. 다음 중 의 설정 네트워크 및 인터넷에 대한 Windows 10 [ ] [ ] → 설명으로 옳지 않은 것은? 네트워크 문제를 진단하고 해결할 수 있다.","c":["컴퓨터 이름과 작업 그룹의 이름을 변경할 수 있다.","내 컴퓨터에서 사용 가능한 네트워크를 표시한다.","어댑터 옵션 변경을 통해 네트워크 어댑터의 연결 설정 [ ]","을 변경할 수 있다."]},{"n":19,"s":1,"a":4,"p":"19. 다음 중 전자우편 에 대한 설명으로 옳지 않은 것은 (E-mail) ? 한 사람이 동시에 여러 사람에게 전자우편을 보낼 수 있다.","c":["전체 회신은 받은 메일에 대한 답장을 발송자는 물론 참조인들","에게도 전송하는 기능이다. 는 로컬 서버에서 프로그램을 이용하여 전자우편을 액 IMAP","세스하기 위한 표준 프로토콜이다. 는 메일 서버에 도착한 이메일을 사용자 컴퓨터로 가져 SMTP","올 수 있도록 메일 서버에서 제공하는 프로토콜이다."]},{"n":20,"s":1,"a":1,"p":"20. 다음 중 계층 모델에서 등의 프로토콜을 OSI 7 Telnet, FTP, E-mail 포함하는 계층으로 옳은 것은? 응용 계층 (Application)","c":["트랜스포트 계층 (Transport)","물리 계층 (Physical)","데이터 링크 계층 (Data Link)","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":3,"p":"21. 다음 중 피벗 테이블 보고서와 피벗 차트 보고서에 대한 설명으로 옳지 않은 것은? 피벗 테이블 보고서에서는 값 영역에 표시된 데이터 일부를","c":["삭제하거나 추가할 수 없다. 피벗 차트 보고서를 만들 때마다 동일한 데이터로 관련된 피벗","테이블 보고서가 자동으로 생성된다. 피벗 차트 보고서는 분산형주식형거품형 등 다양한 차트 , ,","종류로 변경할 수 있다. 행 또는 열 레이블에서의 데이터 정렬은 수동항목을 끌어 (","다시 정렬 오름차순내림차순 중 선택할 수 있다 ), , ."]},{"n":22,"s":2,"a":1,"p":"- 22. 다음 중 차트에 포함할 수 있는 추세선에 대한 설명으로 옳은 것은? 추세선은 데이터의 추세를 그래픽으로 표시하고 예측 문제를","c":["분석하는데 사용된다. 차원 차트에 추세선을 표시하기 위해 차원 차트를 작성하여 3 2","추세선을 추가한 뒤에 차원으로 변환한다 3 . 지수선형로그 등 가지 추세선 유형이 있다 , , 3 .","모든 종류의 차트에 추세선을 사용할 수 있다.",""]},{"n":23,"s":2,"a":3,"p":"아래 시트에서 판매금액이 이상인 제품의 개수를 구하는 23. 3,000,000 배열 수식으로 맞는 것은 단 판매금액은 판매단가 수량이다 ? ( ‘ × ’ .) {=SUM((B2:C2*B5:C5>=3000000)*1)}","c":["{=COUNT((B2:C2*B5:C5>=3000000)*1)}","{=SUM((B2:B5*C2:C5>=3000000)*1)}","{=COUNT((B2:B5*C2:C5>=3000000)*1)}",""]},{"n":24,"s":2,"a":1,"p":"24. 다음 중 날짜 데이터의 입력에 대한 설명으로 옳은 것은? 날짜는 년 월 일을 로 시작하는 일련번호로 저장된 1900 1 1 1","c":["다. 날짜 데이터는 슬래시 나 점 또는 하이픈 으로 연월 (/) (.) (-) , ,","일을 구분하여 입력한다. 수식에서 날짜 데이터를 직접 입력할 때에는 작은따옴표 로 (‘ ’)","묶어서 입력한다. 단축키 을 누르면 오늘 날짜가 입력된다 [Ctrl]+[Alt]+[;] .",""]},{"n":25,"s":2,"a":2,"p":"25. 다음 중 셀 영역을 선택한 후 상태 표시줄의 바로 가기 메뉴인 상태 표시줄 사용자 지정에서 선택할 수 있는 자동 계산에 해당되 [ ] 지 않는 것은? 선택한 영역 중 숫자 데이터가 입력된 셀의 수","c":["선택한 영역 중 문자 데이터가 입력된 셀의 수","선택한 영역 중 데이터가 입력된 셀의 수","선택한 영역의 합계평균최소값최대값 , , ,",""]},{"n":26,"s":2,"a":2,"p":"26. 다음 중 데이터가 입력된 셀에서 채우기 핸들을 드래그하여 데이터 를 채우는 경우에 대한 설명으로 옳은 것은? 일반적인 문자 데이터나 날짜 데이터는 그대로 복사되어 채워","c":["진다. 개의 숫자와 문자가 조합된 텍스트 데이터는 숫자만 씩 증 1 1","가하고 문자는 그대로 복사되어 채워진다. 숫자 데이터는 씩 증가하면서 채워진다 1 .","숫자가 입력된 두 셀을 블록 설정하여 채우기 핸들을 드래그하","면 두 숫자가 반복하여 채워진다."]},{"n":27,"s":2,"a":4,"p":"27. 다음 중 자동 필터와 고급 필터에 대한 설명으로 옳은 것은? 자동 필터는 각 열에 입력된 데이터의 종류가 혼합되어 있는","c":["경우 날짜숫자텍스트 필터가 모두 표시된다 , , . 고급 필터는 조건을 수식으로 작성할 수 있으며조건의 첫 ,","셀은 반드시 필드명으로 입력해야 한다. 자동 필터에서 여러 필드에 조건을 설정한 경우 필드 간은","조건으로 처리되어 결과가 표시된다 OR . 고급 필터는 필터링 한 결과를 원하는 위치에 별도의 표로","생성할 수 있다."]},{"n":28,"s":2,"a":4,"p":"- 28. 셀의 값이 이상이면 이하이면 그 외는 값이 100 “ ”, -100 “ ”, ▲ ▼ 그대로 표시되는 사용자 지정 표시 형식으로 옳은 것은? 표시 예 [ ] 150 : ▲ 0 : 0 -50 : -50 -122 : ▼ [>=100]“ ”;#;[<=-100]“ ”","c":["▲ ▼ [>=100]“ ”;0;[<=-100]“ ”","▲ ▼","",""]},{"n":29,"s":2,"a":1,"p":"29. 다음 중 찾기 및 바꾸기대화상자에 대한 설명으로 옳지 않은 [ ] 것은? 찾을 내용에 수정 바꿀 내용에 변경으로 입력하고 모 ‘* *’, ‘* *’ , [","c":["두 바꾸기단추를 클릭하면 수정이라는 모든 글자를 변경 ] ‘ ’ ‘* 으로 바꾼다 *’ . 과 같은 수식을 검색하려면 찾는 위치를 수식으로 ‘=A1*B1’ ‘ ’","선택한 후 찾을 내용에 으로 입력한다 ‘=A1~*B1’ . 찾을 내용과 바꿀 내용은 입력하지 않고찾을 서식과 바꿀 ,","서식으로 설정할 수 있다. 셀 포인터 위치를 기준으로 앞에 위치한 데이터를 찾으려면","를 누른 상태에서 다음 찾기 단추를 클릭한다 [Shift] [ ] ."]},{"n":30,"s":2,"a":2,"p":"30. 다음 중 각 차트 종류에 대한 설명으로 적절하지 않은 것은? 영역형 차트 워크시트의 여러 열이나 행에 있는 데이터에서 :","c":["시간에 따른 변동의 크기를 강조하여 합계 값을 추세와 함께 살펴볼 때 사용된다. 표면형 차트 일반적인 척도를 기준으로 연속적인 데이터를 :","표시할 수 있으므로 일정 간격에 따른 데이터의 추세를 표시 할 때 사용된다. 도넛형 차트 여러 열이나 행에 있는 데이터에서 전체에 대한 :","각 부분의 관계를 비율로 나타내어 각 부분을 비교할 때 사용 된다. 분산형 차트 여러 데이터 계열에 있는 숫자 값 사이의 관계를 :","보여 주거나 두 개의 숫자 그룹을 좌표로 이루어진 하나의 xy 계열로 표시할 때 사용된다."]},{"n":31,"s":2,"a":3,"p":"31. 다음 중 아래 시나리오 관리자대화상자의 각 버튼에 대한 설명으 [ ] 로 옳지 않은 것은? 표시 선택한 시나리오에 대해 결과를 표시한다 : .","c":["편집 선택한 시나리오를 변경한다 : .","병합 시나리오 관리자에 표시된 시나리오를 병합한다 : ‘ ’ .","요약 시나리오에 대한 요약 보고서나 피벗 테이블을 작성한 :","다."]},{"n":32,"s":2,"a":3,"p":"- 32. 다음 중 머리글바닥글기능에 대한 설명으로 옳지 않은 것은 [ / ] ? 머리글이나 바닥글의 텍스트에 앰퍼샌드 문자 한 개를 포 (&)","c":["함시키려면 앰퍼샌드 문자를 두 번 입력한다 (&) . 여러 워크시트에 동일한 머리글바닥글을 한 번에 추가하려 [ / ]","","",""]},{"n":33,"s":2,"a":3,"p":"33. 다음 중 엑셀의 정렬 기능에 대한 설명으로 옳지 않은 것은? 오름차순 정렬과 내림차순 정렬 모두 빈 셀은 항상 마지막으로","c":["정렬된다. 영숫자 텍스트는 왼쪽에서 오른쪽 방향으로 문자 단위로 정렬","된다. 사용자가 정렬 옵션대화상자에서 대소문자를 구분하도록 [ ] /","변경하여오름차순으로 정렬하면 대문자가 소문자보다 우선 , 순위를 갖는다. 공백으로 시작하는 문자열은 오름차순 정렬일 때 숫자 바로","다음에 정렬되고내림차순 정렬일 때는 숫자 바로 앞에 정렬 , 된다."]},{"n":34,"s":2,"a":4,"p":"다음은 셀부터 셀의 평균을 셀에최대값을 34. [C3] [F3] [G3] , [H3] 셀에 계산한 후 영역을 블록으로 지정하고 채우기 핸들을 [G3:H3] 영역까지 드래그하여 계산하는 매크로이다다음 중 [G10:H10] . 괄호 안에 해당하는 값으로 틀린 것은 ( ) ? 매크로 Sub 1( ) Range(\"G3\").Select Selection.FormulaR1C1 = \"( )\" ⓐ Range(\"H3\").Select Selection.FormulaR1C1 = \"( )\" ⓑ Range(\"G3:H3\").Select Selection.( ) :( ), Type:=xlFillDefault ⓒ ⓓ Range(\"G3:H10\").Select End Sub =MAX(RC[-5]:RC[-2])","c":["ⓑ =AVERAGE(RC[-4]:RC[-1])","ⓐ =Range(“G3:H10”)","ⓓ Auto Destination","ⓒ"]},{"n":35,"s":2,"a":2,"p":"35. 다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 용지 방향용지 크기인쇄 품질을 설정할 수 있다 , , .","c":["머리글바닥글탭의 머리글영역에서 행열 머리글의 인쇄 ‘ / ’ ‘ ’ /","여부를 설정한다. 여백은 사용자가 직접 값을 입력할 수 있다.","워크시트에서 차트를 마우스로 선택한 후 페이지 설정메뉴 [ ]","를 선택하면 시트탭이 차트탭으로 바뀐다 , ‘ ’ ‘ ’ ."]},{"n":36,"s":2,"a":3,"p":"36. 다음 중 시트 보호 시 워크시트에서  보안성이 강화되었 , ,","다. 와 비교하였을 때 자료 전송 속도가 늦지만주소의 확장 IPv4 ,","성과 융통성이 우수하다."]},{"n":2,"s":1,"a":2,"p":"2. 프로그램을 실행하는 도중에 예기치 않은 상황이 발생할 경우 현재 실행중인 작업을 일시 중단하고발생된 상황을 우선 처리한 , 후 실행중이던 작업으로 복귀하여 계속 처리하는 것을 의미하는 용어는? 채널","c":["인터럽트","DMA","레지스터",""]},{"n":3,"s":1,"a":4,"p":"3. 다음 중 컴퓨터 보조기억장치로 사용되는 에 SSD(Solid State Drive) 관한 설명으로 옳지 않은 것은? 고속으로 데이터를 입출력할 수 있다.","c":["크기가 작고 충격에 강하다.","와 비슷하게 동작하면서 와는 달리 기계적 장치가 HDD HDD","없는 반도체를 이용하여 정보를 저장한다. 보다 저장 용량당 가격이 저렴하다 HDD .",""]},{"n":4,"s":1,"a":4,"p":"4. 다음 중 컴퓨터에서 문자를 표현하는 코드 체계에 대한 설명으로 옳지 않은 것은? 코드는 가지의 문자를 표현할 수 있으나 영문 소문자 BCD 64","c":["는 표현 불가능하다. 코드는 코드를 확장한 코드 체계로 가지의 EBCDIC BCD 256","문자를 표현할 수 있다. 는 세계 각국의 언어를 표현할 수 있다 Unicode .","확장 코드는 비트를 사용하며 가지의 문자를 표 ASCII 7 , 128","현할 수 있다."]},{"n":5,"s":1,"a":1,"p":"- 5. 통신 기술과 그리고 컴퓨터에 저장된 데이터베이스를 이용하 GPS, 여 주변의 위치와 부가 서비스를 제공하는 기술은? 위치 기반 서비스(LBS)","c":["빅 데이터(Big Data)","사물 인터넷(IoT)","시맨틱 웹(Semantic Web)",""]},{"n":6,"s":1,"a":4,"p":"6. 다음 중 에 연결된 컴퓨터에서 고정 주소로 인터넷에 접속하 LAN IP 기 위해 설정해야 할 인터넷 프로토콜 항목으로 옳지 (TCP/IP) 않은 것은? 게이트웨이 주소","c":["서브넷 마스크","주소 IP","서버 주소 DHCP",""]},{"n":7,"s":1,"a":3,"p":"7. 다음 중 파일 시스템에 관한 설명으로 옳지 않은 것은 NTFS ? 파일 및 폴더에 대한 액세스 제어를 유지하고 제한된 계정을","c":["지원한다. 파일 시스템보다 성능보안안전성이 높다 FAT32 , , .","모든 디스크 드라이브에서 사용할 수 있는 범용 파일 시스템이","다. 파일 크기는 볼륨 크기에 의해서만 제한된다.",""]},{"n":8,"s":1,"a":3,"p":"8. 다음 중 의 레지스트리에 관한 설명으로 옳지 않은 것은 Windows ? 의 자체 구성 정보를 저장하는 데이터베이스이다 Windows .","c":["에 탑재된 레지스트리 편집기는 이다 Windows ‘regedit.exe’ .","레지스트리 정보는 의 부팅 시에만 참조된다 Windows .","레지스트리에는 각 사용자의 프로필과 시스템 하드웨어설치 ,","된 프로그램 및 속성 설정에 대한 정보가 들어 있다."]},{"n":9,"s":1,"a":2,"p":"9. 다음 중 컴퓨터에서 사용하는 가상 메모리에 관한 설명으로 옳은 것은? 중앙처리장치와 주기억장치 사이에 위치하여 컴퓨터의 처리","c":["속도를 향상 시키는 역할을 한다. 보조기억장치의 일부를 주기억장치처럼 사용하는 메모리 사","용 기법으로 주기억장치 보다 큰 프로그램을 로드하여 실행할 경우에 유용하다. 가 데이터를 처리하는 동안 미리 가 필요로 하는 데 CPU CPU","이터를 저장해 두는 기억장치이다. 디스크와 같은 보조기억장치의 기억 공간을 가상으로 확장하","는 기억장치이다."]},{"n":10,"s":1,"a":2,"p":"10. 다음 중 컴퓨터 소프트웨어의 개발을 위한 객체 지향 언어에 관한 설명으로 옳지 않은 것은? 데이터와 그 데이터를 처리하는 함수를 객체로 묶어서 문제를","c":["해결하는 언어이다. 대","표적인 객체지향 언어로는 언어 등이 있다 BASIC, Pascal, C . 시스템의 확장성이 높고 정보 은폐가 용이하다.","상속캡슐화추상화다형성 등을 지원한다 , , , .",""]},{"n":11,"s":1,"a":4,"p":"- 11. 다음 중 하나의 컴퓨터에 여러 개의 중앙처리장치를 설치하여 주기억장치나 주변장치들을 공유하고신뢰성과 연산 능력을 향상 , 시키는 시스템을 의미하는 것은? 시분할 처리 시스템(Time Sharing System)","c":["다중 프로그래밍 시스템(Multi-Programming System)","듀플렉스 시스템(Duplex System)","다중 처리 시스템(Multi-Processing System)",""]},{"n":12,"s":1,"a":1,"p":"12. 다음 중 컴퓨터 그래픽과 관련하여 이미지를 표현하는 방식 중 비트맵 방식에 관한 설명으로 옳지 않은 것은 (Bitmap) ? 점과 점을 연결하는 직선이나 곡선을 이용하여 이미지를 표현","c":["하는 방식이다. 다양한 색상을 이용하기 때문에 사실적 표현이 용이하다.","이미지를 확대하면 테두리가 거칠게 표현된다.","비트맵 파일 형식으로는 등이 있다 BMP, TIF, GIF, JPEG .",""]},{"n":13,"s":1,"a":2,"p":"13. 다음 중 계층에서 각 계층의 기능에 관한 설명으로 옳지 OSI 7 않은 것은? 세션 계층 송수신측 간의 관련성을 유지하고 대화 제어를 :","c":["담당한다. 응용 계층 코드 변환데이터 암호화데이터 압축 기능을 : , ,","제공한다. 네트워크 계층 정보 교환 및 중계 기능경로 설정 기능을 : ,","제공한다. 물리 계층 전송에 필요한 두 장치 간의 실제 접속과 절단 :","등 기계적전기적기능적절차적 특성을 정의한다 , , , ."]},{"n":14,"s":1,"a":4,"p":"14. 다음 중 한글 의 휴지통에 보관된 파일을 복원하는 Windows 10 [ ] 방법으로 옳지 않은 것은? 휴지통을 열고 복원할 파일의 바로 가기 메뉴에서 잘라내기 [ ]","c":["를 선택한 후 바탕 화면의 바로 가기 메뉴에서 붙여넣기를 [ ] 선택한다. 휴지통을 열고 복원할 파일의 바로 가기 메뉴에서 복원을 [ ]","선택한다. 휴지통을 열고 복원할 파일을 선택한 후 원하는 위치로 드래그","앤 드롭한다. 휴지통의 모든 파일을 복원하려면 휴지통의 바로 가기 메뉴에","서 전체 복원하기를 선택한다 [ ] ."]},{"n":15,"s":1,"a":3,"p":"15. 다음 중 컴퓨터의 분류에 대한 설명으로 옳지 않은 것은? 컴퓨터는 처리 능력에 따른 분류데이터 취급에 따른 분류 , ,","c":["사용 용도에 따른 분류로 나눌 수 있다. 하이브리드 컴퓨터는 디지털 컴퓨터와 아날로그 컴퓨터의 장","점을 혼합하여 만든 컴퓨터이다. 컴퓨터를 데이터 취급 형태에 따라 미니 컴퓨터마이크로 컴 ,","퓨터슈퍼 컴퓨터 등으로 구분할 수 있다 , . 컴퓨터를 어떠한 목적으로 사용하느냐에 따라 범용 컴퓨터와","전용 컴퓨터로 분류할 수 있다."]},{"n":16,"s":1,"a":1,"p":"16. 다음 중 멀티미디어의 특징에 관한 설명으로 옳지 않은 것은? 용이성 각각의 분리된 매체오디오 등보다 콘텐 (Easiness) : ( )","c":["츠 제작이 용이하다. 비선형성 데이터가 일정한 방향으로 순차적으 (Non-Linear) :","로 처리되는 것이 아니라 사용자의 선택에 따라 다양한 방향 으로 처리된다. 디지털화 여러 종류의 정보를 컴퓨터로 처리하 (Digitization) :","기 위해서 디지털 방식으로 변환하여 처리한다. 상호 작용성 정보 제공자의 선택에 의해 일방적 (Interaction) :","으로 데이터가 전달되는 것이 아니라 정보 제공자와 사용자 간의 의견을 통한 상호 작용에 의해 데이터가 전달된다."]},{"n":17,"s":1,"a":4,"p":"- 17. 다음 중 네트워크 프로토콜 의 기능에 해당하지 않는 (Protocol) 것은? 패킷 수를 조정하는 흐름 제어 기능","c":["송수신기를 같은 상태로 유지하는 동기화 기능 /","데이터 전송 도중에 발생하는 에러 검출 기능","네트워크 기반 하드웨어 연결 문제 해결 기능",""]},{"n":18,"s":1,"a":3,"p":"18. 다음 중 에 대한 설명으로 옳지 않은 것은 RAID ? 여러 개의 하드디스크를 모아서 하나의 하드디스크처럼 사용","c":["할 수 있도록 하는 기술이다. 를 사용하면 데이터 복구가 용이하며속도도 빨라진다 RAID , .","의 구성 방식을 이라 하고 의 숫자가 RAID RAID Level , Level","작을수록 저장장치의 신뢰성이 높고 효율성이 좋다. 주로 서버에서 사용하며데이터의 안전성이 높다 , .",""]},{"n":19,"s":1,"a":4,"p":"19. 다음 중 컴퓨터 및 정보기기에서 사용하는 펌웨어 에 (Firmware) 관한 설명으로 옳은 것은? 주로 하드디스크의 부트 레코드 부분에 저장된다.","c":["인터프리터 방식으로 번역되어 실행된다.","운영체제의 일부로 입출력을 전담한다.","소프트웨어의 업그레이드만으로도 기능을 향상시킬 수 있다.",""]},{"n":20,"s":1,"a":3,"p":"20. 다음 중 컴퓨터의 에서 설정할 수 있는 항목으로 옳지 않은 CMOS 것은? 하드디스크의 타입","c":["하드디스크나 등의 부팅 순서 USB","멀티부팅 시 사용하려는 의 종류 BIOS","시스템 암호 설정","제과목 스프레드시트 일반 2"]},{"n":21,"s":2,"a":1,"p":"21. 다음 중 아래 설명에 해당하는 기능은? ㆍ잠긴 셀 또는 잠기지 않은 셀로 이동하거나 셀 서식을 변경하지 못하도록 막는다. ㆍ워크시트 요소를 삽입하거나 변경하는 것을 막는다. 시트 보호","c":["통합 문서 보호","통합 문서 공유","잠금",""]},{"n":22,"s":2,"a":4,"p":"22. 다음 중 아래 차트에 대한 설명으로 옳지 않은 것은? 판매 현황이라는 차트 제목이 표시되어 있다 ‘ ’ .","c":["수량계열을 보조 축으로 지정하였다 ‘ ’ .","데이터 테이블에 범례 표지가 표시되어 있다.","수량계열에 데이터 레이블이 가운데로 표시되어 있다 ‘ ’ ‘ ’ .",""]},{"n":23,"s":2,"a":2,"p":"- 23. 다음 중 정렬에 대한 설명으로 옳지 않은 것은? 표 스타일이 적용된 데이터 영역을 왼쪽에서 오른쪽 방향으로","c":["정렬하려면 정렬하기 전에 범위로 변환을 실행해야 한다 ‘ ’ . 숨겨진 행이나 열도 정렬에 포함되어 정렬된다.","숫자날짜 등과 같이 셀에 입력된 값으로 정렬할 때는 정렬 ,","기준을 셀 값으로 지정하고셀에 지정된 서식으로 정렬하려 ‘ ’ , 면 정렬 기준을 셀 색이나 글꼴 색으로 지정해야 한다 ‘ ’ ‘ ’ . 사용자 지정 목록을 사용하여 사용자가 정의한 순서대로 정렬",""]},{"n":24,"s":2,"a":3,"p":"24. 다음 중 수식과 그 실행 결과 값의 연결이 옳지 않은 것은? =DAYS(“2020-11-1”, “2020-10-1”) 31","c":["→ =ROUNDDOWN(45.6789, 2) 45.67","→ =SUMPRODUCT({1, 2, 3}, {5, 6, 7}) 32","→ =SQRT(4) * (INT(-2) + POWER(2, 3)) 12","→"]},{"n":25,"s":2,"a":2,"p":"25. 다음 중 페이지 설정대화상자에 대한 설명으로 옳지 않은 것은 [ ] ? 페이지탭에서 자동 맞춤의 용지 너비와 용지 높이를 각각 [ ] ‘ ’","c":["로 지정하면 여러 페이지가 한 페이지에 인쇄된다 1 . 머리글바닥글의 여백은 머리글바닥글탭에서 머리글 [ / ] [ / ] ‘ ’","과 바닥글의 여백을 단위로 지정할 수 있다 ‘ ’ mm . 여백탭에서 페이지 가운데 맞춤의 가로 및 세로를 체크 [ ] ‘ ’","하면 인쇄 내용이 용지의 가운데에 맞춰 인쇄된다. 시트 탭에서 눈금선의 표시 여부를 지정할 수 있다 [ ] ‘ ’ .",""]},{"n":26,"s":2,"a":3,"p":"26. 다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은? 조건부 서식의 조건은 결과가 또는 가 TRUE(1) FALSE(0)","c":["나오도록 작성한다. 같은 통합 문서의 특정 셀을 이용하여 조건을 지정할 수 있다.","수식을 이용하여 조건을 지정할 경우워크시트의 특정 셀을 ,","클릭하면 상대 참조로 작성된다. 이동 옵션을 이용하여 조건부 서식이 지정된 셀을 찾을 수","있다."]},{"n":27,"s":2,"a":3,"p":"27. 아래 워크시트에서 순위 는 총점을 기준으로 구하되 동점 [G2:G10] 자에 대해서는 국어를 기준으로 순위를 구하였다다음 중 . [G2] 셀에 입력된 수식으로 옳은 것은? {=RANK($F2, $F$2:$F$10)+RANK($B$2, $B$2:$B$10)}","c":["{=RANK($B$2, $B$2:$B$10)*RANK($F2, $F$2:$F$10)}","{=RANK($F2, $F$2:$F$10)+SUM(($F$2:$F$10=$F2)*","($B$2:$B$10>$B2))} {","=SUM(($F$2:$F$10=$F2)*($B$2:$B$10>$B2))*RANK($F2, $F$2:$F$10)}"]},{"n":28,"s":2,"a":3,"p":"- 28. 다음 조건을 이용하여 사용자 지정 표시 형식을 설정할 경우 옳은 것은? 셀의 값이 이상이면 빨강 미만 이상이면 200 ‘ ’, 200 100 파랑 미만이면 색을 지정하지 않고 천 단위 구분 ‘ ’, 100 , 기호와 소수 이하 첫째 자리까지 표시할 것 빨강 파랑 [ ][>=200]#,##0.0;[ ][>=100]#,##0.0;#,##0.0;","c":["빨강 파랑 [ ][>=200]#,##0;[ ][>=100]#,##0;#,##0;","빨강 파랑 [ ][>=200]#,##0.0;[ ][>=100]#,##0.0;#,##0.0","빨강 파랑 [ ][>=200]#,##0;[ ][>=100]#,##0;#,##0",""]},{"n":29,"s":2,"a":1,"p":"29. 다음 중 열의 글꼴 서식을 굵게로 설정하는 매크로로 옳지 A ‘ ’ 않은 것은? Range(“1:1”).Font.Bold = True","c":["Columns(“A”).Font.Bold = True","Columns(1).Font.Bold = True","Range(“A:A”).Font.Bold = True",""]},{"n":30,"s":2,"a":3,"p":"30. 다음 중 엑셀의 틀 고정에 대한 기능 설명으로 옳지 않은 것은? 틀 고정은 특정 행 또는 열을 고정할 때 사용하는 기능으로","c":["주로 표의 제목 행 또는 제목 열을 고정한 후 작업할 때 유용하다. 선택된 셀의 왼쪽 열과 바로 위의 행이 고정된다.","틀 고정 구분선을 마우스로 잡아끌어 틀 고정 구분선을 이동시","킬 수 있다. 틀 고정 방법으로 첫 행 고정을 실행하면 선택된 셀의 위치와","상관없이 첫 행이 고정된다."]},{"n":31,"s":2,"a":1,"p":"31. 다음 중 공유된 통합 문서에 대한 설명으로 옳지 않은 것은? 암호로 보호된 공유 통합 문서에서 보호를 해제하여도 통합","c":["문서의 공유 상태는 해제되지 않는다. 공유 통합 문서를 네트워크 위치에 복사해도 다른 통합 문서와","의 연결은 그대로 유지된다. 여","러 사용자가 동시에 동일한 셀을 변경하려면 충돌이 발생한다. 병합된 셀조건부 서식데이터 유효성 검사차트그림과 , , , ,","같은 일부 기능은 공유 통합 문서에서 추가하거나 변경할 수 없다."]},{"n":32,"s":2,"a":4,"p":"- 32. 다음 중 시나리오 추가대화상자에 대한 설명으로 옳지 않은 [ ] 것은? 데이터 예측 가상 분석 시나리오 관리자 [ ] [ ] [ ] [ ]","c":["→ → → 대화상자에서 추가단추를 클릭하면 표시되는 대화상자이다 [ ] . 변경 셀은 변경 요소가 되는 값의 그룹이며하나의 시나리오 ‘ ’ ,","에 최대 개까지 지정할 수 있다 32 . 설명은 시나리오에 대한 추가적인 설명으로 반드시 입력할 ‘ ’","필요는 없다. 보호된 시트에 시나리오가 추가되지 않도록 하려면 변경 금 ‘","지를 선택한다 ’ ."]},{"n":33,"s":2,"a":1,"p":"33. 다음과 같은 이벤트를 실행시켰을 때 나타나는 결과로 옳은 것은? Private Sub Worksheet_Activate( ) Range(“A1”).Select Selection.Sort Key1:=Range(“A2”), _ Order1:=xlAscending, Header:=xlGuess, _ OrderCustom:=1, MatchCase:=False, _ Orientation:=xlTopToBottom End Sub 워","c":["크시트가 활성화될 때 셀을 기준으로 오름차순 정렬한다 [A2] . 이벤트가 실행된 후에는 셀이 선택되어 있다 [A2] .","활성화 셀이 바뀔 때마다 셀을 기준으로 내림차순 정렬 [A1]","한다. 행을 기준으로 정렬한다.",""]},{"n":34,"s":2,"a":2,"p":"34. 다음 중 원형 차트에 대한 설명으로 옳은 것은? 원형 차트는 하나의 축을 가진다.","c":["원형 대 가로 막대형 차트에서는 비교적 작은 값을 누적 막대","형 차트로 결합하여 표시한다. 원형 차트에 데이터 테이블을 표시할 수 있다.","차원 원형 차트는 쪼개진 원형으로 표시할 수 없다 3 .",""]},{"n":35,"s":2,"a":2,"p":"아래 그림과 같이 워크시트에 배열 상수 형태로 배열 수식이 입력되 35. 어 있을 때 셀에서 수식 를 실행하였다다음 , [A5] =SUM(A1, B2) . 중 그 결과로 옳은 것은? 3","c":["5","6","7",""]},{"n":36,"s":2,"a":4,"p":"36. 다음 중 데이터 데이터 도구의 통합에 관한 설명으로 [ ] [ ] [ ] → 옳지 않은 것은? 여러 시트에 있는 데이터나 다른 통합 문서에 입력되어 있는","c":["데이터를 통합할 수 있다. 데이터 통합은 위치를 기준으로 통합할 수도 있고영역의 이 ,","름을 정의하여 통합할 수도 있다. 모든 참조 영역에 지정된 영역을 삭제할 수 있다 ‘ ’ .","통합할 데이터가 있는 워크시트와 통합 결과가 작성될 워크시","트가 같은 경우에만 원본 데이터에 연결을 적용할 수 있다 ‘ ’ ."]},{"n":37,"s":2,"a":1,"p":"37. 다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은? 원본 데이터가 변경되면 피벗 테이블의 데이터도 자동으로","c":["변경된다. 외부 데이터를 대상으로 피벗 테이블을 작성할 수 있다.","피벗 테이블을 작성한 후에 사용자가 새로운 수식을 추가하여","표시할 수 있다. 많의 양의 자료를 분석하여 다양한 형태로 요약하여 보여주는","기능이다."]},{"n":38,"s":2,"a":2,"p":"- 38. 다음 중 매크로 기록과 실행에 관련된 항목들의 설명으로 옳지 않은 것은? 엑셀을 사용할 때마다 매크로를 사용할 수 있게 하려면 매크로","c":["저장 위치를 개인용 매크로 통합 문서를 선택한다 ‘ ’ . 와 영문 문자를 조합하여 매크로의 바로 가기 키를 지정 [Alt]","할 수 있다. 매크로 기록 기능을 통해 작성된 매크로는 편집기에서 ‘VBA ’","실행할 수 있다. 매크로 기록 기능을 이용할 때 기본 저장 위치는 현재 통합 ‘","문서가 된다 ’ ."]},{"n":39,"s":2,"a":2,"p":"39. 다음 중 워크시트에 데이터를 입력하는 방법에 대한 설명으로 옳지 않은 것은? 날짜 데이터를 입력하면 기본적으로 셀의 오른쪽에 정렬된다.","c":["과 같이 입력하면 기본적으로 셀의 오른쪽에 정렬된다 ‘3 .","수식 또는 함수 식을 입력할 때는 기호를 붙여 입력한다 = .","여러 개의 셀에 동일한 데이터를 한번에 입력할 때 범위는","연속적으로 지정하지 않아도 된다."]},{"n":40,"s":2,"a":3,"p":"40. 아래의 시트에서 횟수에 따른 택배비를 계산하려고 한다횟수가 . 이하면 초과 이하면 초과면 무료로 표시하기 5 2000, 5 9 3000, 9 위해 셀에 입력해야 할 수식으로 옳지 않은 것은 [C2] ?
